<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pomodoro">
  <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <title>Homework Pomodoro — Yoshiro</title>
  <link rel="icon" type="image/x-icon" href="/favistuff/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favistuff/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favistuff/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/favistuff/apple-touch-icon.png">
  <link rel="manifest" href="/favistuff/site.webmanifest">
  <meta name="description" content="After-school homework Pomodoro. Queue subjects, run focused sessions with breaks, see your week.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f5f4f0;
      --bg2: #eeecea;
      --text: #1a1a1a;
      --muted: #888;
      --line: #d8d6d0;
      --tag-bg: #e8e6e2;
      --work: #7a9490;
      --break: #a08b7a;
      --warn: #c46b5a;
    }

    body.dark {
      --bg: #111110;
      --bg2: #1a1917;
      --text: #e8e6e2;
      --muted: #666;
      --line: #2a2926;
      --tag-bg: #1e1d1b;
      --work: #8aa9a4;
      --break: #b8a190;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      transition: background .2s, color .2s;
    }

    /* theme toggle (matches tools.html) */
    .theme-toggle {
      position: fixed; top: max(1.5rem, env(safe-area-inset-top)); right: max(1.5rem, env(safe-area-inset-right));
      display: flex; gap: .1rem; z-index: 300;
    }
    .theme-btn {
      font-family: 'DM Mono', monospace; font-size: 1rem;
      color: var(--line); background: none; border: none; cursor: pointer;
      padding: .15rem .3rem; line-height: 1; transition: color .2s; user-select: none;
    }
    .theme-btn:hover { color: var(--muted); }
    .theme-btn.active { color: var(--text); }

    .back-link {
      position: fixed; top: max(1.5rem, env(safe-area-inset-top)); left: max(1.5rem, env(safe-area-inset-left));
      font-family: 'DM Mono', monospace; font-size: .7rem;
      color: var(--line); text-decoration: none; letter-spacing: .06em;
      transition: color .2s; z-index: 300;
    }
    .back-link:hover { color: var(--muted); }

    .page { max-width: 720px; margin: 0 auto; padding: 0 2rem 4rem; }

    header {
      padding: 5rem 0 3rem;
      border-bottom: 1px solid var(--line);
      opacity: 0; animation: fadeUp .6s ease .1s forwards;
    }
    .header-label {
      font-family: 'DM Mono', monospace; font-size: .7rem; color: var(--muted);
      letter-spacing: .12em; text-transform: uppercase; margin-bottom: 1rem;
    }
    h1 {
      font-size: clamp(2.4rem, 7vw, 3.4rem);
      font-weight: 500; letter-spacing: -.03em; line-height: 1;
      margin-bottom: 1rem;
    }
    .tagline { font-size: 1rem; font-weight: 300; color: var(--muted); max-width: 460px; }

    section {
      padding: 3rem 0;
      border-bottom: 1px solid var(--line);
      opacity: 0; transform: translateY(16px);
      animation: fadeUp .6s ease forwards;
    }
    section:nth-of-type(1) { animation-delay: .2s; }
    section:nth-of-type(2) { animation-delay: .3s; }
    section:nth-of-type(3) { animation-delay: .4s; }
    section:last-of-type { border-bottom: none; }

    .section-label {
      font-family: 'DM Mono', monospace; font-size: .65rem;
      letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
      margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: baseline;
    }
    .section-sub { font-family: 'DM Mono', monospace; font-size: .65rem; color: var(--line); letter-spacing: .08em; }

    /* hero / timer */
    .hero {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-left: 3px solid var(--work);
      padding: 2.25rem 2rem 2rem;
      transition: border-left-color .4s;
    }
    .hero.break { border-left-color: var(--break); }
    .hero.idle { border-left-color: var(--line); }

    .phase-row {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 1.1rem;
    }
    .phase {
      font-family: 'DM Mono', monospace; font-size: .7rem;
      letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    }
    .phase strong { color: var(--text); font-weight: 500; }
    .phase.work strong { color: var(--work); }
    .phase.break strong { color: var(--break); }

    .subject-name {
      font-family: 'DM Mono', monospace; font-size: .75rem;
      color: var(--muted); letter-spacing: .04em;
    }

    .clock {
      font-family: 'DM Mono', monospace;
      font-size: clamp(4.5rem, 14vw, 6.5rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -.02em;
      margin: .4rem 0 1rem;
      font-variant-numeric: tabular-nums;
    }
    .clock.warn { color: var(--warn); }

    .progress {
      height: 4px; background: var(--line); border-radius: 2px; overflow: hidden;
      margin-bottom: 1.4rem;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: var(--work);
      transition: width 1s linear, background .4s;
    }
    .hero.break .progress-fill { background: var(--break); }

    .controls {
      display: flex; flex-wrap: wrap; gap: .55rem;
    }
    .btn {
      font-family: 'DM Mono', monospace;
      font-size: .72rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      padding: .65rem 1.1rem;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      border-radius: 2px;
    }
    .btn:hover:not(:disabled) { background: var(--tag-bg); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn.primary {
      background: var(--text); color: var(--bg); border-color: var(--text);
    }
    .btn.primary:hover:not(:disabled) { opacity: .85; background: var(--text); }
    .btn.danger:hover:not(:disabled) { color: var(--warn); border-color: var(--warn); }

    /* queue */
    .queue { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); }
    .queue-item {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: .75rem;
      padding: .85rem 1rem;
      background: var(--bg);
    }
    .queue-item.current { background: var(--bg2); }
    .queue-item.done { opacity: .5; }
    .queue-handle {
      font-family: 'DM Mono', monospace; font-size: .65rem;
      color: var(--muted); letter-spacing: .08em;
      width: 1.5rem; text-align: center;
    }
    .queue-item.current .queue-handle { color: var(--work); }
    .queue-item.done .queue-handle { color: var(--muted); text-decoration: line-through; }
    .queue-name { font-size: .95rem; font-weight: 400; }
    .queue-mins {
      font-family: 'DM Mono', monospace; font-size: .7rem;
      color: var(--muted); letter-spacing: .04em;
      background: var(--tag-bg); padding: .25rem .55rem; border-radius: 2px;
    }
    .queue-actions { display: flex; gap: .2rem; }
    .icon-btn {
      background: none; border: none; cursor: pointer;
      color: var(--line); padding: .25rem .4rem;
      font-family: 'DM Mono', monospace; font-size: .85rem;
      line-height: 1; transition: color .15s;
    }
    .icon-btn:hover { color: var(--muted); }
    .icon-btn.danger:hover { color: var(--warn); }

    .queue-empty {
      padding: 1.5rem 1rem;
      text-align: center; color: var(--muted);
      font-family: 'DM Mono', monospace; font-size: .72rem;
      letter-spacing: .06em;
      background: var(--bg);
    }

    /* add form */
    .add-form {
      display: grid;
      grid-template-columns: 1fr 5rem auto;
      gap: .5rem;
      margin-top: 1.25rem;
    }
    .add-form input {
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      padding: .65rem .85rem;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 2px;
      outline: none;
      transition: border-color .15s;
    }
    .add-form input:focus { border-color: var(--muted); }
    .add-form input[type="number"] { font-family: 'DM Mono', monospace; text-align: center; }
    .add-form input::placeholder { color: var(--line); }
    @media (max-width: 520px) {
      .add-form { grid-template-columns: 1fr 4.5rem; }
      .add-form .btn { grid-column: 1 / -1; }
    }

    /* settings */
    .settings-row {
      display: flex; flex-wrap: wrap; gap: 1.5rem 2rem;
      margin-top: 1.25rem;
    }
    .setting {
      display: flex; flex-direction: column; gap: .35rem;
    }
    .setting label {
      font-family: 'DM Mono', monospace; font-size: .62rem;
      letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    }
    .setting input[type="number"] {
      font-family: 'DM Mono', monospace; font-size: .85rem;
      width: 5rem; padding: .45rem .6rem;
      background: var(--bg); border: 1px solid var(--line);
      color: var(--text); border-radius: 2px; text-align: center;
      outline: none;
    }
    .setting input:focus { border-color: var(--muted); }
    .toggle-row {
      display: flex; align-items: center; gap: .55rem;
      font-family: 'DM Mono', monospace; font-size: .72rem;
      letter-spacing: .06em; color: var(--muted); cursor: pointer;
      user-select: none;
    }
    .toggle-row input { accent-color: var(--text); width: 14px; height: 14px; cursor: pointer; }

    /* stats */
    .stats-today {
      display: grid; grid-template-columns: 1fr auto; gap: .35rem 1rem;
      margin-bottom: 1.75rem;
    }
    .stat-name { font-size: .9rem; }
    .stat-val {
      font-family: 'DM Mono', monospace; font-size: .8rem;
      color: var(--muted); letter-spacing: .04em;
      font-variant-numeric: tabular-nums;
    }
    .stat-total {
      border-top: 1px solid var(--line); padding-top: .5rem; margin-top: .25rem;
      font-weight: 500;
    }
    .stat-total .stat-val { color: var(--text); }

    .week-bars {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: .4rem;
      height: 80px;
      align-items: end;
      margin-bottom: .6rem;
    }
    .week-bar {
      background: var(--tag-bg);
      border-radius: 2px 2px 0 0;
      position: relative;
      transition: background .15s;
      min-height: 2px;
    }
    .week-bar.has-data { background: var(--work); }
    .week-bar.today { outline: 1px solid var(--text); outline-offset: 1px; }
    .week-bar:hover .week-bar-tip { opacity: 1; }
    .week-bar-tip {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      font-family: 'DM Mono', monospace; font-size: .65rem;
      background: var(--text); color: var(--bg);
      padding: .2rem .45rem; border-radius: 2px;
      white-space: nowrap; margin-bottom: .35rem;
      opacity: 0; transition: opacity .15s; pointer-events: none;
    }
    .week-labels {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: .4rem;
      font-family: 'DM Mono', monospace; font-size: .6rem;
      color: var(--muted); letter-spacing: .06em; text-align: center;
    }

    .empty-note {
      font-family: 'DM Mono', monospace; font-size: .72rem;
      color: var(--muted); letter-spacing: .04em;
      padding: 1rem 0; text-align: center;
    }

    footer {
      padding: 2.5rem 0 1rem;
      text-align: left;
    }
    .footer-text {
      font-family: 'DM Mono', monospace; font-size: .65rem;
      color: var(--line); letter-spacing: .1em; text-transform: uppercase;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* toast */
    .toast {
      position: fixed; bottom: max(2rem, calc(env(safe-area-inset-bottom) + 1rem)); left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: var(--text); color: var(--bg);
      padding: .7rem 1.2rem;
      border-radius: 4px;
      font-family: 'DM Mono', monospace; font-size: .75rem;
      letter-spacing: .08em;
      box-shadow: 0 6px 24px rgba(0,0,0,.18);
      z-index: 400; max-width: calc(100vw - 2rem);
      transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .25s;
      opacity: 0; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
    .toast a, .toast button.toast-act {
      color: var(--bg); text-decoration: underline;
      margin-left: .8rem; background: none; border: none;
      font-family: inherit; font-size: inherit; letter-spacing: inherit;
      cursor: pointer; padding: 0;
    }
    .toast button.toast-act:hover { opacity: .8; }

    /* small screens */
    @media (max-width: 520px) {
      .page { padding: 0 1.25rem 3rem; }
      .hero { padding: 1.5rem 1.25rem 1.25rem; }
      header { padding: 4rem 0 2.5rem; }
      section { padding: 2.25rem 0; }
    }
  </style>
</head>
<body>

  <div class="theme-toggle">
    <button class="theme-btn" id="btn-light" onclick="setTheme('light')" title="Light">+</button>
    <button class="theme-btn" id="btn-dark" onclick="setTheme('dark')" title="Dark">−</button>
  </div>
  <a class="back-link" href="/tools.html">← tools</a>

  <div class="page">

    <header>
      <p class="header-label">Yoshiro · School</p>
      <h1>Homework Pomodoro</h1>
      <p class="tagline">Line up your homework, set how long each one gets, and run focused sessions with breaks between. Tracks your week so you can see where the time actually went.</p>
    </header>

    <section id="timer-section">
      <div class="hero idle" id="hero">
        <div class="phase-row">
          <span class="phase" id="phase">Ready</span>
          <span class="subject-name" id="subject">—</span>
        </div>
        <div class="clock" id="clock">00:00</div>
        <div class="progress"><div class="progress-fill" id="progress"></div></div>
        <div class="controls">
          <button class="btn primary" id="btn-start">Start</button>
          <button class="btn" id="btn-pause" disabled>Pause</button>
          <button class="btn" id="btn-complete" disabled title="Finish current subject early — credits the actual time you spent">Done early ✓</button>
          <button class="btn" id="btn-skip" disabled title="Move on without crediting this subject">Skip →</button>
          <button class="btn danger" id="btn-reset">Reset day</button>
        </div>
      </div>
    </section>

    <section id="queue-section">
      <div class="section-label">
        <span>Today's queue</span>
        <span class="section-sub" id="queue-meta">0 items</span>
      </div>
      <div class="queue" id="queue"></div>
      <form class="add-form" id="add-form" autocomplete="off">
        <input type="text" id="add-name" placeholder="Subject (e.g. Math homework)" maxlength="40" required>
        <input type="number" id="add-mins" placeholder="min" min="1" max="240" value="30" required>
        <button class="btn primary" type="submit">Add</button>
      </form>
      <div class="settings-row">
        <div class="setting">
          <label for="break-mins">Short break</label>
          <input type="number" id="break-mins" min="1" max="60" value="5">
        </div>
        <div class="setting">
          <label for="long-break-mins">Long break</label>
          <input type="number" id="long-break-mins" min="1" max="60" value="15">
        </div>
        <div class="setting">
          <label for="long-every">Long every</label>
          <input type="number" id="long-every" min="2" max="10" value="4">
        </div>
        <label class="toggle-row">
          <input type="checkbox" id="auto-advance" checked>
          Auto-start next
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="sound-on" checked>
          Chime
        </label>
      </div>
    </section>

    <section id="stats-section">
      <div class="section-label">
        <span>Today</span>
        <span class="section-sub" id="today-date"></span>
      </div>
      <div class="stats-today" id="today-stats"></div>

      <div class="section-label" style="margin-top: 2rem;">
        <span>This week</span>
        <span class="section-sub" id="week-total"></span>
      </div>
      <div class="week-bars" id="week-bars"></div>
      <div class="week-labels" id="week-labels"></div>
    </section>

    <footer>
      <p class="footer-text">Yoshiro · sn4k.org</p>
    </footer>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ─────────────── Theme ───────────────
    function setTheme(t) {
      document.body.classList.toggle('dark', t === 'dark');
      document.getElementById('btn-light').classList.toggle('active', t === 'light');
      document.getElementById('btn-dark').classList.toggle('active', t === 'dark');
      localStorage.setItem('theme', t);
    }
    setTheme(localStorage.getItem('theme') || 'light');

    // ─────────────── Storage keys ───────────────
    const K_STATE = 'pomo.state.v1';
    const K_HIST  = 'pomo.history.v1';
    const K_ASSIGNMENTS = 'assignments.items.v1';

    // ─────────────── Date helpers ───────────────
    const dateKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const todayKey = () => dateKey(new Date());
    const last7Keys = () => {
      const out = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        out.push(dateKey(d));
      }
      return out;
    };
    const weekdayLabel = (key) => {
      const [y,m,d] = key.split('-').map(Number);
      return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(y, m-1, d).getDay()];
    };
    const fmtMins = (mins) => {
      if (mins < 60) return `${mins}m`;
      const h = Math.floor(mins/60), m = mins % 60;
      return m ? `${h}h ${m}m` : `${h}h`;
    };
    const mmss = (mm, ss) => `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
    function pruneHistory(h) {
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
      const cutKey = dateKey(cutoff);
      Object.keys(h).forEach(k => { if (k < cutKey) delete h[k]; });
    }
    const isLongBreak = (s) => s.completedPomos > 0 && (s.completedPomos % s.settings.longEvery) === 0;

    // ─────────────── State ───────────────
    const defaultState = () => ({
      date: todayKey(),
      queue: [],              // [{id, name, plannedMins}]
      currentIdx: 0,
      phase: 'idle',          // idle | work | break | done | paused-work | paused-break
      endsAt: 0,              // epoch ms when current phase ends
      remainingMs: 0,         // when paused
      completedPomos: 0,      // count of finished work sessions today
      settings: { breakMins: 5, longBreakMins: 15, longEvery: 4, autoAdvance: true, sound: true }
    });

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(K_STATE);
        if (!raw) return defaultState();
        const s = JSON.parse(raw);
        if (s.date !== todayKey()) {
          // new day → archive prior day from state into history first
          archiveStateToHistory(s);
          return defaultState();
        }
        return { ...defaultState(), ...s, settings: { ...defaultState().settings, ...(s.settings||{}) } };
      } catch (e) {
        return defaultState();
      }
    }
    function saveState() { localStorage.setItem(K_STATE, JSON.stringify(state)); }

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(K_HIST) || '{}'); }
      catch { return {}; }
    }
    function saveHistory(h) { localStorage.setItem(K_HIST, JSON.stringify(h)); }

    function archiveStateToHistory(s) {
      if (!s || !s.queue) return;
      const completed = s.queue
        .slice(0, s.phase === 'done' ? s.queue.length : s.currentIdx)
        .map(q => ({ name: q.name, mins: q.plannedMins }));
      if (!completed.length) return;
      const h = loadHistory();
      h[s.date] = (h[s.date] || []).concat(completed);
      pruneHistory(h);
      saveHistory(h);
    }

    // ─────────────── DOM ───────────────
    const el = {
      hero: document.getElementById('hero'),
      phase: document.getElementById('phase'),
      subject: document.getElementById('subject'),
      clock: document.getElementById('clock'),
      progress: document.getElementById('progress'),
      btnStart: document.getElementById('btn-start'),
      btnPause: document.getElementById('btn-pause'),
      btnComplete: document.getElementById('btn-complete'),
      btnSkip: document.getElementById('btn-skip'),
      btnReset: document.getElementById('btn-reset'),
      toast: document.getElementById('toast'),
      queue: document.getElementById('queue'),
      queueMeta: document.getElementById('queue-meta'),
      addForm: document.getElementById('add-form'),
      addName: document.getElementById('add-name'),
      addMins: document.getElementById('add-mins'),
      breakMins: document.getElementById('break-mins'),
      longBreakMins: document.getElementById('long-break-mins'),
      longEvery: document.getElementById('long-every'),
      autoAdvance: document.getElementById('auto-advance'),
      soundOn: document.getElementById('sound-on'),
      todayStats: document.getElementById('today-stats'),
      todayDate: document.getElementById('today-date'),
      weekBars: document.getElementById('week-bars'),
      weekLabels: document.getElementById('week-labels'),
      weekTotal: document.getElementById('week-total'),
    };

    // ─────────────── Settings UI ───────────────
    function syncSettingsToUI() {
      el.breakMins.value     = state.settings.breakMins;
      el.longBreakMins.value = state.settings.longBreakMins;
      el.longEvery.value     = state.settings.longEvery;
      el.autoAdvance.checked = !!state.settings.autoAdvance;
      el.soundOn.checked     = !!state.settings.sound;
    }
    [['breakMins', el.breakMins, 'int'],
     ['longBreakMins', el.longBreakMins, 'int'],
     ['longEvery', el.longEvery, 'int'],
     ['autoAdvance', el.autoAdvance, 'bool'],
     ['sound', el.soundOn, 'bool']].forEach(([key, input, type]) => {
      input.addEventListener('change', () => {
        if (type === 'bool') state.settings[key] = input.checked;
        else {
          const v = parseInt(input.value, 10);
          if (!isNaN(v) && v > 0) state.settings[key] = v;
          else input.value = state.settings[key];
        }
        saveState();
      });
    });

    // ─────────────── Queue ───────────────
    function addToQueue(name, mins) {
      const trimmed = name.trim();
      if (!trimmed) return;
      const m = Math.max(1, Math.min(240, parseInt(mins, 10) || 25));
      state.queue.push({ id: crypto.randomUUID().slice(0,8), name: trimmed, plannedMins: m });
      saveState();
      renderQueue();
      updateControls();
    }
    function removeFromQueue(id) {
      const idx = state.queue.findIndex(q => q.id === id);
      if (idx < 0) return;
      if (idx < state.currentIdx) state.currentIdx--;
      else if (idx === state.currentIdx && state.phase !== 'idle' && state.phase !== 'done') {
        // removing the active subject: cancel current phase
        stopTimer();
        state.phase = 'idle';
        state.endsAt = 0;
        state.remainingMs = 0;
      }
      state.queue.splice(idx, 1);
      if (state.currentIdx >= state.queue.length) {
        state.currentIdx = Math.max(0, state.queue.length - 1);
        if (state.queue.length === 0) { state.phase = 'idle'; }
      }
      saveState();
      renderQueue();
      updateClockDisplay();
      updateControls();
    }
    function moveQueue(id, dir) {
      const idx = state.queue.findIndex(q => q.id === id);
      const target = idx + dir;
      if (idx < 0 || target < 0 || target >= state.queue.length) return;
      // don't reorder already-completed items
      if (idx < state.currentIdx || target < state.currentIdx) return;
      // don't move the currently-running one while running
      if ((idx === state.currentIdx || target === state.currentIdx) && (state.phase === 'work' || state.phase === 'paused-work')) return;
      [state.queue[idx], state.queue[target]] = [state.queue[target], state.queue[idx]];
      saveState();
      renderQueue();
    }

    function renderQueue() {
      el.queue.innerHTML = '';
      if (state.queue.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'queue-empty';
        empty.textContent = 'No subjects yet — add one below.';
        el.queue.appendChild(empty);
      } else {
        state.queue.forEach((q, i) => {
          const row = document.createElement('div');
          row.className = 'queue-item';
          if (i < state.currentIdx) row.classList.add('done');
          else if (i === state.currentIdx && state.phase !== 'idle' && state.phase !== 'done') row.classList.add('current');
          row.innerHTML = `
            <span class="queue-handle">${String(i+1).padStart(2,'0')}</span>
            <span class="queue-name"></span>
            <span class="queue-mins">${q.plannedMins}m</span>
            <span class="queue-actions">
              <button class="icon-btn" data-action="up"   title="Move up">↑</button>
              <button class="icon-btn" data-action="down" title="Move down">↓</button>
              <button class="icon-btn danger" data-action="remove" title="Remove">×</button>
            </span>`;
          row.querySelector('.queue-name').textContent = q.name;
          row.querySelectorAll('.icon-btn').forEach(b => {
            b.addEventListener('click', () => {
              const a = b.dataset.action;
              if (a === 'remove') removeFromQueue(q.id);
              if (a === 'up')     moveQueue(q.id, -1);
              if (a === 'down')   moveQueue(q.id, +1);
            });
          });
          el.queue.appendChild(row);
        });
      }
      el.queueMeta.textContent = state.queue.length
        ? `${state.queue.length} item${state.queue.length===1?'':'s'} · ${fmtMins(state.queue.reduce((a,q)=>a+q.plannedMins,0))} planned`
        : '0 items';
    }

    el.addForm.addEventListener('submit', (e) => {
      e.preventDefault();
      addToQueue(el.addName.value, el.addMins.value);
      el.addName.value = '';
      el.addMins.value = 30;
      el.addName.focus();
    });

    // ─────────────── Timer engine ───────────────
    let tickHandle = null;
    function startTimer() {
      if (tickHandle) cancelAnimationFrame(tickHandle);
      const tick = () => {
        renderClock();
        const ms = state.endsAt - Date.now();
        if (ms <= 0) {
          onPhaseEnd();
          return;
        }
        tickHandle = requestAnimationFrame(tick);
      };
      tick();
    }
    function stopTimer() {
      if (tickHandle) cancelAnimationFrame(tickHandle);
      tickHandle = null;
    }

    function currentPhaseTotalMs() {
      if (state.phase === 'work' || state.phase === 'paused-work') {
        const cur = state.queue[state.currentIdx];
        return cur ? cur.plannedMins * 60 * 1000 : 0;
      }
      if (state.phase === 'break' || state.phase === 'paused-break') {
        const isLong = isLongBreak(state);
        return (isLong ? state.settings.longBreakMins : state.settings.breakMins) * 60 * 1000;
      }
      return 0;
    }

    let lastRenderedSec = -1;
    let lastWarn = false;
    function renderClock() {
      let ms = 0, total = 0;
      if (state.phase === 'work' || state.phase === 'break') {
        ms = Math.max(0, state.endsAt - Date.now());
        total = currentPhaseTotalMs();
      } else if (state.phase === 'paused-work' || state.phase === 'paused-break') {
        ms = state.remainingMs;
        total = currentPhaseTotalMs();
      } else if (state.phase === 'idle' && state.queue[state.currentIdx]) {
        ms = state.queue[state.currentIdx].plannedMins * 60 * 1000;
        total = ms;
      } else if (state.phase === 'done') {
        ms = 0; total = 1;
      }
      const totalSec = Math.ceil(ms / 1000);
      if (totalSec === lastRenderedSec) return;
      lastRenderedSec = totalSec;
      const mm = Math.floor(totalSec / 60);
      const ss = totalSec % 60;
      el.clock.textContent = mmss(mm, ss);
      const warn = state.phase === 'work' && ms < 60000 && ms > 0;
      if (warn !== lastWarn) { el.clock.classList.toggle('warn', warn); lastWarn = warn; }
      const pct = total > 0 ? (1 - ms / total) * 100 : 0;
      el.progress.style.width = `${Math.min(100, Math.max(0, pct))}%`;
      updateTitle(mm, ss);
    }
    function invalidateClockCache() { lastRenderedSec = -1; lastWarn = false; }

    function updateClockDisplay() {
      invalidateClockCache();
      el.hero.classList.remove('idle');
      el.hero.classList.remove('break');
      let phaseText = 'Ready', phaseClass = '';
      const cur = state.queue[state.currentIdx];
      if (state.phase === 'work')        { phaseText = '<strong>Focus</strong>';      phaseClass = 'work'; }
      else if (state.phase === 'paused-work')  { phaseText = 'Focus · <strong>paused</strong>'; phaseClass = 'work'; }
      else if (state.phase === 'break')        { phaseText = '<strong>Break</strong>'; phaseClass = 'break'; el.hero.classList.add('break'); }
      else if (state.phase === 'paused-break') { phaseText = 'Break · <strong>paused</strong>'; phaseClass = 'break'; el.hero.classList.add('break'); }
      else if (state.phase === 'done')         { phaseText = '<strong>All done</strong>'; el.hero.classList.add('idle'); }
      else                                     { phaseText = 'Ready'; el.hero.classList.add('idle'); }
      el.phase.className = 'phase ' + phaseClass;
      el.phase.innerHTML = phaseText;
      if (state.phase === 'break' || state.phase === 'paused-break') {
        const isLong = isLongBreak(state);
        el.subject.textContent = isLong ? 'long break' : 'short break';
      } else if (cur && state.queue.length) {
        el.subject.textContent = cur.name;
      } else {
        el.subject.textContent = '—';
      }
      renderClock();
    }

    function updateControls() {
      const hasQueue = state.queue.length > 0;
      const hasMore  = state.currentIdx < state.queue.length;
      const isWorkish = state.phase === 'work' || state.phase === 'paused-work';
      if (state.phase === 'idle' || state.phase === 'done') {
        el.btnStart.textContent = state.phase === 'done' ? 'Restart' : 'Start';
        el.btnStart.disabled = !hasQueue;
        el.btnPause.disabled = true;
        el.btnPause.textContent = 'Pause';
        el.btnSkip.disabled = !hasMore || state.phase === 'done';
      } else if (state.phase === 'work' || state.phase === 'break') {
        el.btnStart.textContent = 'Running…';
        el.btnStart.disabled = true;
        el.btnPause.disabled = false;
        el.btnPause.textContent = 'Pause';
        el.btnSkip.disabled = false;
      } else { // paused
        el.btnStart.textContent = 'Resume';
        el.btnStart.disabled = false;
        el.btnPause.disabled = true;
        el.btnPause.textContent = 'Paused';
        el.btnSkip.disabled = false;
      }
      el.btnComplete.disabled = !isWorkish;
    }

    // ─────────────── Phase transitions ───────────────
    function startWork() {
      const cur = state.queue[state.currentIdx];
      if (!cur) { state.phase = 'done'; saveState(); refreshAll(); return; }
      state.phase = 'work';
      state.endsAt = Date.now() + cur.plannedMins * 60 * 1000;
      state.remainingMs = 0;
      saveState();
      startTimer();
      refreshAll();
    }
    function startBreak() {
      const isLong = isLongBreak(state);
      const mins = isLong ? state.settings.longBreakMins : state.settings.breakMins;
      state.phase = 'break';
      state.endsAt = Date.now() + mins * 60 * 1000;
      state.remainingMs = 0;
      saveState();
      startTimer();
      refreshAll();
    }

    function finishWork(actualMins) {
      const cur = state.queue[state.currentIdx];
      if (cur) {
        state.completedPomos++;
        const credited = Math.max(1, Math.round(actualMins != null ? actualMins : cur.plannedMins));
        appendHistoryToday(cur.name, credited);
        if (cur.sourceAssignmentId) offerAssignmentDone(cur);
      }
      state.currentIdx++;
      chime('end');
      flashTitle('Break time');
      if (state.currentIdx >= state.queue.length) {
        state.phase = 'done';
        state.endsAt = 0;
        state.remainingMs = 0;
        saveState();
        refreshAll();
        return;
      }
      if (state.settings.autoAdvance) {
        startBreak();
      } else {
        state.phase = 'paused-break';
        state.remainingMs = (isLongBreak(state) ? state.settings.longBreakMins : state.settings.breakMins) * 60 * 1000;
        state.endsAt = 0;
        saveState();
        refreshAll();
      }
    }

    function onPhaseEnd() {
      stopTimer();
      if (state.phase === 'work') {
        finishWork(null); // natural end: credit full planned minutes
      } else if (state.phase === 'break') {
        chime('start');
        flashTitle('Back to it');
        if (state.settings.autoAdvance) {
          startWork();
        } else {
          state.phase = 'paused-work';
          const cur = state.queue[state.currentIdx];
          state.remainingMs = cur ? cur.plannedMins * 60 * 1000 : 0;
          state.endsAt = 0;
          saveState();
          refreshAll();
        }
      }
    }

    function appendHistoryToday(name, mins) {
      const h = loadHistory();
      const k = todayKey();
      h[k] = h[k] || [];
      h[k].push({ name, mins });
      pruneHistory(h);
      saveHistory(h);
      renderStats();
    }

    // ─────────────── Buttons ───────────────
    el.btnStart.addEventListener('click', () => {
      if (state.phase === 'idle') {
        if (!state.queue.length) return;
        startWork();
      } else if (state.phase === 'paused-work') {
        state.phase = 'work';
        state.endsAt = Date.now() + state.remainingMs;
        state.remainingMs = 0;
        saveState();
        startTimer();
        refreshAll();
      } else if (state.phase === 'paused-break') {
        state.phase = 'break';
        state.endsAt = Date.now() + state.remainingMs;
        state.remainingMs = 0;
        saveState();
        startTimer();
        refreshAll();
      } else if (state.phase === 'done') {
        // restart: reset progress, keep queue
        state.currentIdx = 0;
        state.completedPomos = 0;
        startWork();
      }
    });

    el.btnPause.addEventListener('click', () => {
      if (state.phase === 'work') {
        state.remainingMs = Math.max(0, state.endsAt - Date.now());
        state.phase = 'paused-work';
        state.endsAt = 0;
        stopTimer();
        saveState();
        refreshAll();
      } else if (state.phase === 'break') {
        state.remainingMs = Math.max(0, state.endsAt - Date.now());
        state.phase = 'paused-break';
        state.endsAt = 0;
        stopTimer();
        saveState();
        refreshAll();
      }
    });

    el.btnSkip.addEventListener('click', () => {
      stopTimer();
      if (state.phase === 'work' || state.phase === 'paused-work') {
        // skip current subject without crediting it
        state.currentIdx++;
        if (state.currentIdx >= state.queue.length) {
          state.phase = 'done'; state.endsAt = 0; state.remainingMs = 0;
          saveState(); refreshAll(); return;
        }
        startWork();
      } else if (state.phase === 'break' || state.phase === 'paused-break') {
        startWork();
      } else if (state.phase === 'idle' && state.queue.length) {
        // skip from idle: just bump
        state.currentIdx = Math.min(state.queue.length, state.currentIdx + 1);
        if (state.currentIdx >= state.queue.length) state.phase = 'done';
        saveState(); refreshAll();
      }
    });

    el.btnReset.addEventListener('click', () => {
      if (!confirm('Reset today\'s queue and timer? Weekly history is kept.')) return;
      stopTimer();
      state = defaultState();
      saveState();
      refreshAll();
    });

    el.btnComplete.addEventListener('click', () => {
      if (state.phase !== 'work' && state.phase !== 'paused-work') return;
      const cur = state.queue[state.currentIdx];
      if (!cur) return;
      const total = cur.plannedMins * 60 * 1000;
      let remaining;
      if (state.phase === 'work') remaining = Math.max(0, state.endsAt - Date.now());
      else                        remaining = state.remainingMs;
      const elapsedMs = Math.max(0, total - remaining);
      const actualMins = elapsedMs / 60000;
      stopTimer();
      finishWork(actualMins);
    });

    // ─────────────── Toast ───────────────
    let toastTimer = null;
    function hideToast() {
      if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
      el.toast.classList.remove('show');
    }
    function showToast(msg, opts) {
      opts = opts || {};
      el.toast.innerHTML = '';
      el.toast.appendChild(document.createTextNode(msg));
      (opts.actions || []).forEach(act => {
        const b = document.createElement('button');
        b.className = 'toast-act';
        b.type = 'button';
        b.textContent = act.label;
        b.addEventListener('click', () => { hideToast(); act.onClick(); });
        el.toast.appendChild(b);
      });
      el.toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.toast.classList.remove('show'), opts.duration || 4000);
    }

    // ─────────────── Assignment integration ───────────────
    function offerAssignmentDone(queueItem) {
      const aid = queueItem.sourceAssignmentId;
      if (!aid) return;
      let items;
      try { items = JSON.parse(localStorage.getItem(K_ASSIGNMENTS) || '[]'); } catch { return; }
      const assignment = items.find(x => x.id === aid);
      if (!assignment || assignment.status === 'done') return;
      const label = assignment.title.length > 40 ? assignment.title.slice(0, 38) + '…' : assignment.title;
      showToast(`Finished "${label}".`, {
        duration: 9000,
        actions: [{
          label: 'Mark done',
          onClick: () => {
            try {
              const cur = JSON.parse(localStorage.getItem(K_ASSIGNMENTS) || '[]');
              const a = cur.find(x => x.id === aid);
              if (a && a.status !== 'done') {
                a.status = 'done';
                a.completedAt = Date.now();
                localStorage.setItem(K_ASSIGNMENTS, JSON.stringify(cur));
                showToast(`Marked "${label}" done.`, { duration: 2400 });
              }
            } catch {}
          }
        }]
      });
    }

    // ─────────────── Cross-tab sync ───────────────
    window.addEventListener('storage', (e) => {
      if (e.key !== K_STATE || !e.newValue) return;
      try {
        const remote = JSON.parse(e.newValue);
        if (!remote || remote.date !== todayKey()) return;
        stopTimer();
        state = { ...defaultState(), ...remote, settings: { ...defaultState().settings, ...(remote.settings||{}) } };
        syncSettingsToUI();
        refreshAll();
        resumeFromStorage();
      } catch {}
    });

    // ─────────────── Audio unlock ───────────────
    function unlockAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch {}
      document.removeEventListener('pointerdown', unlockAudio);
      document.removeEventListener('keydown', unlockAudio);
    }
    document.addEventListener('pointerdown', unlockAudio, { once: true });
    document.addEventListener('keydown', unlockAudio, { once: true });

    // ─────────────── Audio (Web Audio chime) ───────────────
    let audioCtx = null;
    function chime(kind) {
      if (!state.settings.sound) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const notes = kind === 'end' ? [880, 660] : [660, 880];
        notes.forEach((f, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.frequency.value = f;
          o.type = 'sine';
          o.connect(g); g.connect(audioCtx.destination);
          const t = now + i * 0.18;
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.22, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
          o.start(t); o.stop(t + 0.6);
        });
      } catch (e) { /* fail silent */ }
    }

    // ─────────────── Title flash ───────────────
    const baseTitle = document.title;
    let titleFlashInterval = null;
    let titleFlashMessage = '';
    function flashTitle(msg) {
      if (!document.hidden) return;
      titleFlashMessage = `⏰ ${msg}`;
      if (titleFlashInterval) clearInterval(titleFlashInterval);
      let on = true;
      titleFlashInterval = setInterval(() => {
        document.title = on ? titleFlashMessage : baseTitle;
        on = !on;
      }, 900);
    }
    function stopTitleFlash() {
      if (titleFlashInterval) { clearInterval(titleFlashInterval); titleFlashInterval = null; }
      document.title = baseTitle;
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) stopTitleFlash(); });
    function updateTitle(mm, ss) {
      if (document.hidden || titleFlashInterval) return;
      let next;
      if (state.phase === 'work' || state.phase === 'break') {
        const tag = state.phase === 'work' ? '●' : '◐';
        next = `${tag} ${mmss(mm, ss)} — ${baseTitle}`;
      } else {
        next = baseTitle;
      }
      if (document.title !== next) document.title = next;
    }

    // ─────────────── Stats ───────────────
    function breakdownFor(entries) {
      const map = new Map();
      entries.forEach(e => map.set(e.name, (map.get(e.name) || 0) + e.mins));
      return [...map.entries()].sort((a,b) => b[1] - a[1]);
    }
    function renderStats() {
      const h = loadHistory();
      const tk = todayKey();
      const items = breakdownFor(h[tk] || []);
      el.todayDate.textContent = tk;
      el.todayStats.innerHTML = '';
      if (items.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-note';
        empty.style.gridColumn = '1 / -1';
        empty.textContent = 'No completed sessions today yet.';
        el.todayStats.appendChild(empty);
      } else {
        let total = 0;
        items.forEach(([name, mins]) => {
          total += mins;
          const nameEl = document.createElement('div'); nameEl.className = 'stat-name'; nameEl.textContent = name;
          const valEl  = document.createElement('div'); valEl.className  = 'stat-val';  valEl.textContent  = fmtMins(mins);
          el.todayStats.appendChild(nameEl); el.todayStats.appendChild(valEl);
        });
        const totalName = document.createElement('div'); totalName.className = 'stat-name stat-total'; totalName.textContent = 'Total';
        const totalVal  = document.createElement('div'); totalVal.className  = 'stat-val stat-total';  totalVal.textContent  = fmtMins(total);
        el.todayStats.appendChild(totalName); el.todayStats.appendChild(totalVal);
      }

      const keys = last7Keys();
      const totals = keys.map(k => (h[k] || []).reduce((a,e) => a + e.mins, 0));
      const max = Math.max(60, ...totals);
      el.weekBars.innerHTML = '';
      el.weekLabels.innerHTML = '';
      let weekTotal = 0;
      keys.forEach((k, i) => {
        weekTotal += totals[i];
        const bar = document.createElement('div');
        bar.className = 'week-bar';
        if (totals[i] > 0) bar.classList.add('has-data');
        if (k === tk) bar.classList.add('today');
        bar.style.height = `${Math.max(2, (totals[i] / max) * 100)}%`;
        const tip = document.createElement('span');
        tip.className = 'week-bar-tip';
        tip.textContent = totals[i] ? fmtMins(totals[i]) : '0';
        bar.appendChild(tip);
        el.weekBars.appendChild(bar);

        const lbl = document.createElement('div');
        lbl.textContent = weekdayLabel(k);
        el.weekLabels.appendChild(lbl);
      });
      el.weekTotal.textContent = weekTotal ? `${fmtMins(weekTotal)} total` : '';
    }

    // ─────────────── Boot ───────────────
    function refreshAll() {
      renderQueue();
      updateClockDisplay();
      updateControls();
      renderStats();
    }

    // resume an in-progress timer after reload
    function resumeFromStorage() {
      if (state.phase === 'work' || state.phase === 'break') {
        if (state.endsAt > Date.now()) {
          startTimer();
        } else {
          // missed the end while the tab was closed — settle it
          onPhaseEnd();
        }
      }
    }

    syncSettingsToUI();
    refreshAll();
    resumeFromStorage();

    // keyboard: space = start/pause
    document.addEventListener('keydown', (e) => {
      if (e.target.matches('input, textarea')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        if (state.phase === 'work' || state.phase === 'break') el.btnPause.click();
        else el.btnStart.click();
      }
    });
  </script>
</body>
</html>
