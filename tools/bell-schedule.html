<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bell">
<meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/favistuff/apple-touch-icon.png">
<link rel="manifest" href="/favistuff/site.webmanifest">
<title>GWHS Bell Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  [data-theme="dark"] {
    --bg: #0a0a0a;
    --card: #181818;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --text2: #cccccc;
    --muted: #888;
    --row-hover: rgba(255,255,255,0.03);
    --cur-row-bg: rgba(200,16,46,0.1);
    --shadow: rgba(0,0,0,0.4);
    --input-bg: #111;
  }
  [data-theme="light"] {
    --bg: #f4f4f6;
    --card: #ffffff;
    --border: #e2e2e2;
    --text: #111111;
    --text2: #333333;
    --muted: #777;
    --row-hover: rgba(0,0,0,0.02);
    --cur-row-bg: rgba(200,16,46,0.06);
    --shadow: rgba(0,0,0,0.08);
    --input-bg: #f8f8f8;
  }
  :root {
    --red:#C8102E; --green:#16a34a; --orange:#ea6c00; --gold:#b8860b;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:var(--bg);color:var(--text);
    font-family:'DM Sans',sans-serif;min-height:100vh;
    overflow-x:hidden;transition:background .3s,color .3s;
  }

  header{
    background:var(--red);
    padding:env(safe-area-inset-top) max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left));
    display:flex;align-items:center;justify-content:space-between;
    height:calc(52px + env(safe-area-inset-top));position:sticky;top:0;z-index:50;
    box-shadow:0 2px 16px rgba(200,16,46,.35);
  }
  header h1{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;color:white;}
  .back-link{
    font-family:'DM Mono',monospace;font-size:12px;letter-spacing:1px;
    color:rgba(255,255,255,.85);text-decoration:none;transition:color .2s;flex-shrink:0;
  }
  .back-link:hover{color:white;}
  .hright{display:flex;align-items:center;gap:10px;}
  #live-clock{font-family:'DM Mono',monospace;font-size:13px;color:rgba(255,255,255,.9);letter-spacing:2px;}
  .theme-btn{
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);
    border-radius:16px;padding:4px 11px;cursor:pointer;
    display:flex;align-items:center;gap:5px;color:white;
    font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;
    transition:background .2s;
  }
  .theme-btn:hover{background:rgba(255,255,255,.28);}

  .container{max-width:860px;margin:0 auto;padding:22px 16px;}

  /* motive */
  .motive{
    background:var(--card);border:1px solid var(--border);border-radius:8px;
    padding:10px 16px;margin-bottom:14px;
    display:flex;align-items:center;gap:10px;
    font-size:13px;color:var(--text2);
    box-shadow:0 1px 4px var(--shadow);
  }
  .motive .me{font-size:17px;}

  /* hero */
  .hero{
    background:var(--card);border:1px solid var(--border);border-left:4px solid var(--red);
    border-radius:8px;padding:22px 26px;margin-bottom:14px;
    position:relative;overflow:hidden;box-shadow:0 2px 10px var(--shadow);
  }
  .hero::after{
    content:'';position:absolute;top:-50px;right:-50px;
    width:220px;height:220px;
    background:radial-gradient(circle,rgba(200,16,46,.06) 0%,transparent 70%);
    pointer-events:none;
  }
  .hl{font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
  .cp{font-family:'Bebas Neue',sans-serif;font-size:46px;line-height:1;color:var(--text);margin-bottom:4px;}
  .ptr{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:16px;}
  .cl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:2px;}
  .ct{font-family:'Bebas Neue',sans-serif;font-size:58px;line-height:1;letter-spacing:2px;transition:color .5s;margin-bottom:12px;}
  .ct.urgent{color:var(--red);}
  .ct.warning{color:var(--orange);}
  .ct.ok{color:var(--green);}
  .pb-wrap{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .pb-fill{height:100%;background:linear-gradient(90deg,var(--red),#ff4d6d);border-radius:3px;transition:width 1s linear;}
  .pb-meta{display:flex;justify-content:space-between;margin-top:4px;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);}
  .nu{
    background:rgba(184,134,11,.07);border:1px solid rgba(184,134,11,.2);
    border-radius:6px;padding:9px 13px;margin-top:14px;font-size:13px;
    display:flex;align-items:center;gap:8px;color:var(--text2);
  }
  .nu-dot{width:7px;height:7px;background:var(--gold);border-radius:50%;flex-shrink:0;animation:pulse 2s infinite;}
  .nu strong{color:var(--gold);}
  [data-theme="light"] .nu strong{color:#7a5c00;}
  [data-theme="light"] .nu{background:rgba(184,134,11,.06);border-color:rgba(140,100,0,.2);}

  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.6);}}

  /* banners */
  .no-school{
    background:var(--card);border:1px solid var(--border);border-radius:8px;
    padding:46px;text-align:center;margin-bottom:14px;
  }
  .no-school h2{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:3px;color:var(--muted);margin-bottom:6px;}
  .no-school p{color:var(--muted);font-size:14px;}

  .done-banner{
    background:var(--card);border:1px solid rgba(22,163,74,.3);border-left:4px solid var(--green);
    border-radius:8px;padding:22px 26px;margin-bottom:14px;text-align:center;
  }
  .done-banner h2{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:2px;color:var(--green);margin-bottom:4px;}
  .done-banner p{color:var(--muted);font-size:13px;}

  .before-banner{
    background:var(--card);border:1px solid var(--border);border-left:4px solid var(--red);
    border-radius:8px;padding:18px 22px;margin-bottom:14px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }
  .before-banner h2{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--red);}
  .before-banner .si{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);}

  /* stats */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:14px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:13px 17px;box-shadow:0 1px 4px var(--shadow);}
  .slbl{font-size:9px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
  .sval{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;color:var(--text);}
  .ssub{font-size:10px;color:var(--muted);margin-top:2px;}

  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .tab{
    font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    padding:6px 14px;border-radius:6px;border:1px solid var(--border);
    background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;
  }
  .tab:hover{border-color:var(--red);color:var(--text);}
  .tab.active{background:var(--red);border-color:var(--red);color:white;}
  .tab.today{border-color:rgba(200,16,46,.4);color:var(--text2);font-weight:600;}
  .tab.final{border-color:rgba(184,134,11,.4);color:var(--gold);}
  .tab.final.active{background:var(--gold);border-color:var(--gold);color:#1a1300;}

  .finals-banner{
    background:var(--card);border:1px solid rgba(184,134,11,.3);border-left:4px solid var(--gold);
    border-radius:8px;padding:14px 20px;margin-bottom:12px;
  }
  .finals-banner .fl{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--gold);margin-bottom:8px;}
  .finals-banner p{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .finals-pills{display:flex;flex-wrap:wrap;gap:6px;}
  .fp{
    font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;
    padding:5px 10px;border-radius:6px;border:1px solid var(--border);
    background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;
  }
  .fp:hover{border-color:var(--gold);}
  .fp.active{background:var(--gold);color:#1a1300;border-color:var(--gold);}
  .fp.is-today{border-color:var(--red);color:var(--red);font-weight:600;}
  .fp.is-today.active{background:var(--red);color:white;border-color:var(--red);}

  /* schedule */
  .sched-card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:18px;box-shadow:0 1px 6px var(--shadow);}
  .sched-hdr{background:var(--red);padding:10px 20px;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:2px;color:white;}
  .sched-row{display:grid;grid-template-columns:1fr 165px 55px;padding:10px 20px;border-bottom:1px solid var(--border);transition:background .15s;align-items:center;}
  .sched-row:last-child{border-bottom:none;}
  .sched-row:hover{background:var(--row-hover);}
  .sched-row.cur{background:var(--cur-row-bg);border-left:3px solid var(--red);padding-left:17px;}
  .sched-row.past{opacity:.35;}
  .rname{font-size:14px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:7px;}
  .rnick{font-size:11px;color:var(--muted);font-weight:400;font-style:italic;}
  .cdot{width:6px;height:6px;background:var(--red);border-radius:50%;flex-shrink:0;animation:pulse 1.5s infinite;}
  .rtime{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);}
  .rdur{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-align:right;}

  /* nickname editor */
  .nick-section{background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:18px;overflow:hidden;box-shadow:0 1px 4px var(--shadow);}
  .nick-hdr{padding:11px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
  .nick-hdr h3{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--text);}
  .nick-hdr .chev{color:var(--muted);font-size:11px;transition:transform .2s;}
  .nick-body{padding:14px 20px;display:none;}
  .nick-body.open{display:block;}
  .nick-body p{font-size:12px;color:var(--muted);margin-bottom:12px;}
  .nick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:7px;}
  .nick-item{display:flex;align-items:center;gap:8px;}
  .nick-item label{font-size:11px;color:var(--muted);min-width:78px;font-family:'DM Mono',monospace;flex-shrink:0;}
  .nick-item input{
    flex:1;background:var(--input-bg);border:1px solid var(--border);border-radius:4px;
    padding:5px 9px;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;transition:border-color .2s;
  }
  .nick-item input:focus{border-color:var(--red);}
  .nick-item input::placeholder{color:var(--muted);opacity:.5;}

  footer{text-align:center;padding:26px 26px max(26px,calc(26px + env(safe-area-inset-bottom)));color:var(--muted);font-size:11px;letter-spacing:1px;border-top:1px solid var(--border);}

  @media(max-width:600px){
    .cp{font-size:34px;}.ct{font-size:46px;}
    header h1{font-size:18px;}#live-clock{display:none;}
    .sched-row{grid-template-columns:1fr 110px 40px;padding:9px 12px;}
    .sched-row.cur{padding-left:9px;}
    .hero{padding:16px 18px;}
  }
</style>
</head>
<body>

<header>
  <a class="back-link" href="/tools.html">← tools</a>
  <h1>GWHS · Bell Schedule</h1>
  <div class="hright">
    <div id="live-clock">--:--:-- --</div>
    <button class="theme-btn" onclick="toggleTheme()">
      <span id="t-icon">☀️</span>

</header>

<div class="container">

  <div class="stats-grid" id="stats"></div>
  <div id="finals"></div>
  <div class="tabs" id="tabs"></div>
  <div id="table"></div>

  <div class="nick-section">
    <div class="nick-hdr" onclick="toggleNick()">
      <h3>📝 My Class Names</h3>

</div>

function todayISO(){const n=new Date();const m=String(n.getMonth()+1).padStart(2,'0'),d=String(n.getDate()).padStart(2,'0');return `${n.getFullYear()}-${m}-${d}`;}

function saveNicks(){try{localStorage.setItem('gwhs_nicks',JSON.stringify(nicks));}catch(e){}}
function gn(id){return nicks[id]||'';}
function dn(p){const k=gn(p.id);return k||p.n;}

let theme=localStorage.getItem('gwhs_theme')||'dark';
function applyTheme(){
  document.documentElement.setAttribute('data-theme',theme);
  const d=theme==='dark';
  document.getElementById('t-icon').textContent=d?'☀️':'🌙';
  document.getElementById('t-lbl').textContent=d?'Light':'Dark';
  try{localStorage.setItem('gwhs_theme',theme);}catch(e){}
}
function toggleTheme(){theme=theme==='dark'?'light':'dark';applyTheme();}

function pt(t){const[h,m]=t.split(':').map(Number);return h*3600+m*60;}
function now(){const n=new Date();return n.getHours()*3600+n.getMinutes()*60+n.getSeconds();}
function hms(s){s=Math.max(0,s);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;const mm=String(m).padStart(2,'0'),ss=String(sec).padStart(2,'0');return h>0?`${h}:${mm}:${ss}`:`${mm}:${ss}`;}
function t12(t){let[h,m]=t.split(':').map(Number);const a=h>=12?'PM':'AM';if(h>12)h-=12;if(h===0)h=12;return `${h}:${String(m).padStart(2,'0')} ${a}`;}
function dow(){return new Date().getDay();}
function getCur(p){const n=now();for(let i=0;i<p.length;i++){const s=pt(p[i].s),e=pt(p[i].e);if(n>=s&&n<e)return{i,p:p[i],e,s};}return null;}
function getNxt(p){const n=now();for(let i=0;i<p.length;i++){const s=pt(p[i].s);if(n<s)return{i,p:p[i],s};}return null;}
function ss(p){return pt(p[0].s);}
function se(p){return pt(p[p.length-1].e);}

function updateClock(){
  const n=new Date(),h=n.getHours(),m=n.getMinutes(),s=n.getSeconds();
  const a=h>=12?'PM':'AM',hh=h>12?h-12:h===0?12:h;
  document.getElementById('live-clock').textContent=`${hh}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} ${a}`;
}

function renderMotive(sched){
  const el=document.getElementById('motive');
  if(!sched){el.style.display='none';return;}
  const n=now(),p=sched.p,end=se(p),start=ss(p),rem=end-n;
  let m;
  if(n<start)m=MOTIVES[0];
  else if(n>=end)m=MOTIVES[6];
  else if(rem<1800)m=MOTIVES[5];
  else if(rem<3600)m=MOTIVES[4];
  else{const cls=p.filter(x=>x.id.startsWith('p'));const done=cls.filter(x=>pt(x.e)<=n).length;m=done>=Math.floor(cls.length/2)?MOTIVES[3]:MOTIVES[1+Math.floor(done%2)];}
  el.style.display='flex';
  document.getElementById('me').textContent=m.e;
  document.getElementById('mt').textContent=m.t;
}

function renderHero(sched){
  const el=document.getElementById('hero');
  if(!sched){el.innerHTML=`<div class="no-school"><h2>No School Today</h2><p>Enjoy the weekend! 🎉</p></div>`;return;}
  const p=sched.p,n=now(),start=ss(p),end=se(p);
  if(n<start){
    const d=start-n;
    el.innerHTML=`<div class="before-banner"><div><div class="hl">School hasn't started yet</div><h2>First bell at ${t12(p[0].s)}</h2></div><div class="si">Starts in <span id="sit" style="color:var(--text);font-weight:600">${hms(d)}</span></div></div>`;
    return;
  }
  if(n>=end){
    el.innerHTML=`<div class="done-banner"><h2>School's Out! 🎉</h2><p>Final bell rang at ${t12(p[p.length-1].e)} — enjoy your afternoon!</p></div>`;
    return;
  }
  const cur=getCur(p),nxt=getNxt(p);
  if(cur){
    const rem=cur.e-n,el2=n-cur.s,tot=cur.e-cur.s,pct=Math.min(100,(el2/tot)*100);
    const cc=rem<=120?'urgent':rem<=300?'warning':'ok';
    const nick=gn(cur.p.id);
    const nd=nick?`${nick} <span style="font-size:22px;opacity:.45">(${cur.p.n})</span>`:cur.p.n;
    const nxtHtml=nxt?`<div class="nu"><div class="nu-dot"></div><span>Next: <strong>${dn(nxt.p)}</strong> at ${t12(nxt.p.s)}</span></div>`:'';
    el.innerHTML=`
      <div class="hero">
        <div class="hl">Now in Progress</div>
        <div class="cp">${nd}</div>
        <div class="ptr">${t12(cur.p.s)} → ${t12(cur.p.e)} · ${cur.p.d} min</div>
        <div class="cl">Ends in</div>
        <div class="ct ${cc}" id="cd">${hms(rem)}</div>
        <div class="pb-wrap"><div class="pb-fill" id="pf" style="width:${pct}%"></div></div>
        <div class="pb-meta"><span id="pel">${hms(el2)} elapsed</span><span id="prem">${hms(rem)} left</span></div>
        ${nxtHtml}
      </div>`;
  } else if(nxt){
    const till=nxt.s-n;
    el.innerHTML=`
      <div class="hero">
        <div class="hl">Passing Period 🚶</div>
        <div class="cp" style="font-size:36px">Between Classes</div>
        <div class="ptr"></div>
        <div class="cl">Next period in</div>
        <div class="ct ok" id="cd">${hms(till)}</div>
        <div class="nu"><div class="nu-dot"></div><span>Next: <strong>${dn(nxt.p)}</strong> at ${t12(nxt.p.s)}</span></div>
      </div>`;
  }
}

function renderStats(sched){
  const el=document.getElementById('stats');
  if(!sched){el.innerHTML='';return;}
  const p=sched.p,n=now(),end=se(p),start=ss(p);
  const cls=p.filter(x=>x.id.startsWith('p'));
  const done=cls.filter(x=>pt(x.e)<=n).length;
  const left=Math.max(0,end-n);
  const dur=end-start;
  const pct=n<start?0:n>=end?100:Math.min(100,Math.round(((n-start)/dur)*100));
  el.innerHTML=`
    <div class="stat-card"><div class="slbl">Day Progress</div><div class="sval">${pct}%</div><div class="ssub">of school day</div></div>
    <div class="stat-card"><div class="slbl">Periods Done</div><div class="sval">${done}/${cls.length}</div><div class="ssub">class periods</div></div>
    <div class="stat-card"><div class="slbl">School Ends</div><div class="sval" style="font-size:21px">${t12(p[p.length-1].e)}</div><div class="ssub">${left>0?hms(left)+' left':'Done!'}</div></div>
    <div class="stat-card"><div class="slbl">Schedule</div><div class="sval" style="font-size:19px">${sched.type}</div><div class="ssub">${sched.label}</div></div>`;
}

// activeTab is either a weekday number (1-5) or a YYYY-MM-DD override date.
let activeTab=null;
function getSched(tab){return typeof tab==='string'?OVERRIDES[tab]:S[tab];}
function todayTab(){const iso=todayISO();return OVERRIDES[iso]?iso:dow();}
function renderTabs(){
  const el=document.getElementById('tabs'),d=dow(),days=[1,2,3,4,5],names=['Mon','Tue','Wed','Thu','Fri'];
  const today=todayTab();
  if(activeTab===null)activeTab=days.includes(d)||typeof today==='string'?today:1;
  el.innerHTML=days.map((x,i)=>`<button class="tab ${x===d&&typeof today!=='string'?'today':''} ${x===activeTab?'active':''}" onclick="setTab(${x})">${names[i]}${x===d&&typeof today!=='string'?' ★':''}</button>`).join('');
}
function setTab(d){activeTab=d;renderTabs();renderFinals();renderTable(getSched(d));}

function renderFinals(){
  const el=document.getElementById('finals');
  const iso=todayISO();
  const pills=FINALS_DATES.map(dt=>{
    const o=OVERRIDES[dt];
    const lbl=o.label.replace(/ · Finals| · Make-Up/,'').replace(' · ',' ');
    const isToday=dt===iso;
    const isActive=activeTab===dt;
    return `<button class="fp ${isToday?'is-today':''} ${isActive?'active':''}" onclick="setTab('${dt}')">${lbl}${isToday?' ★':''}</button>`;
  }).join('');
  el.innerHTML=`
    <div class="finals-banner">
      <div class="fl">📝 Finals Week · Spring 2026</div>
      <p>Tap a date to preview its schedule. Today's finals schedule auto-loads above.</p>
      <div class="finals-pills">${pills}</div>
    </div>`;
}

function renderTable(sched){
  const el=document.getElementById('table');
  if(!sched){el.innerHTML='';return;}
  const p=sched.p,n=now();
  const tt=todayTab();
  const today=(activeTab===tt);
  const cur=today?getCur(p):null;
  const rows=p.map((x,i)=>{
    const isCur=cur&&cur.i===i,isPast=today&&pt(x.e)<=n&&!isCur;
    const nick=gn(x.id);
    const nd=nick?`${nick} <span class="rnick">(${x.n})</span>`:x.n;
    return `<div class="sched-row ${isCur?'cur':''} ${isPast?'past':''}">
      <div class="rname">${isCur?'<span class="cdot"></span>':''}${nd}</div>
      <div class="rtime">${t12(x.s)} – ${t12(x.e)}</div>
      <div class="rdur">${x.d}m</div>
    </div>`;
  }).join('');
  el.innerHTML=`<div class="sched-card"><div class="sched-hdr">${sched.label} — ${sched.type} Schedule</div>${rows}</div>`;
}

let nickOpen=false;
function toggleNick(){
  nickOpen=!nickOpen;
  document.getElementById('nbody').classList.toggle('open',nickOpen);
  document.getElementById('nchev').textContent=nickOpen?'▲ hide':'▼ show';
}
function renderNickEditor(){
  document.getElementById('ngrid').innerHTML=NKEYS.map(k=>`
    <div class="nick-item">
      <label>${NLBLS[k]}</label>
      <input type="text" maxlength="24" placeholder="nickname" value="${gn(k)}"
        oninput="nicks['${k}']=this.value.trim();saveNicks();renderTable(S[activeTab])">
    </div>`).join('');
}

let lastHeroState='';
function heroState(sched){
  if(!sched)return'no';
  const n=now(),p=sched.p;
  if(n<ss(p))return'before';
  if(n>=se(p))return'done';
  const cur=getCur(p);
  return cur?'cur:'+cur.p.id:'pass';
}

function tick(){
  updateClock();
  const sched=todaySched();
  renderMotive(sched);

  const state=heroState(sched);
  if(state!==lastHeroState){lastHeroState=state;renderHero(sched);}
  else {
    // fast-path update
    const n=now();
    const sit=document.getElementById('sit');
    if(sit&&sched){sit.textContent=hms(pt(sched.p[0].s)-n);}
    const cd=document.getElementById('cd');
    if(cd&&sched){
      const p=sched.p,cur=getCur(p),nxt=getNxt(p);
      if(cur){
        const rem=cur.e-n,el2=n-cur.s,tot=cur.e-cur.s;
        cd.textContent=hms(rem);
        cd.className='ct '+(rem<=120?'urgent':rem<=300?'warning':'ok');
        const pf=document.getElementById('pf');if(pf)pf.style.width=Math.min(100,(el2/tot)*100)+'%';
        const pe=document.getElementById('pel'),pr=document.getElementById('prem');
        if(pe)pe.textContent=hms(el2)+' elapsed';if(pr)pr.textContent=hms(rem)+' left';
      } else if(nxt){cd.textContent=hms(nxt.s-n);}
    }
  }

  renderStats(sched);
  if(activeTab===todayTab())renderTable(sched);
}

function init(){
  applyTheme();
  renderNickEditor();
  const sched=todaySched();
  lastHeroState=heroState(sched);
  renderMotive(sched);renderHero(sched);renderStats(sched);renderTabs();renderFinals();
  if(activeTab===null)activeTab=todayTab();
  renderTable(getSched(activeTab));
  updateClock();
  setInterval(tick,1000);
}
init();
</script>
