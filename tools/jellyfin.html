<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jellyfin Media Server</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00a4ef;
            --primary-dark: #0088c7;
            --bg: #0a0e27;
            --surface: #111729;
            --surface-alt: #1a1f3a;
            --border: #2d3748;
            --text: #e2e8f0;
            --text-muted: #a0aec0;
            --success: #48bb78;
            --danger: #f56565;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        /* Setup Screen */
        #setup {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg) 0%, #1a2847 100%);
        }

        #setup.hidden {
            display: none;
        }

        .setup-container {
            width: 100%;
            max-width: 420px;
        }

        .setup-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .setup-logo {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 16px;
            font-weight: 700;
        }

        .setup-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text);
        }

        .setup-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--surface-alt);
            box-shadow: 0 0 0 3px rgba(0, 164, 239, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .setup-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            grid-column: 1 / -1;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 164, 239, 0.3);
        }

        .btn-secondary {
            background: var(--surface-alt);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--surface-alt);
            border-color: var(--primary);
            color: var(--primary);
        }

        .error-message {
            display: none;
            padding: 12px 16px;
            background: rgba(245, 101, 101, 0.1);
            border: 1px solid rgba(245, 101, 101, 0.3);
            border-radius: 6px;
            color: #ff9999;
            font-size: 13px;
            margin-bottom: 16px;
            animation: slideIn 0.2s ease;
        }

        .error-message.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Main App Layout */
        #app {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        #app.visible {
            display: flex;
        }

        .app-layout {
            display: grid;
            grid-template-columns: 70px 1fr;
            grid-template-rows: 1fr 80px;
            height: 100vh;
            gap: 0;
        }

        /* Sidebar */
        #sidebar {
            grid-row: 1 / 3;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 8px;
        }

        .sidebar-logo {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 16px;
            font-weight: 700;
        }

        .sidebar-sep {
            width: 30px;
            height: 1px;
            background: var(--border);
            margin: 8px 0;
        }

        .nav-btn {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            font-size: 20px;
            transition: all 0.2s;
            position: relative;
        }

        .nav-btn:hover {
            background: var(--surface-alt);
            color: var(--text);
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
        }

        .nav-btn.bottom {
            margin-top: auto;
        }

        /* Main Content */
        #main {
            grid-column: 2;
            grid-row: 1;
            overflow-y: auto;
            padding: 30px;
            background: var(--bg);
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            text-transform: capitalize;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            flex: 1;
            max-width: 300px;
        }

        .search-box input {
            background: none;
            border: none;
            color: var(--text);
            outline: none;
            font-size: 14px;
            flex: 1;
            font-family: 'Inter', sans-serif;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        /* Filter Pills */
        .filter-pills {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .pill {
            padding: 8px 16px;
            border: 1px solid var(--border);
            background: none;
            color: var(--text-muted);
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .pill:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .pill.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Sections */
        .section {
            margin-bottom: 48px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        /* Grids */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .media-grid.wide {
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        }

        .media-card {
            cursor: pointer;
            transition: transform 0.2s;
            user-select: none;
        }

        .media-card:hover {
            transform: scale(1.05);
        }

        .card-poster {
            aspect-ratio: 2 / 3;
            background: var(--surface-alt);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-placeholder {
            font-size: 36px;
            color: var(--text-muted);
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            border-radius: 8px;
        }

        .media-card:hover .card-overlay {
            opacity: 1;
        }

        .play-button {
            font-size: 32px;
            color: white;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--primary);
            color: white;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 6px;
        }

        /* Player Bar */
        #player {
            grid-column: 2;
            grid-row: 2;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            gap: 30px;
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: var(--surface-alt);
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: var(--border);
            color: var(--text);
        }

        .control-btn.play-btn {
            background: var(--primary);
            color: white;
            width: 44px;
            height: 44px;
        }

        .control-btn.play-btn:hover {
            background: var(--primary-dark);
        }

        .player-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 16px;
        }

        /* Settings */
        .settings-container {
            max-width: 500px;
        }

        .settings-section {
            margin-bottom: 32px;
        }

        .settings-section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .settings-row:last-child {
            border-bottom: none;
        }

        .settings-label {
            color: var(--text-muted);
        }

        .settings-value {
            color: var(--text);
            font-weight: 500;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <!-- Setup Screen -->
    <div id="setup">
        <div class="setup-container">
            <div class="setup-header">
                <div class="setup-logo">📺</div>
                <div class="setup-title">Jellyfin</div>
                <div class="setup-subtitle">Connect to your media server to get started</div>
            </div>

            <div id="setup-error" class="error-message"></div>

            <form id="setup-form" onsubmit="handleConnect(event)">
                <div class="form-group">
                    <label class="form-label">Server URL</label>
                    <input type="url" id="server-url" class="form-input" placeholder="http://localhost:8096" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="server-user" class="form-input" placeholder="admin" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="server-pass" class="form-input" placeholder="Password" required>
                </div>

                <div class="setup-buttons">
                    <button type="submit" class="btn btn-primary">Connect</button>
                    <button type="button" class="btn btn-secondary" onclick="startDemo()">Demo Mode</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="app-layout">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-logo">📺</div>
            <button class="nav-btn active" onclick="showPage('home')" title="Home">🏠</button>
            <button class="nav-btn" onclick="showPage('movies')" title="Movies">🎬</button>
            <button class="nav-btn" onclick="showPage('shows')" title="Shows">📺</button>
            <button class="nav-btn" onclick="showPage('music')" title="Music">🎵</button>
            <button class="nav-btn" onclick="showPage('search')" title="Search">🔍</button>
            <div class="sidebar-sep"></div>
            <button class="nav-btn bottom" onclick="showPage('settings')" title="Settings">⚙️</button>
        </nav>

        <!-- Main Content -->
        <main id="main">
            <!-- Home Page -->
            <div id="home" class="page-section active">
                <div class="page-header">
                    <div class="page-title">Home</div>
                    <div class="search-box">
                        <span>🔍</span>
                        <input type="text" id="home-search" placeholder="Search..." oninput="handleHomeSearch(this.value)">
                    </div>
                </div>

                <div id="home-filters" class="filter-pills"></div>

                <div class="section">
                    <div class="section-title">Continue Watching</div>
                    <div id="continue-grid" class="media-grid wide"></div>
                </div>

                <div class="section">
                    <div class="section-title">Recently Added</div>
                    <div id="recent-grid" class="media-grid"></div>
                </div>
            </div>

            <!-- Movies Page -->
            <div id="movies" class="page-section">
                <div class="page-header">
                    <div class="page-title">Movies</div>
                </div>
                <div class="filter-pills">
                    <button class="pill active" onclick="sortMovies('name', this)">Sort: Name</button>
                    <button class="pill" onclick="sortMovies('year', this)">Sort: Year</button>
                    <button class="pill" onclick="sortMovies('rating', this)">Sort: Rating</button>
                </div>
                <div id="movies-grid" class="media-grid"></div>
            </div>

            <!-- Shows Page -->
            <div id="shows" class="page-section">
                <div class="page-header">
                    <div class="page-title">TV Shows</div>
                </div>
                <div id="shows-grid" class="media-grid"></div>
            </div>

            <!-- Music Page -->
            <div id="music" class="page-section">
                <div class="page-header">
                    <div class="page-title">Music</div>
                </div>
                <div class="section">
                    <div class="section-title">Albums</div>
                    <div id="albums-grid" class="media-grid"></div>
                </div>
            </div>

            <!-- Search Page -->
            <div id="search" class="page-section">
                <div class="page-header">
                    <div class="page-title">Search</div>
                </div>
                <div class="form-group">
                    <input type="text" id="search-input" class="form-input" placeholder="Search movies, shows, music..." oninput="handleSearch(this.value)">
                </div>
                <div id="search-results"></div>
            </div>

            <!-- Settings Page -->
            <div id="settings" class="page-section">
                <div class="page-header">
                    <div class="page-title">Settings</div>
                </div>
                <div class="settings-container">
                    <div class="settings-section">
                        <div class="settings-section-title">Server</div>
                        <div class="form-group">
                            <label class="form-label">Server URL</label>
                            <input type="url" id="settings-url" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label">API Token</label>
                            <input type="text" id="settings-token" class="form-input">
                        </div>
                        <button class="btn btn-primary" style="margin-top: 12px; width: 100%;" onclick="reconnect()">Reconnect</button>
                        <button class="btn btn-secondary" style="margin-top: 12px; width: 100%;" onclick="logout()">Logout</button>
                    </div>

                    <div class="settings-section">
                        <div class="settings-section-title">About</div>
                        <div class="settings-row">
                            <span class="settings-label">Client</span>
                            <span class="settings-value">Jellyfin Web v2.0</span>
                        </div>
                        <div class="settings-row">
                            <span class="settings-label">Mode</span>
                            <span class="settings-value" id="mode-display">Demo</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Player Bar -->
        <footer id="player">
            <div class="player-info">
                <div class="player-title" id="player-title">Nothing playing</div>
                <div class="player-subtitle" id="player-subtitle">Select something to play</div>
            </div>

            <div class="player-controls">
                <button class="control-btn" onclick="previousItem()">⏮</button>
                <button class="control-btn" onclick="toggleShuffle()" id="shuffle-btn">🔀</button>
                <button class="control-btn play-btn" onclick="togglePlay()" id="play-btn">▶</button>
                <button class="control-btn" onclick="toggleRepeat()" id="repeat-btn">🔁</button>
                <button class="control-btn" onclick="nextItem()">⏭</button>
                <span class="player-time" id="player-time">0:00 / 0:00</span>
            </div>

            <div class="player-controls">
                <button class="control-btn" onclick="toggleMute()" id="mute-btn">🔊</button>
            </div>
        </footer>
    </div>

    <script>
        // State
        let SERVER = '', TOKEN = '', USER_ID = '';
        let DEMO = false;
        let currentPage = 'home';
        let playing = false, shuffled = false, looping = false;
        let currentTrack = null;

        // Demo Data
        const DEMO_ITEMS = [
            { id: 1, name: 'The Magic That Started Everything', type: 'movie', year: 2023, genre: 'anime' },
            { id: 2, name: 'The Perplexity of Ethan Forrest', type: 'movie', year: 2023, genre: 'anime' },
            { id: 3, name: 'Unshakuruu: Pretty Dorky Request', type: 'movie', year: 2023, genre: 'anime' },
            { id: 4, name: 'One Piece', type: 'show', year: 1999, genre: 'anime' },
            { id: 5, name: 'Witch Hat Atelier', type: 'show', year: 2023, genre: 'anime' },
            { id: 6, name: 'Hoppers', type: 'movie', year: 2023, genre: 'anime' },
            { id: 7, name: 'The Moment', type: 'movie', year: 2023, genre: 'action' },
            { id: 8, name: 'GOAT', type: 'movie', year: 2023, genre: 'drama' },
            { id: 9, name: 'ONE PIECE', type: 'show', year: 2023, genre: 'anime' },
            { id: 10, name: 'A Silent Voice: The Movie', type: 'movie', year: 2023, genre: 'anime' },
            { id: 11, name: 'Exit 8', type: 'movie', year: 2023, genre: 'horror' },
            { id: 12, name: 'Twisters', type: 'movie', year: 2024, genre: 'action' },
            { id: 13, name: 'A Quiet Place: Day One', type: 'movie', year: 2024, genre: 'horror' },
            { id: 14, name: 'Train Dreams', type: 'movie', year: 2023, genre: 'drama' },
        ];

        // Storage
        const saveConnection = (url, token) => {
            localStorage.setItem('jf_server', url);
            localStorage.setItem('jf_token', token);
        };

        const loadConnection = () => ({
            server: localStorage.getItem('jf_server') || '',
            token: localStorage.getItem('jf_token') || ''
        });

        const clearConnection = () => {
            localStorage.removeItem('jf_server');
            localStorage.removeItem('jf_token');
        };

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            const saved = loadConnection();
            if (saved.server && saved.token) {
                SERVER = saved.server;
                TOKEN = saved.token;
                DEMO = false;
                startApp();
                loadData();
            }
        });

        function showSetup() {
            document.getElementById('setup').classList.remove('hidden');
            document.getElementById('app').classList.remove('visible');
        }

        function startApp() {
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('app').classList.add('visible');
        }

        function startDemo() {
            DEMO = true;
            SERVER = '';
            TOKEN = '';
            clearConnection();
            startApp();
            loadDemoData();
        }

        function showPage(page) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.getElementById(page).classList.add('active');

            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            currentPage = page;

            if (page === 'settings') {
                document.getElementById('settings-url').value = SERVER;
                document.getElementById('settings-token').value = TOKEN;
                document.getElementById('mode-display').textContent = DEMO ? 'Demo' : 'Live';
            }
        }

        async function handleConnect(e) {
            e.preventDefault();
            const url = document.getElementById('server-url').value.trim().replace(/\/$/, '');
            const user = document.getElementById('server-user').value.trim();
            const pass = document.getElementById('server-pass').value;
            const errorEl = document.getElementById('setup-error');

            if (!url || !user || !pass) {
                showError(errorEl, 'All fields are required');
                return;
            }

            try {
                const response = await fetch(`${url}/Users/AuthenticateByName`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Emby-Authorization': 'MediaBrowser Client="Jellyfin-Web",Device="Web",DeviceId="web-001",Version="10.0"'
                    },
                    body: JSON.stringify({ Username: user, Pw: pass })
                });

                if (!response.ok) throw new Error('Authentication failed');
                const data = await response.json();
                if (!data.AccessToken) throw new Error('No access token received');

                SERVER = url;
                TOKEN = data.AccessToken;
                USER_ID = data.User.Id;
                DEMO = false;

                saveConnection(SERVER, TOKEN);
                startApp();
                loadData();
            } catch (err) {
                showError(errorEl, 'Connection failed: ' + err.message);
            }
        }

        function showError(el, msg) {
            el.textContent = '❌ ' + msg;
            el.classList.add('show');
        }

        function loadDemoData() {
            document.getElementById('continue-grid').innerHTML = createGrid(DEMO_ITEMS.slice(0, 3), true);
            document.getElementById('recent-grid').innerHTML = createGrid(DEMO_ITEMS.slice(0, 6), false);
            document.getElementById('movies-grid').innerHTML = createGrid(DEMO_ITEMS.filter(i => i.type === 'movie'), false);
            document.getElementById('shows-grid').innerHTML = createGrid(DEMO_ITEMS.filter(i => i.type === 'show'), false);
            document.getElementById('albums-grid').innerHTML = createGrid(DEMO_ITEMS.slice(0, 4), false);
        }

        function createGrid(items, wide) {
            return items.map(item => `
                <div class="media-card" onclick="playItem('${item.name}', '${item.genre}')">
                    <div class="card-poster">
                        <div class="card-placeholder">🎬</div>
                        <div class="card-overlay">
                            <div class="play-button">▶</div>
                        </div>
                    </div>
                    <div class="card-title">${item.name}</div>
                    <div class="card-meta">${item.year} • ${item.genre}</div>
                </div>
            `).join('');
        }

        function loadData() {
            if (DEMO) {
                loadDemoData();
            } else {
                loadDemoData(); // For now, show demo data even in connected mode
            }
        }

        function playItem(title, genre) {
            document.getElementById('player-title').textContent = title;
            document.getElementById('player-subtitle').textContent = genre;
            playing = true;
            updatePlayButton();
        }

        function updatePlayButton() {
            document.getElementById('play-btn').textContent = playing ? '⏸' : '▶';
        }

        function togglePlay() {
            playing = !playing;
            updatePlayButton();
        }

        function toggleShuffle() {
            shuffled = !shuffled;
            document.getElementById('shuffle-btn').style.opacity = shuffled ? '1' : '0.5';
        }

        function toggleRepeat() {
            looping = !looping;
            document.getElementById('repeat-btn').style.opacity = looping ? '1' : '0.5';
        }

        function toggleMute() {
            // Placeholder
        }

        function previousItem() {
            // Placeholder
        }

        function nextItem() {
            // Placeholder
        }

        function sortMovies(by, el) {
            document.querySelectorAll('.filter-pills .pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
        }

        function handleHomeSearch(val) {
            if (!val.trim()) return;
            document.getElementById('search-input').value = val;
            showPage('search');
        }

        function handleSearch(val) {
            if (!val.trim()) {
                document.getElementById('search-results').innerHTML = '';
                return;
            }
            const results = DEMO_ITEMS.filter(i => i.name.toLowerCase().includes(val.toLowerCase()));
            document.getElementById('search-results').innerHTML = createGrid(results, false);
        }

        function reconnect() {
            const url = document.getElementById('settings-url').value.trim().replace(/\/$/, '');
            const token = document.getElementById('settings-token').value.trim();
            if (url && token) {
                SERVER = url;
                TOKEN = token;
                saveConnection(SERVER, TOKEN);
                loadData();
            }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                clearConnection();
                SERVER = '';
                TOKEN = '';
                USER_ID = '';
                showSetup();
                document.getElementById('server-url').value = '';
                document.getElementById('server-user').value = '';
                document.getElementById('server-pass').value = '';
                document.getElementById('setup-error').classList.remove('show');
            }
        }
    </script>
</body>
</html>
