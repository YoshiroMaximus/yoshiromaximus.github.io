<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello</title>
  <link rel="icon" type="image/x-icon" href="/favistuff/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favistuff/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favistuff/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/favistuff/apple-touch-icon.png">
  <link rel="manifest" href="/favistuff/site.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f4f0;
      --text: #1a1a1a;
      --accent-cf: #F6821F;
      --accent-gh: #1f2328;
      --muted: #888;
      --line: #d8d6d0;
    }

    body.dark {
      --bg: #111110;
      --text: #e8e6e2;
      --accent-gh: #c9c5be;
      --muted: #666;
      --line: #2a2926;
    }

    /* ── Theme toggle ── */
    .theme-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.1rem;
      z-index: 100;
    }

    .theme-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      color: var(--line);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.15rem 0.3rem;
      line-height: 1;
      transition: color 0.2s ease;
      user-select: none;
    }

    .theme-btn:hover { color: var(--muted); }
    .theme-btn.active { color: var(--text); }

    .secret-link {
      position: fixed;
      bottom: 1.25rem;
      right: 1.5rem;
      font-size: 0.6rem;
      color: var(--bg);
      text-decoration: none;
      transition: color 0.3s ease;
      z-index: 100;
      user-select: none;
    }

    .secret-link:hover { color: var(--line); }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: 480px;
      width: 100%;
    }

    .greeting {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      padding: 2rem 0;
      border-bottom: 1px solid var(--line);
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s ease forwards;
    }

    .greeting:first-child {
      border-top: 1px solid var(--line);
      animation-delay: 0.1s;
    }

    .greeting:last-child {
      animation-delay: 0.25s;
    }

    .hello {
      font-size: 1rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: lowercase;
      flex-shrink: 0;
    }

    .name {
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .name.cf { color: var(--accent-cf); }
    .name.gh { color: var(--accent-gh); }

    .dot {
      font-size: 2rem;
      font-weight: 300;
      color: var(--line);
    }

    .greeting.linked {
      animation-delay: 0.4s;
    }

    .greeting a {
      text-decoration: none;
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      width: 100%;
    }

    .greeting a .name {
      position: relative;
      transition: opacity 0.2s ease;
    }

    .greeting a:hover .name {
      opacity: 0.7;
    }

    .name.yoshiro {
      background: linear-gradient(100deg, #9b8ea0, #7a9490, #a08b7a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .now-label {
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
      padding-top: 1.5rem;
      padding-left: 0;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.35s forwards;
    }

    .arrow {
      font-size: 1rem;
      color: var(--muted);
      margin-left: auto;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .greeting a:hover .arrow {
      transform: translateX(4px);
      opacity: 1;
    }

    /* ── Sub-links (tools etc.) ── */
    .sub-links {
      display: flex;
      gap: 1.25rem;
      padding: 0.6rem 0 0;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.52s forwards;
    }

    .sub-link {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--line);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      transition: color 0.2s ease;
    }

    .sub-link:hover { color: var(--muted); }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="theme-toggle">
    <button class="theme-btn" id="btn-light" onclick="setTheme('light')" title="Light">+</button>
    <button class="theme-btn" id="btn-dark" onclick="setTheme('dark')" title="Dark">−</button>
  </div>

  <a class="secret-link" href="/break.html">.</a>

  <div class="container">
    <div class="greeting">
      <span class="hello">hello</span>
      <span class="name cf">cloudflare</span>
      <span class="dot">·</span>
    </div>
    <div class="greeting">
      <span class="hello">hello</span>
      <span class="name gh">github</span>
      <span class="dot">·</span>
    </div>
    <p class="now-label">and now...</p>
    <div class="greeting linked">
      <a href="https://sn4k.org/portfolio" target="_blank" rel="noopener">
        <span class="hello">hello</span>
        <span class="name yoshiro">yoshiro</span>
        <span class="arrow">→</span>
      </a>
    </div>
    <div class="sub-links">
      <a class="sub-link" href="/tools.html">tools →</a>
    </div>
  </div>

  <script>
    function setTheme(theme) {
      document.body.classList.toggle('dark', theme === 'dark');
      document.getElementById('btn-light').classList.toggle('active', theme === 'light');
      document.getElementById('btn-dark').classList.toggle('active', theme === 'dark');
      localStorage.setItem('theme', theme);
    }

    const saved = localStorage.getItem('theme') || 'light';
    setTheme(saved);
  </script>
</body>
</html>
