<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f5f4f0;--text:#1a1a1a;--muted:#888;--line:#d8d6d0;--sq-light:#ede9e4;--sq-dark:#b5a898;--enemy:#7a3030;}
body.dark{--bg:#111110;--text:#e8e6e2;--muted:#666;--line:#2a2926;--sq-light:#2a2926;--sq-dark:#1a1816;--enemy:#b06040;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;}
canvas{display:block;cursor:default;touch-action:none;}
#theme{position:fixed;top:max(1.5rem,env(safe-area-inset-top));right:max(1.5rem,env(safe-area-inset-right));background:none;border:none;font-family:'DM Mono',monospace;font-size:1.1rem;line-height:1;color:var(--muted);cursor:pointer;padding:8px;z-index:100;}
#back{position:fixed;top:max(1.5rem,env(safe-area-inset-top));left:max(1.5rem,env(safe-area-inset-left));font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--line);text-decoration:none;letter-spacing:0.06em;z-index:100;padding:8px;margin:-8px;}
#back:hover{color:var(--muted);}
#help{position:fixed;bottom:max(1rem,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--muted);background:none;border:none;cursor:pointer;letter-spacing:0.06em;z-index:100;padding:10px 14px;}
#help:hover{color:var(--text);}
#audio-ctrl{position:fixed;top:max(1.5rem,env(safe-area-inset-top));right:calc(max(1.5rem,env(safe-area-inset-right)) + 2rem);z-index:100;}
@media (hover:none){#music-hint{display:none;}}
#mute{background:none;border:none;font-family:'DM Mono',monospace;font-size:1.1rem;line-height:1;color:var(--muted);cursor:pointer;padding:4px;}
#mute:hover{color:var(--text);}
#vol-panel{position:absolute;top:100%;right:0;padding:10px 10px 8px;background:var(--bg);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;gap:6px;opacity:0;pointer-events:none;transition:opacity 0.12s;min-width:170px;}
#vol-row{display:flex;align-items:center;gap:8px;}
#track-select{appearance:none;-webkit-appearance:none;background:var(--bg);border:1px solid var(--line);color:var(--text);font-family:'DM Mono',monospace;font-size:0.7rem;padding:3px 6px;border-radius:3px;cursor:pointer;width:100%;}
#track-select:hover{border-color:var(--text);}
#music-hint{position:absolute;top:100%;right:0;margin-top:4px;padding:5px 9px;background:var(--bg);border:1px solid var(--line);border-radius:3px;font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--muted);white-space:nowrap;pointer-events:none;animation:hintPulse 1.8s ease-in-out infinite;}
#audio-ctrl:hover #music-hint{display:none;}
@keyframes hintPulse{0%,100%{opacity:0.55;}50%{opacity:1;}}
#audio-ctrl:hover #vol-panel,#audio-ctrl:focus-within #vol-panel{opacity:1;pointer-events:auto;}
#vol{appearance:none;-webkit-appearance:none;width:90px;height:3px;background:var(--line);outline:none;border-radius:2px;}
#vol::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--text);cursor:pointer;border:none;}
#vol::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--text);cursor:pointer;border:none;}
#vol-label{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--muted);min-width:24px;text-align:right;}
</style>
</head>
<body>
<a href="../break.html" id="back">← break</a>
<button id="theme" onclick="toggleTheme()">+</button>
<div id="audio-ctrl">
  <button id="mute" onclick="toggleMute()" title="click: mute · hover: volume">♪</button>
  <div id="music-hint">click ♪ for music</div>
  <div id="vol-panel">
    <select id="track-select"></select>
    <div id="vol-row">
      <input id="vol" type="range" min="0" max="100" value="30">
      <span id="vol-label">30</span>
    </div>
  </div>
</div>
<button id="help" onclick="toggleHelp()">? how to play</button>
<audio id="bgm" src="/audio/pikmintodaysresults.mp3" loop preload="auto"></audio>
<canvas id="c"></canvas>
<div id="submit-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;align-items:center;justify-content:center;">
  <div id="submit-box" style="background:var(--bg);border:1px solid var(--text);padding:28px 32px;width:min(320px,90vw);font-family:'DM Mono',monospace;text-align:center;">
    <div style="font-size:13px;color:var(--text);margin-bottom:6px;">submit score</div>
    <div id="sub-score" style="font-size:18px;color:#c8a020;margin-bottom:4px;font-weight:500;"></div>
    <div id="sub-meta" style="font-size:10px;color:var(--muted);margin-bottom:20px;"></div>
    <input id="name-input" type="text" maxlength="30" placeholder="your name"
      style="width:100%;box-sizing:border-box;background:transparent;border:none;border-bottom:1px solid var(--text);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;padding:6px 2px;text-align:center;outline:none;margin-bottom:16px;">
    <div id="sub-error" style="font-size:9px;color:#b04040;min-height:14px;margin-bottom:10px;"></div>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button id="sub-submit" style="flex:1;padding:9px;background:transparent;border:1px solid var(--text);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;">submit</button>
      <button id="sub-cancel" style="flex:1;padding:9px;background:transparent;border:1px solid var(--line);color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;">post anon</button>
    </div>
    <div id="sub-status" style="font-size:10px;color:var(--muted);min-height:18px;margin-top:10px;"></div>
  </div>
</div>
<script>
// ─── audio ───────────────────────────────────────────────────────────────
// Tracks are listed here so a music selector can be dropped in later — just
// add entries and render a <select> bound to setTrack(id).
const TRACKS=[
  {id:'pikmin',   name:"Pikmin · Today's Results",   src:'/audio/pikmintodaysresults.mp3'},
  {id:'zelda',    name:"Zelda · Twilight Princess",  src:'/audio/zeldatwilightprincess.mp3'},
  {id:'balatro',  name:"Balatro · Main",              src:'/audio/balatro-main.mp3'},
  {id:'balayoshi',name:"Bala-Yoshi",                  src:'/audio/balayoshi.mp3'},
  {id:'pinkpony', name:"Pink Pony Club",              src:'/audio/pinkponyclub.mp3'},
  {id:'unarmed',  name:"Unarmed and Harmless",        src:'/audio/unarmedandharmless.mp3'},
  {id:'walter',   name:"Walter",                       src:'/audio/walter.mp3'},
];
const bgm=document.getElementById('bgm');
const volSlider=document.getElementById('vol');
const volLabel=document.getElementById('vol-label');
const trackSelect=document.getElementById('track-select');
TRACKS.forEach(t=>{const o=document.createElement('option'); o.value=t.id; o.textContent=t.name; trackSelect.appendChild(o);});
trackSelect.addEventListener('change',e=>{setTrack(e.target.value); dismissHint();});
// Default to muted — user opts into music by clicking ♪. The hint guides them.
let muted=localStorage.getItem('gambit_muted')!=='0';
let hintSeen=localStorage.getItem('gambit_music_hint')==='1';
let volume=Math.max(0,Math.min(1,parseFloat(localStorage.getItem('gambit_vol'))));
if(!isFinite(volume)) volume=0.3;
let currentTrack=localStorage.getItem('gambit_track')||TRACKS[0].id;

function applyVolume(){bgm.volume=volume; volSlider.value=Math.round(volume*100); volLabel.textContent=Math.round(volume*100);}
function dismissHint(){
  if(hintSeen) return;
  hintSeen=true; localStorage.setItem('gambit_music_hint','1');
  const h=document.getElementById('music-hint'); if(h) h.remove();
}
if(hintSeen) dismissHint();
function updateMuteBtn(){document.getElementById('mute').textContent=muted?'♪̸':'♪';}
function setTrack(id){
  const t=TRACKS.find(x=>x.id===id)||TRACKS[0];
  currentTrack=t.id; localStorage.setItem('gambit_track',t.id);
  trackSelect.value=t.id;
  if(bgm.src.endsWith(t.src.replace(/^\//,''))) return;
  const wasPlaying=!bgm.paused;
  bgm.src=t.src;
  if(wasPlaying&&!muted) bgm.play().catch(()=>{});
}
function toggleMute(){
  muted=!muted; localStorage.setItem('gambit_muted',muted?'1':'0');
  updateMuteBtn();
  dismissHint();
  if(muted) bgm.pause(); else bgm.play().catch(()=>{});
}
function startBgm(){if(!muted) bgm.play().catch(()=>{});}
volSlider.addEventListener('input',e=>{
  volume=(+e.target.value)/100;
  localStorage.setItem('gambit_vol',volume);
  applyVolume();
  dismissHint();
  if(muted&&volume>0){muted=false; localStorage.setItem('gambit_muted','0'); updateMuteBtn(); bgm.play().catch(()=>{});}
});
document.addEventListener('pointerdown',startBgm,{once:true});
document.addEventListener('keydown',startBgm,{once:true});
setTrack(currentTrack);
applyVolume();
updateMuteBtn();

// ─── theme ───────────────────────────────────────────────────────────────
function getTheme(){return localStorage.getItem('theme')||'light';}
function applyTheme(t){
  document.body.classList.toggle('dark',t==='dark');
  document.getElementById('theme').textContent=t==='dark'?'−':'+';
  cacheColors();
}
function toggleTheme(){const t=getTheme()==='dark'?'light':'dark'; localStorage.setItem('theme',t); applyTheme(t);}

// ─── canvas ───────────────────────────────────────────────────────────────
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W=0,H=0,SQ=72,lastT=0;
let C={};
function cacheColors(){
  const s=getComputedStyle(document.body);
  C={bg:s.getPropertyValue('--bg').trim(),text:s.getPropertyValue('--text').trim(),
     muted:s.getPropertyValue('--muted').trim(),line:s.getPropertyValue('--line').trim(),
     sqLight:s.getPropertyValue('--sq-light').trim(),sqDark:s.getPropertyValue('--sq-dark').trim(),
     enemy:s.getPropertyValue('--enemy').trim()};
}
let isMobile=false;
const TIP_MSG='⚠  pieces that die in battle stay dead';
let tipW=null;

function resize(){
  const dpr=window.devicePixelRatio||1;
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  isMobile=W<640;
  if(isMobile){
    SQ=Math.min(Math.floor(W*0.92/6),Math.floor(H*0.55/6));
  } else {
    SQ=Math.min(Math.floor(Math.min(W*0.56,H*0.8)/6),90);
  }
  tipW=null;
  cacheColors();
}
window.addEventListener('resize',resize);
resize();
applyTheme(getTheme());

};
const PIECE_VALUE={pawn:1,knight:3,bishop:3,rook:5,queen:9,king:100};

const ENCOUNTERS=[
  {name:'Squire',    boss:false,goldReward:40,
   black:[{type:'king',row:5,col:5},{type:'knight',row:5,col:2},{type:'pawn',row:4,col:1},{type:'pawn',row:4,col:4}]},
  {name:'Guard',     boss:false,goldReward:55,
   black:[{type:'king',row:5,col:5},{type:'bishop',row:5,col:2},{type:'knight',row:5,col:3},{type:'pawn',row:4,col:1},{type:'pawn',row:4,col:3},{type:'pawn',row:4,col:5}]},
  {name:'Duelist',   boss:false,goldReward:70,
   black:[{type:'king',row:5,col:4},{type:'rook',row:5,col:0},{type:'knight',row:5,col:1},{type:'bishop',row:5,col:3},{type:'pawn',row:4,col:0},{type:'pawn',row:4,col:2},{type:'pawn',row:4,col:4}]},
  {name:'Commander', boss:true, goldReward:150,
   black:[{type:'king',row:5,col:5},{type:'queen',row:5,col:3},{type:'rook',row:5,col:0},{type:'knight',row:5,col:1},{type:'bishop',row:5,col:2},{type:'pawn',row:4,col:0},{type:'pawn',row:4,col:2},{type:'pawn',row:4,col:4}]},
  {name:'Champion',  boss:false,goldReward:85,
   black:[{type:'king',row:5,col:5},{type:'queen',row:5,col:4},{type:'rook',row:5,col:0},{type:'bishop',row:5,col:2},{type:'pawn',row:4,col:1},{type:'pawn',row:4,col:3},{type:'pawn',row:4,col:5}]},
  {name:'Warlord',   boss:false,goldReward:100,
   black:[{type:'king',row:5,col:4},{type:'queen',row:5,col:2},{type:'rook',row:5,col:0},{type:'rook',row:5,col:5},{type:'knight',row:4,col:1},{type:'bishop',row:4,col:3},{type:'pawn',row:3,col:0},{type:'pawn',row:3,col:2},{type:'pawn',row:3,col:4}]},

];

const ALL_GAMBITS=[
  {id:'necromancer',   name:'Necromancer',    desc:'Capture → spawn pawn on your back rank.'},
  {id:'pawn_rush',     name:'Pawn Rush',      desc:'Your pawns always advance 2 squares.'},
  {id:'bloodlust',     name:'Bloodlust',      desc:'After capturing a piece worth 3+, take one free bonus move.'},
  {id:'promotion_rush',name:'Promotion Rush', desc:'Pawns promote at rank 4 instead of 5.'},
  {id:'fortune',       name:'Fortune',        desc:'Gold tiles appear. Stand on them for +12g.'},
  {id:'regicide',      name:'Regicide',       desc:'Your King moves and attacks as a Queen.'},
  {id:'iron_curtain',  name:'Iron Curtain',   desc:'Enemy pieces cannot enter your first two rows.'},
  {id:'mutation',      name:'Mutation',       desc:'Your piece transforms into what it captures.'},
  {id:'hex',           name:'Hex',            desc:'Once per battle: press H to remove any enemy piece.'},
  {id:'chaos_theory',  name:'Chaos Theory',   desc:'Random events fire every 3 moves instead of 5.'},
  {id:'gamblers_mark', name:"Gambler's Mark", desc:'Wager rewards are doubled.'},
];

const SHOP_CATALOG=[
  {id:'pawn',  name:'+1 Pawn',  cost:55, desc:'Add a pawn to your roster.'},
  {id:'knight',name:'+1 Knight',cost:160,desc:'Add a knight to your roster.'},
  {id:'bishop',name:'+1 Bishop',cost:160,desc:'Add a bishop to your roster.'},
  {id:'rook',  name:'+1 Rook',  cost:220,desc:'Add a rook to your roster.'},
  {id:'queen', name:'+1 Queen', cost:280,desc:'Add a queen — cost scales with how many you own.'},
];
const QUEEN_COSTS=[280,520,940,1700,3200];
// Prices scale with how deep you are in the run.
function priceMult(){return 1+encounter*0.18;}
function queenPriceMult(){return 1+encounter*0.32;}
function queenCost(){
  const base=QUEEN_COSTS[Math.min(roster.queen,QUEEN_COSTS.length-1)]+(roster.queen>=QUEEN_COSTS.length?2000*(roster.queen-QUEEN_COSTS.length+1):0);
  return Math.round(base*queenPriceMult());
}
function itemCost(item){return item.id==='queen'?queenCost():Math.round(item.cost*priceMult());}

const MODIFIER_POOL=[null,null,null,'fog','mines','kinghill'];

// ─── run state ───────────────────────────────────────────────────────────
let phase='title';
let encounter=0, gold=50, ownedGambits=[];
let roster={queen:0,rook:1,bishop:0,knight:0,pawns:3};
let gameMode=localStorage.getItem('gambit_mode')||'campaign';
function hiScoreKey(mode=gameMode){return mode==='infinite'?'gambit_hiscore_inf':'gambit_hiscore';}
function hiDepthKey(mode=gameMode){return mode==='infinite'?'gambit_hi_inf':'gambit_hi';}
let hiEncounter=+localStorage.getItem(hiDepthKey())||0;
let hiScore=+localStorage.getItem(hiScoreKey())||0;
let runScore=0;
let runStartHi=0;
let difficulty=localStorage.getItem('gambit_diff')||'medium';

// Procedurally generated encounters for infinite mode, cached per run so a
// retry-from-roundEnd-tally doesn't re-roll the army you just lost to.
let infEncounters=[];
const INF_NAMES_REG=['Skirmisher','Footman','Rover','Pikeman','Recruit','Wraith','Outrider','Hireling','Raider'];
const INF_NAMES_BOSS=['Marauder','Inquisitor','Sentinel','Reaper','Tyrant','Ascendant','Warden','Conqueror'];
function pickName(arr,seed){return arr[seed%arr.length];}

function generateEncounter(depth){
  const isBoss=(depth+1)%5===0;
  const budget=Math.min(3+Math.floor(depth*0.7)+(isBoss?2:0),12);
  const pool=['pawn','pawn','pawn','knight','bishop','rook'];
  if(depth>=3) pool.push('knight','bishop');
  if(depth>=5) pool.push('rook','queen');
  if(depth>=9) pool.push('queen');
  if(isBoss) pool.push('queen','rook','rook');

  const occupied=new Set();
  const black=[];
  const kingCol=Math.floor(Math.random()*6);
  black.push({type:'king',row:5,col:kingCol}); occupied.add(`5,${kingCol}`);

  let placed=1, attempts=0;
  while(placed<budget&&attempts<200){
    attempts++;
    const type=pool[Math.floor(Math.random()*pool.length)];
    const r=type==='pawn'?(3+Math.floor(Math.random()*2)):(4+Math.floor(Math.random()*2));
    const c=Math.floor(Math.random()*6);
    const key=`${r},${c}`;
    if(occupied.has(key)) continue;
    occupied.add(key); black.push({type,row:r,col:c}); placed++;
  }
  const name=isBoss?pickName(INF_NAMES_BOSS,depth):pickName(INF_NAMES_REG,depth);
  return {name,boss:isBoss,goldReward:Math.round(40+depth*9+(isBoss?70:0)),black};
}

function currentEncounter(){
  if(gameMode==='campaign') return ENCOUNTERS[encounter];
  if(!infEncounters[encounter]) infEncounters[encounter]=generateEncounter(encounter);
  return infEncounters[encounter];
}
function isScheduledShop(){
  if(gameMode==='campaign') return encounter===2||encounter===5;
  // In infinite: shop after every 3rd wave that isn't itself a boss
  // (bosses already grant 2 gambit picks, so they don't need a shop chaser).
  return (encounter+1)%3===0&&(encounter+1)%5!==0;
}
function isFinalEncounter(){return gameMode==='campaign'&&encounter===6;}

// Rainbow text helper — cycles hue per character + over time
function drawRainbowText(text,x,y,font){
  ctx.font=font;
  const t=performance.now()/1000;
  let cx=x;
  if(ctx.textAlign==='center'){cx=x-ctx.measureText(text).width/2;}
  else if(ctx.textAlign==='right'){cx=x-ctx.measureText(text).width;}
  const savedAlign=ctx.textAlign;
  ctx.textAlign='left';
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    const hue=(t*80+i*18)%360;
    ctx.fillStyle=`hsl(${hue},85%,55%)`;
    ctx.fillText(ch,cx,y);
    cx+=ctx.measureText(ch).width;
  }
  ctx.textAlign=savedAlign;
}
function isBeatingHiScore(){return runStartHi>0&&runScore>runStartHi;}

// Battle log: recent moves & events, newest last
let battleLog=[];
function logEntry(kind,text){battleLog.push({kind,text}); if(battleLog.length>40) battleLog.shift();}

const DIFF_PROFILES={
  easy:       {topN:5, weights:[0.30,0.25,0.20,0.15,0.10], chaos:0.35, optimalBoss:false, rosterDeaths:false},
  medium:     {topN:4, weights:[0.55,0.27,0.12,0.06],      chaos:0.15, optimalBoss:true,  rosterDeaths:true},
  hard:       {topN:3, weights:[0.75,0.18,0.07],           chaos:0.06, optimalBoss:true,  rosterDeaths:true},
  grandmaster:{topN:1, weights:[1],                        chaos:0,    optimalBoss:true,  rosterDeaths:true},
};
function diffProfile(){return DIFF_PROFILES[difficulty]||DIFF_PROFILES.medium;}

function wrapText(text,maxW){
  const words=text.split(' '), lines=[];
  let line='', maxLineW=0;
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){
      maxLineW=Math.max(maxLineW,ctx.measureText(line).width);
      lines.push(line); line=w;
    } else line=test;
  }
  if(line){lines.push(line); maxLineW=Math.max(maxLineW,ctx.measureText(line).width);}
  return {lines,maxLineW};
}

let capturedValue=0;

let bloodlustBonus=false;
let goldTiles=[];
let moveCount=0;

let mineSquares=[];
let hexUsed=false, hexMode=false;

// event system
let eventTimer=5;
let eventTitle='',eventSub='',eventFlash=0;

let modFlash=0;

let gambitOptions=[],gambitPicksLeft=0;
let hitAreas=[];
// tooltips are rectangles with hover-only descriptions (battle HUD)
let tooltipZones=[];

// ─── chess engine ────────────────────────────────────────────────────────
function inBounds(r,c){return r>=0&&r<6&&c>=0&&c<6;}

function rawMoves(board,row,col){
  const p=board[row][col]; if(!p) return [];
  const {type,color}=p;
  const enemy=color==='white'?'black':'white';
  const dir=color==='white'?1:-1;
  const moves=[];
  const slide=(dr,dc)=>{
    let r=row+dr,c=col+dc;
    while(inBounds(r,c)){if(board[r][c]){if(board[r][c].color===enemy) moves.push([r,c]); break;} moves.push([r,c]); r+=dr; c+=dc;}
  };
  const step=(dr,dc)=>{
    const r=row+dr,c=col+dc;
    if(inBounds(r,c)&&(!board[r][c]||board[r][c].color===enemy)) moves.push([r,c]);
  };
  const orth=[[0,1],[0,-1],[1,0],[-1,0]],diag=[[1,1],[1,-1],[-1,1],[-1,-1]];
  if(type==='pawn'){
    const nr=row+dir;
    if(inBounds(nr,col)&&!board[nr][col]){
      moves.push([nr,col]);
      const alwaysDouble=ownedGambits.includes('pawn_rush')&&color==='white';
      const r2=row+dir*2;
      if((row===(color==='white'?1:4)||alwaysDouble)&&inBounds(r2,col)&&!board[r2][col]) moves.push([r2,col]);
    }
    [-1,1].forEach(dc=>{if(inBounds(nr,col+dc)&&board[nr][col+dc]?.color===enemy) moves.push([nr,col+dc]);});
  } else if(type==='knight'){
    [[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]].forEach(([dr,dc])=>step(dr,dc));
  } else if(type==='rook'){orth.forEach(([dr,dc])=>slide(dr,dc));}
  else if(type==='bishop'){diag.forEach(([dr,dc])=>slide(dr,dc));}
  else if(type==='queen'){[...orth,...diag].forEach(([dr,dc])=>slide(dr,dc));}
  else if(type==='king'){
    const queenLike=ownedGambits.includes('regicide')&&color==='white';
    if(queenLike)[...orth,...diag].forEach(([dr,dc])=>slide(dr,dc));
    else[...orth,...diag].forEach(([dr,dc])=>step(dr,dc));
  }
  return moves;
}

function cloneBoard(b){return b.map(r=>r.map(c=>c?{...c}:null));}
function applyMove(board,fr,fc,tr,tc){
  const nb=cloneBoard(board);
  nb[tr][tc]=nb[fr][fc]; nb[fr][fc]=null;
  if(nb[tr][tc]) nb[tr][tc].moved=true;
  return nb;
}
function findKing(board,color){
  for(let r=0;r<6;r++) for(let c=0;c<6;c++)
    if(board[r][c]?.type==='king'&&board[r][c]?.color===color) return [r,c];
  return null;
}
function inCheck(board,color){
  const k=findKing(board,color); if(!k) return false;
  const enemy=color==='white'?'black':'white';
  for(let r=0;r<6;r++) for(let c=0;c<6;c++){
    if(board[r][c]?.color!==enemy) continue;
    if(rawMoves(board,r,c).some(([mr,mc])=>mr===k[0]&&mc===k[1])) return true;
  }
  return false;
}
function legalMoves(board,row,col){
  const p=board[row][col]; if(!p) return [];
  let moves=rawMoves(board,row,col).filter(([tr,tc])=>!inCheck(applyMove(board,row,col,tr,tc),p.color));
  if(p.color==='black'&&ownedGambits.includes('iron_curtain')) moves=moves.filter(([r])=>r>1);
  return moves;
}
function getAllLegal(board,color){
  const moves=[];
  for(let r=0;r<6;r++) for(let c=0;c<6;c++){
    if(board[r][c]?.color!==color) continue;
    legalMoves(board,r,c).forEach(([tr,tc])=>moves.push({from:[r,c],to:[tr,tc]}));
  }
  return moves;
}

// ─── events ──────────────────────────────────────────────────────────────
const EVENT_FLASH_DUR=4.5;
function showEvent(title,sub){eventTitle=title; eventSub=sub; eventFlash=EVENT_FLASH_DUR; logEntry('event',title);}

function triggerRandomEvent(){
  const pool=['summon_pawn','enemy_blunder','earthquake','power_up','gold_drop','enemy_summon','mirror','swap_sides'];
  const id=pool[Math.floor(Math.random()*pool.length)];

  if(id==='summon_pawn'){
    for(let c=5;c>=0;c--) if(!board[1][c]){board[1][c]={type:'pawn',color:'white',moved:false}; showEvent('Reinforcements!','A pawn appears on your side.'); return;}
    showEvent('Reinforcements!','...but no room. +15g instead.'); gold+=15;

  } else if(id==='enemy_blunder'){
    let best=null,bestVal=0;
    for(let r=0;r<6;r++) for(let c=0;c<6;c++){
      const p=board[r][c];
      if(p?.color==='black'&&p.type!=='king'&&PIECE_VALUE[p.type]>bestVal){bestVal=PIECE_VALUE[p.type]; best=[r,c];}
    }
    if(best){board[best[0]][best[1]]=null; showEvent('Enemy Blunder!','Their strongest piece self-destructs.');}
    else showEvent('Enemy Blunder!','Nothing left to blunder.');

  } else if(id==='earthquake'){
    const pieces=[];
    for(let r=0;r<6;r++) for(let c=0;c<6;c++) if(board[r][c]&&board[r][c].type!=='king') pieces.push([r,c]);
    if(pieces.length){
      const [r,c]=pieces[Math.floor(Math.random()*pieces.length)];
      const name=board[r][c].color+' '+board[r][c].type;
      board[r][c]=null;
      showEvent('Earthquake!',`A ${name} crumbles.`);
    }

  } else if(id==='power_up'){
    const upgradeChain={pawn:'knight',knight:'bishop',bishop:'rook',rook:'queen'};
    let worst=null,worstVal=999;
    for(let r=0;r<6;r++) for(let c=0;c<6;c++){
      const p=board[r][c];
      if(p?.color==='white'&&p.type!=='king'&&p.type!=='queen'&&PIECE_VALUE[p.type]<worstVal){worstVal=PIECE_VALUE[p.type]; worst=[r,c];}
    }
    if(worst){
      const old=board[worst[0]][worst[1]].type;
      const next=upgradeChain[old]||old;
      board[worst[0]][worst[1]].type=next;
      showEvent('Power Surge!',`Your ${old} ascends to ${next}.`);
    } else {gold+=25; showEvent('Power Surge!','+25 gold (nothing to upgrade).');}

  } else if(id==='gold_drop'){
    const amt=12+Math.floor(Math.random()*18);
    gold+=amt;
    showEvent('Gold Rain!',`+${amt} gold falls from the sky.`);

  } else if(id==='enemy_summon'){
    for(let c=0;c<6;c++) if(!board[4][c]){board[4][c]={type:'pawn',color:'black',moved:false}; showEvent('Enemy Reinforcements!','They summon a pawn...'); return;}
    showEvent('Enemy Reinforcements!','...but no room.');

  } else if(id==='mirror'){
    for(let r=0;r<6;r++) for(let c=0;c<3;c++){const tmp=board[r][c]; board[r][c]=board[r][5-c]; board[r][5-c]=tmp;}
    showEvent('Mirror!','The board flips horizontally.');

  } else if(id==='swap_sides'){
    // Swap one random white and one random black non-king piece
    const wp=[],bp=[];
    for(let r=0;r<6;r++) for(let c=0;c<6;c++){
      const p=board[r][c];
      if(p?.color==='white'&&p.type!=='king') wp.push([r,c]);
      if(p?.color==='black'&&p.type!=='king') bp.push([r,c]);
    }
    if(wp.length&&bp.length){
      const [wr,wc]=wp[Math.floor(Math.random()*wp.length)];
      const [br,bc]=bp[Math.floor(Math.random()*bp.length)];
      const tmp=board[wr][wc]; board[wr][wc]=board[br][bc]; board[br][bc]=tmp;
      if(board[wr][wc]) board[wr][wc].color='black';
      if(board[br][bc]) board[br][bc].color='white';
      showEvent('Chaos Swap!','Two pieces change allegiance.');
    }
  }
}

// ─── battle setup ────────────────────────────────────────────────────────
function setupBattle(){
  board=Array.from({length:6},()=>Array(6).fill(null));
  currentEncounter().black.forEach(({type,row,col})=>{board[row][col]={type,color:'black',moved:false};});

  const backRow=[];
  for(let i=0;i<roster.queen;i++) backRow.push('queen');
  for(let i=0;i<roster.rook;i++) backRow.push('rook');
  for(let i=0;i<roster.bishop;i++) backRow.push('bishop');
  for(let i=0;i<roster.knight;i++) backRow.push('knight');
  let col=0;
  backRow.forEach(type=>{if(col<5){board[0][col]={type,color:'white',moved:false};col++;}});
  board[0][5]={type:'king',color:'white',moved:false};
  for(let i=0;i<Math.min(roster.pawns,6);i++) board[1][i]={type:'pawn',color:'white',moved:false};

  turnColor='white'; selected=null; validMoves=[]; lastMove=null;
  aiThinking=false; bloodlustBonus=false; moveCount=0;
  hexUsed=false; hexMode=false;

  // Fortune gambit
  goldTiles=[];
  if(ownedGambits.includes('fortune')){
    const empty=[];
    for(let r=2;r<5;r++) for(let c=0;c<6;c++) if(!board[r][c]) empty.push([r,c]);
    for(let i=0;i<2&&empty.length;i++) goldTiles.push(empty.splice(Math.floor(Math.random()*empty.length),1)[0]);
  }

  // Battle modifier
  battleModifier=MODIFIER_POOL[Math.floor(Math.random()*MODIFIER_POOL.length)];
  mineSquares=[];
  if(battleModifier==='mines'){
    const candidates=[];
    for(let r=2;r<5;r++) for(let c=0;c<6;c++) if(!board[r][c]) candidates.push([r,c]);
    for(let i=0;i<2&&candidates.length;i++) mineSquares.push(candidates.splice(Math.floor(Math.random()*candidates.length),1)[0]);
  }
  modFlash = battleModifier ? 4.5 : 0;

  const eventInterval=ownedGambits.includes('chaos_theory')?3:5;
  eventTimer=eventInterval;

  battleTime=0;
  capturedValue=0;
  goldStartOfBattle=gold;
  battleLog=[];
}

// ─── after move shared logic ──────────────────────────────────────────────
function checkMineAndKinghill(movedRow,movedCol,color){
  // Mine check
  const mi=mineSquares.findIndex(([mr,mc])=>mr===movedRow&&mc===movedCol);
  if(mi>=0){
    const p=board[movedRow][movedCol];
    if(p){
      const isKing=p.type==='king';
      board[movedRow][movedCol]=null;
      mineSquares.splice(mi,1);
      showEvent('Minefield!',`A ${color} ${p.type} hit a mine!`);
      if(isKing){endBattle(color==='black'); return true;}
    }
  }
  // King of the Hill
  if(battleModifier==='kinghill'){
    const p=board[movedRow][movedCol];
    if(p?.type==='king'&&movedRow>=2&&movedRow<=3&&movedCol>=2&&movedCol<=3){
      endBattle(p.color==='white'); return true;
    }
  }
  return false;
}

// ─── player move ─────────────────────────────────────────────────────────
function moveNotation(fr,fc,tr,tc){
  const files='abcdef';
  return files[fc]+(fr+1)+files[tc]+(tr+1);
}
function doPlayerMove(fr,fc,tr,tc,isBonus=false){
  const captured=board[tr][tc];
  if(captured) capturedValue+=PIECE_VALUE[captured.type]||0;
  lastMove={fr,fc,tr,tc};
  const pieceType=board[fr][fc]?.type;
  logEntry('move',`you · ${pieceType} ${moveNotation(fr,fc,tr,tc)}${captured?` ×${captured.type}`:''}${isBonus?' ◆':''}`);
  board=applyMove(board,fr,fc,tr,tc);

  // Pawn promotion
  const promRow=ownedGambits.includes('promotion_rush')?4:5;
  if(board[tr][tc]?.type==='pawn'&&board[tr][tc]?.color==='white'&&tr>=promRow) board[tr][tc].type='queen';

  // Mutation: transform into captured piece
  if(captured&&ownedGambits.includes('mutation')&&captured.type!=='king'&&board[tr][tc]?.type!=='king'){
    board[tr][tc].type=captured.type;
  }

  // Necromancer
  if(captured&&ownedGambits.includes('necromancer')){
    for(let c=0;c<6;c++) if(!board[0][c]){board[0][c]={type:'pawn',color:'white',moved:false}; break;}
  }

  // Fortune
  const gi=goldTiles.findIndex(([r,c])=>r===tr&&c===tc);
  if(gi>=0){gold+=8; goldTiles.splice(gi,1);}

  selected=null; validMoves=[];

  if(checkMineAndKinghill(tr,tc,'white')) return;

  if(!findKing(board,'black')){endBattle(true); return;}
  if(getAllLegal(board,'black').length===0){endBattle(true); return;}

  // Events
  moveCount++;
  const eventInterval=ownedGambits.includes('chaos_theory')?3:5;
  if(moveCount%eventInterval===0) triggerRandomEvent();

  // Bloodlust: bonus move only on captures of value ≥ knight (no free queens from pawn snipes)
  if(captured&&ownedGambits.includes('bloodlust')&&!isBonus&&(PIECE_VALUE[captured.type]||0)>=3){
    bloodlustBonus=true; return;
  }

  bloodlustBonus=false;
  turnColor='black'; aiThinking=true; aiTimer=0.55;
}

// ─── AI ──────────────────────────────────────────────────────────────────
function doAIMove(){
  const moves=getAllLegal(board,'black');
  if(!moves.length){endBattle(true); return;}

  const enc=currentEncounter();

  // Checkmate in 1 — always take it
  for(const m of moves){
    const nb=applyMove(board,m.from[0],m.from[1],m.to[0],m.to[1]);
    if(getAllLegal(nb,'white').length===0&&inCheck(nb,'white')){execAI(m); return;}
  }

  // Score moves
  const scored=moves.map(m=>{
    const [fr,fc]=m.from,[tr,tc]=m.to;
    const piece=board[fr][fc], target=board[tr][tc];
    let score=0;

    // Capture value
    if(target) score+=PIECE_VALUE[target.type]*10;

    const nb=applyMove(board,fr,fc,tr,tc);

    // Check bonus
    if(inCheck(nb,'white')) score+=8;

    // Trade eval: if piece can be recaptured, was it worth it?
    const canBeCapt=getAllLegal(nb,'white').some(wm=>wm.to[0]===tr&&wm.to[1]===tc);
    if(canBeCapt){
      const loss=PIECE_VALUE[piece.type];
      const gain=target?PIECE_VALUE[target.type]:0;
      score+=(gain-loss)*7;
    }

    // Aggression: advance toward white king
    const wk=findKing(nb,'white');
    if(wk){
      const dist=Math.abs(tr-wk[0])+Math.abs(tc-wk[1]);
      score+=(7-dist)*0.9;
    }

    // Pawn push
    if(piece.type==='pawn') score+=(5-tr)*1.5;

    // Sacrifice bonus: if piece is already threatened, use it aggressively
    const alreadyThreatened=getAllLegal(board,'white').some(wm=>wm.to[0]===fr&&wm.to[1]===fc);
    if(alreadyThreatened&&target) score+=PIECE_VALUE[piece.type]*3;

    // Random chaos — occasional wild surges make AI unpredictable
    const prof=diffProfile();
    if(Math.random()<prof.chaos) score+=Math.random()*30;

    return {...m,score};
  });

  scored.sort((a,b)=>b.score-a.score);

  const prof=diffProfile();
  let chosen;
  if(enc.boss&&prof.optimalBoss){
    chosen=scored[0];
  } else {
    const topN=Math.min(prof.topN,scored.length);
    const w=prof.weights;
    let r=Math.random();
    chosen=scored[topN-1];
    for(let i=0;i<topN;i++){if(r<w[i]){chosen=scored[i]; break;} r-=w[i];}
  }
  execAI(chosen);
}

function execAI({from:[fr,fc],to:[tr,tc]}){
  const captured=board[tr][tc];
  const pieceType=board[fr][fc]?.type;
  logEntry('move',`foe · ${pieceType} ${moveNotation(fr,fc,tr,tc)}${captured?` ×${captured.type}`:''}`);
  lastMove={fr,fc,tr,tc};
  board=applyMove(board,fr,fc,tr,tc);

  if(board[tr][tc]?.type==='pawn'&&board[tr][tc]?.color==='black'&&tr===0) board[tr][tc].type='queen';

  aiThinking=false;

  if(checkMineAndKinghill(tr,tc,'black')) return;

  if(!findKing(board,'white')){endBattle(false); return;}
  if(getAllLegal(board,'white').length===0){
    endBattle(inCheck(board,'white')?false:null); return;
  }
  turnColor='white';
}

// ─── battle end ───────────────────────────────────────────────────────────
function syncRosterToSurvivors(){
  // Pieces that died this battle stay dead — must be re-bought in the shop.
  const survivors={queen:0,rook:0,bishop:0,knight:0,pawns:0};
  for(let r=0;r<6;r++) for(let c=0;c<6;c++){
    const p=board[r][c]; if(!p||p.color!=='white') continue;
    if(p.type==='pawn') survivors.pawns++;
    else if(p.type==='queen') survivors.queen++;
    else if(p.type==='rook') survivors.rook++;
    else if(p.type==='bishop') survivors.bishop++;
    else if(p.type==='knight') survivors.knight++;
  }
  roster.queen=survivors.queen;
  roster.rook=survivors.rook;
  roster.bishop=survivors.bishop;
  roster.knight=survivors.knight;
  roster.pawns=survivors.pawns;
}

function endBattle(playerWon){
  if(playerWon===null){setupBattle(); return;}
  if(!playerWon){
    phase='gameover';
    hiEncounter=Math.max(hiEncounter,encounter);
    localStorage.setItem(hiDepthKey(),hiEncounter);
    hiScore=Math.max(hiScore,runScore);
    localStorage.setItem(hiScoreKey(),hiScore);
    return;
  }
  if(diffProfile().rosterDeaths) syncRosterToSurvivors();
  const enc=currentEncounter();
  const reward=enc.goldReward+Math.floor(wager*wagerMult);
  gold+=reward;
  hiEncounter=Math.max(hiEncounter,encounter+1);
  localStorage.setItem(hiDepthKey(),hiEncounter);

  const goldEarned=Math.max(0,gold-goldStartOfBattle);
  const capPts=capturedValue*10;
  const timeBonus=Math.max(0,Math.round((180-battleTime)*1.5));
  const depthBonus=gameMode==='infinite'?encounter*15:0;
  const total=goldEarned+capPts+timeBonus+depthBonus;
  roundEnd={active:true,gold:goldEarned,captures:capPts,timeBonus,depthBonus,total,t:0,
            wasBoss:enc.boss,nextIsShop:isScheduledShop(),
            isFinal:isFinalEncounter()};
  phase='round_end';
}

// ─── gambit pick ─────────────────────────────────────────────────────────
const MIN_ROSTER_BEFORE_SHOP=4;
function needsEmergencyShop(){
  return roster.queen+roster.rook+roster.bishop+roster.knight+roster.pawns<MIN_ROSTER_BEFORE_SHOP;
}
function startGambitPick(){
  if(gambitPicksLeft<=0){
    if(isScheduledShop()||needsEmergencyShop()){phase='shop'; return;}
    encounter++;
    phase='wager';
    return;
  }
  const pool=ALL_GAMBITS.filter(g=>!ownedGambits.includes(g.id));
  if(!pool.length){gambitPicksLeft=0; startGambitPick(); return;}
  gambitOptions=[...pool].sort(()=>Math.random()-0.5).slice(0,Math.min(3,pool.length));
  phase='gambit_pick';
}
function pickGambit(idx){
  if(idx>=0&&idx<gambitOptions.length) ownedGambits.push(gambitOptions[idx].id);
  gambitPicksLeft--;
  startGambitPick();
}

// ─── shop ────────────────────────────────────────────────────────────────
const MAX_BACK_RANK=5; // col 5 is king
const MAX_PAWNS=6;
function backRankUsed(){return roster.queen+roster.rook+roster.bishop+roster.knight;}
function canBuy(id){
  if(id==='pawn') return roster.pawns<MAX_PAWNS;
  return backRankUsed()<MAX_BACK_RANK;
}
function buyItem(id,cost){
  if(!canBuy(id)) return;
  if(gold<cost) return;
  gold-=cost;
  if(id==='pawn') roster.pawns++; else roster[id]++;
}
function leaveShop(){encounter++; phase='wager';}

// ─── run start ────────────────────────────────────────────────────────────
function startRun(){
  encounter=0; gold=50; ownedGambits=[];
  roster={queen:0,rook:1,bishop:0,knight:0,pawns:3};
  wager=0; wagerMult=1;
  runScore=0;
  hiEncounter=+localStorage.getItem(hiDepthKey())||0;
  hiScore=+localStorage.getItem(hiScoreKey())||0;
  runStartHi=hiScore;
  infEncounters=[];
  roundEnd={active:false,gold:0,captures:0,timeBonus:0,total:0,t:0};
  phase='wager';
}

// ─── layout ───────────────────────────────────────────────────────────────
function boardOrigin(){
  const bw=SQ*6,hudW=200,totalW=bw+hudW+24;
  if(isMobile||W<=totalW){
    const startX=Math.round((W-bw)/2);
    const startY=Math.max(60,Math.round((H-bw-160)/2));
    return {x:startX,y:startY,hudX:16,hudY:startY+bw+18,mobile:true};
  }
  const startX=Math.round((W-totalW)/2);
  return {x:startX,y:Math.round((H-SQ*6)/2),hudX:startX+bw+24,hudY:Math.round((H-SQ*6)/2),mobile:false};
}
function screenToCell(mx,my){
  const {x:bx,y:by}=boardOrigin();
  if(mx<bx||my<by) return null;
  const col=Math.floor((mx-bx)/SQ),row=5-Math.floor((my-by)/SQ);
  if(col<0||col>=6||row<0||row>=6) return null;
  return [row,col];
}

// ─── fog helper ───────────────────────────────────────────────────────────
function isVisibleUnderFog(r,c){
  for(let wr=0;wr<6;wr++) for(let wc=0;wc<6;wc++)
    if(board[wr][wc]?.color==='white'&&Math.abs(wr-r)<=2&&Math.abs(wc-c)<=2) return true;
  return false;
}

// ─── draw board ───────────────────────────────────────────────────────────
function drawBoard(){
  tooltipZones=[]; hitAreas=[];
  const {x:bx,y:by,hudX,hudY,mobile}=boardOrigin();

  for(let r=0;r<6;r++){
    for(let c=0;c<6;c++){
      const px=bx+c*SQ,py=by+(5-r)*SQ;
      const isLight=(r+c)%2===0;
      ctx.fillStyle=isLight?C.sqLight:C.sqDark;
      ctx.fillRect(px,py,SQ,SQ);

      // Last move
      if(lastMove&&((r===lastMove.fr&&c===lastMove.fc)||(r===lastMove.tr&&c===lastMove.tc))){
        ctx.fillStyle='rgba(255,210,60,0.20)'; ctx.fillRect(px,py,SQ,SQ);
      }
      // Selected
      if(selected&&selected[0]===r&&selected[1]===c){
        ctx.fillStyle='rgba(80,180,80,0.38)'; ctx.fillRect(px,py,SQ,SQ);
      }
      // Hex mode hover
      if(hexMode&&board[r][c]?.color==='black'&&board[r][c]?.type!=='king'){
        ctx.fillStyle='rgba(180,60,60,0.28)'; ctx.fillRect(px,py,SQ,SQ);
      }
      // Check highlight
      if(board&&inCheck(board,'white')){
        const k=findKing(board,'white');
        if(k&&k[0]===r&&k[1]===c){ctx.fillStyle='rgba(220,50,50,0.38)'; ctx.fillRect(px,py,SQ,SQ);}
      }
      // Valid move dots
      if(validMoves.some(([vr,vc])=>vr===r&&vc===c)){
        if(board[r][c]){
          ctx.strokeStyle='rgba(80,180,80,0.6)'; ctx.lineWidth=3;
          ctx.strokeRect(px+3,py+3,SQ-6,SQ-6);
        } else {
          ctx.fillStyle='rgba(80,180,80,0.45)';
          ctx.beginPath(); ctx.arc(px+SQ/2,py+SQ/2,SQ*0.13,0,Math.PI*2); ctx.fill();
        }
      }
      // Mines
      if(mineSquares.some(([mr,mc])=>mr===r&&mc===c)){
        ctx.fillStyle='rgba(200,80,80,0.7)';
        ctx.font=`${Math.round(SQ*0.28)}px DM Mono,monospace`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('✕',px+SQ/2,py+SQ/2);
      }
      // Gold tiles
      if(goldTiles.some(([gr,gc])=>gr===r&&gc===c)){
        ctx.fillStyle='#c8a020';
        ctx.font=`${Math.round(SQ*0.3)}px DM Mono,monospace`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('◆',px+SQ/2,py+SQ/2+1);
      }
      // King of hill center highlight
      if(battleModifier==='kinghill'&&r>=2&&r<=3&&c>=2&&c<=3){
        ctx.fillStyle='rgba(200,180,60,0.12)'; ctx.fillRect(px,py,SQ,SQ);
      }

      // Pieces
      const p=board[r][c];
      if(p){
        // Fog: hide enemy pieces not near your pieces
        if(battleModifier==='fog'&&p.color==='black'&&!isVisibleUnderFog(r,c)) continue;
        ctx.font=`${Math.round(SQ*0.64)}px serif`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle=p.color==='white'?C.text:C.enemy;
        ctx.fillText(GLYPHS[p.color][p.type],px+SQ/2,py+SQ/2+2);
      }
    }
  }

  // Coordinates
  ctx.font=`10px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
  ctx.textAlign='center'; ctx.textBaseline='top';
  'abcdef'.split('').forEach((l,i)=>ctx.fillText(l,bx+i*SQ+SQ/2,by+SQ*6+4));
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let r=0;r<6;r++) ctx.fillText(r+1,bx-4,by+(5-r)*SQ+SQ/2);

  drawHUD(hudX,hudY,mobile);

  // Modifier intro flash (semi-transparent banner near top of board)
  if(battleModifier&&modFlash>0){
    const fade=Math.min(1,modFlash)*Math.min(1,modFlash*0.8);
    const isDark=document.body.classList.contains('dark');
    const bandY=by-4, bandH=54;
    ctx.fillStyle=isDark?`rgba(17,17,16,${0.72*fade})`:`rgba(245,244,240,${0.78*fade})`;
    ctx.fillRect(bx,bandY,SQ*6,bandH);
    ctx.strokeStyle=`rgba(200,160,32,${0.6*fade})`; ctx.lineWidth=1;
    ctx.strokeRect(bx+0.5,bandY+0.5,SQ*6-1,bandH-1);
    ctx.globalAlpha=fade;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const modLabel={fog:'Fog of War',mines:'Minefield',kinghill:'King of the Hill'}[battleModifier]||battleModifier;
    const modDesc={
      fog:'Enemy pieces hidden when not nearby.',
      mines:'Two squares are mined — step with care.',
      kinghill:'Place your King on the center to win.'
    }[battleModifier]||'';
    ctx.font=`500 16px 'DM Mono',monospace`; ctx.fillStyle=C.text;
    ctx.fillText(modLabel,bx+SQ*3,bandY+19);
    ctx.font=`300 12px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
    ctx.fillText(modDesc,bx+SQ*3,bandY+39);
    ctx.globalAlpha=1;
  }

  // Tooltip (drawn last so it sits on top)
  drawTooltip();

  // Event flash (semi-transparent toast above board)
  if(eventFlash>0){
    const fade=Math.min(1,eventFlash*1.5)*Math.min(1,(EVENT_FLASH_DUR-eventFlash)*3);
    const a=Math.max(0,fade);
    const isDark=document.body.classList.contains('dark');
    const tY=by-4, tH=50;
    ctx.fillStyle=isDark?`rgba(17,17,16,${0.62*a})`:`rgba(245,244,240,${0.72*a})`;
    ctx.fillRect(bx+SQ*0.5,tY,SQ*5,tH);
    ctx.strokeStyle=`rgba(140,140,140,${0.35*a})`; ctx.lineWidth=1;
    ctx.strokeRect(bx+SQ*0.5+0.5,tY+0.5,SQ*5-1,tH-1);
    ctx.globalAlpha=a;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`500 15px 'DM Mono',monospace`; ctx.fillStyle=C.text;
    ctx.fillText(eventTitle,bx+SQ*3,tY+18);
    ctx.font=`300 12px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
    ctx.fillText(eventSub,bx+SQ*3,tY+36);
    ctx.globalAlpha=1;
  }
}

// ─── HUD ─────────────────────────────────────────────────────────────────
function fmtTime(s){const m=Math.floor(s/60),r=Math.floor(s%60);return `${m}:${r.toString().padStart(2,'0')}`;}

function drawTooltip(){
  const z=tooltipZones.find(t=>mouseX>=t.x&&mouseX<t.x+t.w&&mouseY>=t.y&&mouseY<t.y+t.h);
  if(!z) return;
  ctx.font=`300 11px 'DM Mono',monospace`;
  const {lines,maxLineW}=wrapText(z.text,Math.min(280,W-32));
  const padX=10,padY=8,lh=15;
  const tw=maxLineW+padX*2;
  const th=lines.length*lh+padY*2;
  let tx=mouseX+14, ty=mouseY+14;
  if(tx+tw>W-8) tx=mouseX-tw-14;
  if(ty+th>H-8) ty=mouseY-th-14;
  const isDark=document.body.classList.contains('dark');
  ctx.fillStyle=isDark?'rgba(20,20,18,0.96)':'rgba(250,250,246,0.96)';
  ctx.fillRect(tx,ty,tw,th);
  ctx.strokeStyle=C.line; ctx.lineWidth=1;
  ctx.strokeRect(tx+0.5,ty+0.5,tw-1,th-1);
  ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillStyle=C.text;
  lines.forEach((l,i)=>ctx.fillText(l,tx+padX,ty+padY+i*lh));
}

const MOD_DESCS={
  fog:'Fog of War — enemy pieces hidden when no white piece is within 2 squares.',
  mines:'Minefield — two hidden squares destroy any piece that lands on them.',
  kinghill:'King of the Hill — move your King to the center 2×2 to win.',
};

function drawHUD(hx,by,mobile){
  const enc=currentEncounter();
  ctx.textAlign='left'; ctx.textBaseline='top';

  if(mobile){
    let x=hx;
    const top=by;
    ctx.font=`300 12px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
    ctx.fillText(`${gameMode==='infinite'?`depth ${encounter+1}`:`${encounter+1}/7`}`,x,top); x+=52;
    ctx.font=`500 13px 'DM Mono',monospace`; ctx.fillStyle=enc.boss?'#c89020':C.text;
    ctx.fillText(enc.name+(enc.boss?' ★':''),x,top); x+=Math.max(120,ctx.measureText(enc.name).width+32);
    ctx.font=`400 13px 'DM Mono',monospace`; ctx.fillStyle='#c8a020';
    ctx.fillText(`◆${gold}`,x,top); x+=78;
    ctx.fillStyle=C.muted; ctx.font=`300 12px 'DM Mono',monospace`;
    ctx.fillText(fmtTime(battleTime),x,top);

    let y2=top+22;
    ctx.font=`500 13px 'DM Mono',monospace`;
    ctx.fillStyle=turnColor==='white'&&!aiThinking?C.text:C.muted;
    ctx.fillText(aiThinking?'thinking...':bloodlustBonus?'◆ bonus move':'your turn',hx,y2);
    if(battleModifier){
      ctx.font=`300 11px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
      const ml={fog:'fog',mines:'mines',kinghill:'hill'}[battleModifier]||battleModifier;
      const label=`[ ${ml} ]`;
      const lw=ctx.measureText(label).width;
      ctx.fillText(label,hx+140,y2+1);
      tooltipZones.push({x:hx+140,y:y2-2,w:lw+6,h:18,text:MOD_DESCS[battleModifier]||battleModifier});
    }
    if(ownedGambits.length){
      let y3=y2+22;
      ctx.font=`400 11px 'DM Mono',monospace`; ctx.fillStyle=C.text;
      let cx=hx;
      ownedGambits.forEach(id=>{
        const g=ALL_GAMBITS.find(g=>g.id===id); if(!g) return;
        const tw=ctx.measureText(g.name).width;
        if(cx+tw>W-16){cx=hx; y3+=18;}
        ctx.fillText(g.name,cx,y3);
        tooltipZones.push({x:cx-2,y:y3-2,w:tw+4,h:16,text:`${g.name} — ${g.desc}`});
        cx+=tw+14;
      });
    }
    if(ownedGambits.includes('hex')&&!hexUsed){
      ctx.font=`500 12px 'DM Mono',monospace`;
      ctx.fillStyle=hexMode?C.text:C.muted;
      const label=hexMode?'[ H ] hex active':'[ H ] hex';
      const lw=ctx.measureText(label).width;
      ctx.fillText(label,W-lw-16,top);
      hitAreas.push({x:W-lw-20,y:top-4,w:lw+12,h:22,action:()=>{if(turnColor==='white'&&!aiThinking){hexMode=!hexMode; if(hexMode){selected=null; validMoves=[];}}}});
      tooltipZones.push({x:W-lw-20,y:top-4,w:lw+12,h:22,text:'Hex — once per battle, remove any non-king enemy piece.'});
    }
    if(bloodlustBonus){
      const label='[skip bonus]';
      ctx.font=`400 11px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
      const lw=ctx.measureText(label).width;
      ctx.fillText(label,W-lw-16,top+22);
      hitAreas.push({x:W-lw-20,y:top+18,w:lw+12,h:20,action:()=>{bloodlustBonus=false; selected=null; validMoves=[]; turnColor='black'; aiThinking=true; aiTimer=0.55;}});
    }
    drawBattleLog(hx,top+(ownedGambits.length?80:60),W-hx-16,H-(top+(ownedGambits.length?80:60))-12,true);
    return;
  }

  let y=by;
  const lh=22;

  ctx.font=`300 11px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
  ctx.fillText(`${gameMode==='infinite'?`depth ${encounter+1}`:`${encounter+1} / 7`}  ·  ${difficulty}`,hx,y); y+=lh;

  ctx.font=`500 16px 'DM Mono',monospace`; ctx.fillStyle=enc.boss?'#c89020':C.text;
  ctx.fillText(enc.name+(enc.boss?'  ★':''),hx,y); y+=lh*1.3;

  if(battleModifier){
    const ml={fog:'fog',mines:'mines',kinghill:'hill'}[battleModifier]||battleModifier;
    ctx.font=`300 11px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
    const label=`[ ${ml} ]`;
    ctx.fillText(label,hx,y);
    const lw=ctx.measureText(label).width;
    tooltipZones.push({x:hx-2,y:y-2,w:lw+6,h:18,text:MOD_DESCS[battleModifier]||battleModifier});
    y+=lh;
  }
  y+=4;

  ctx.font=`500 14px 'DM Mono',monospace`;
  ctx.fillStyle=turnColor==='white'&&!aiThinking?C.text:C.muted;
  ctx.fillText(aiThinking?'thinking...':bloodlustBonus?'◆ bonus move':'your turn',hx,y); y+=lh*1.3;

  ctx.font=`400 13px 'DM Mono',monospace`; ctx.fillStyle='#c8a020';
  ctx.fillText(`◆ ${gold}`,hx,y); y+=lh;
  ctx.font=`300 12px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
  ctx.fillText(`time  ${fmtTime(battleTime)}`,hx,y); y+=lh*1.2;

  if(wager>0){
    ctx.font=`300 11px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
    ctx.fillText(`bet  ${wager}g  ×${wagerMult}`,hx,y); y+=lh;
  }
  y+=4;

  if(ownedGambits.length){
    ctx.font=`300 10px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
    ctx.fillText('gambits',hx,y); y+=lh*0.85;
    ownedGambits.forEach(id=>{
      const g=ALL_GAMBITS.find(g=>g.id===id);
      if(!g) return;
      ctx.font=`400 12px 'DM Mono',monospace`; ctx.fillStyle=C.text;
      ctx.fillText(g.name,hx,y);
      const tw=ctx.measureText(g.name).width;
      tooltipZones.push({x:hx-2,y:y-2,w:tw+6,h:18,text:`${g.name} — ${g.desc}`});
      y+=lh*0.95;
    });
    y+=4;
  }

  // Hex button
  if(ownedGambits.includes('hex')&&!hexUsed){
    ctx.font=`500 12px 'DM Mono',monospace`;
    ctx.fillStyle=hexMode?C.text:C.muted;
    const label=hexMode?'[ H ]  hex — click enemy':'[ H ]  hex — ready';
    ctx.fillText(label,hx,y);
    const lw=ctx.measureText(label).width;
    hitAreas.push({x:hx-2,y:y-2,w:lw+6,h:20,action:()=>{if(turnColor==='white'&&!aiThinking){hexMode=!hexMode; if(hexMode){selected=null; validMoves=[];}}}});
    tooltipZones.push({x:hx-2,y:y-2,w:lw+6,h:20,text:'Hex — once per battle, remove any non-king enemy piece.'});
    y+=lh;
  }

  // Skip-bonus button (replaces the old click-off-to-cancel)
  if(bloodlustBonus){
    ctx.font=`400 11px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
    const label='[ skip bonus move ]';
    ctx.fillText(label,hx,y);
    const lw=ctx.measureText(label).width;
    hitAreas.push({x:hx-2,y:y-2,w:lw+6,h:18,action:()=>{bloodlustBonus=false; selected=null; validMoves=[]; turnColor='black'; aiThinking=true; aiTimer=0.55;}});
    y+=lh;
  }
  y+=6;

  // History log
  drawBattleLog(hx,y,200,H-y-20,false);
}

function drawBattleLog(x,y,w,h,compact){
  if(battleLog.length===0) return;
  const lh=compact?13:14;
  const headerH=14, bottomPad=8;
  const avail=h-headerH-bottomPad;
  const maxLines=Math.floor(avail/lh);
  if(maxLines<1||w<60) return;
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.font=`300 10px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
  ctx.fillText('history',x,y);
  const items=battleLog.slice(-maxLines);
  let ly=y+headerH;
  items.forEach(it=>{
    if(ly+lh>y+h) return;
    ctx.font=`300 ${compact?10:11}px 'DM Mono',monospace`;
    ctx.fillStyle=it.kind==='event'?'#c89020':(it.text.startsWith('foe')?C.muted:C.text);
    let txt=it.text;
    while(ctx.measureText(txt).width>w-4&&txt.length>6) txt=txt.slice(0,-2);
    if(txt!==it.text) txt=txt.slice(0,-1)+'…';
    ctx.fillText(txt,x,ly); ly+=lh;
  });
}

// ─── round end (score tally animation) ─────────────────────────────────────
function advanceFromRoundEnd(){
  const re=roundEnd;
  runScore+=re.total;
  hiScore=Math.max(hiScore,runScore);
  localStorage.setItem('gambit_hiscore',hiScore);
  re.active=false;

  if(re.isFinal){phase='victory'; return;}
  const enc=currentEncounter();
  gambitPicksLeft=enc.boss?2:1;
  startGambitPick();
}

function drawRoundEnd(){
  hitAreas=[];
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';

  const enc=currentEncounter();
  const re=roundEnd;
  const t=re.t;

  // Stagger reveal: gold @0.3, captures @1.2, time @2.1, total @3.2
  const showGold=Math.max(0,Math.min(1,(t-0.3)/0.7));
  const showCap =Math.max(0,Math.min(1,(t-1.2)/0.7));
  const showTime=Math.max(0,Math.min(1,(t-2.1)/0.7));
  const showTot =Math.max(0,Math.min(1,(t-3.2)/0.9));
  const done=t>=4.4;

  ctx.font=`300 11px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
  ctx.fillText(gameMode==='infinite'?`depth ${encounter+1}  cleared`:`encounter ${encounter+1} / 7  defeated`,W/2,H*0.18);
  ctx.font=`400 24px 'DM Mono',monospace`; ctx.fillStyle=re.wasBoss?'#c89020':C.text;
  ctx.fillText(enc.name+(re.wasBoss?'  ★':''),W/2,H*0.26);

  const labelX=W/2-90, valX=W/2+110;
  let y=H*0.42;
  const lh=34;

  const drawRow=(label,val,prog,suffix='pts')=>{
    ctx.globalAlpha=prog;
    ctx.textAlign='left'; ctx.font=`300 12px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
    ctx.fillText(label,labelX,y);
    ctx.textAlign='right'; ctx.font=`400 14px 'DM Mono',monospace`; ctx.fillStyle=C.text;
    const animVal=Math.round(val*prog);
    ctx.fillText(`+${animVal} ${suffix}`,valX,y);
    ctx.globalAlpha=1;
    y+=lh;
  };

  drawRow('gold earned',re.gold,showGold,'pts');
  drawRow('pieces captured',re.captures,showCap,'pts');
  drawRow('time bonus',re.timeBonus,showTime,'pts');
  if(re.depthBonus>0) drawRow('depth bonus',re.depthBonus,showTime,'pts');

  y+=8;
  ctx.globalAlpha=showTot;
  ctx.strokeStyle=C.line; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(labelX,y-4); ctx.lineTo(valX,y-4); ctx.stroke();
  ctx.textAlign='left'; ctx.font=`400 13px 'DM Mono',monospace`; ctx.fillStyle=C.text;
  ctx.fillText('round score',labelX,y+18);
  ctx.textAlign='right'; ctx.font=`500 22px 'DM Mono',monospace`; ctx.fillStyle='#c8a020';
  const totalAnim=Math.round(re.total*showTot);
  ctx.fillText(`${totalAnim}`,valX,y+18);
  ctx.globalAlpha=1;

  // Running total
  if(showTot>0){
    ctx.globalAlpha=showTot;
    ctx.textAlign='center'; ctx.font=`300 10px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
    ctx.fillText(`run total  ${runScore+Math.round(re.total*showTot)}`,W/2,y+50);
    ctx.globalAlpha=1;
  }

  ctx.textAlign='center'; ctx.font=`300 10px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
  ctx.fillText(done?(isMobile?'tap to continue':'click or any key to continue'):'tallying…',W/2,H*0.82);

  // Click-anywhere advance (also can skip animation)
  hitAreas.push({x:0,y:0,w:W,h:H,action:()=>{
    if(t<4.4){roundEnd.t=4.5; return;}
    advanceFromRoundEnd();
  }});
}

// ─── gambit pick screen ────────────────────────────────────────────────────
function drawGambitPick(){
  hitAreas=[];
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`300 11px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
  ctx.fillText(gambitPicksLeft>1?`pick  ${gambitPicksLeft}  gambits`:'pick a gambit',W/2,H*0.2);
  ctx.font=`300 10px 'DM Mono',monospace`;
  ctx.fillText(`◆ ${gold}`,W/2,H*0.2+20);

  const cardW=Math.min(200,W/gambitOptions.length-24);
  const cardH=120;
  const gap=16;
  const totalW=gambitOptions.length*(cardW+gap)-gap;
  let ox=W/2-totalW/2;

  for(let i=0;i<gambitOptions.length;i++){
    const g=gambitOptions[i];
    const cx=ox+cardW/2,cy=H*0.52;
    const hovered=mouseX>=ox&&mouseX<ox+cardW&&mouseY>=cy-cardH/2&&mouseY<cy+cardH/2;

    ctx.fillStyle=hovered?C.line:'transparent';
    if(hovered){ctx.fillRect(ox,cy-cardH/2,cardW,cardH);}
    ctx.strokeStyle=C.line; ctx.lineWidth=1;
    ctx.strokeRect(ox,cy-cardH/2,cardW,cardH);

    ctx.font=`400 13px 'DM Mono',monospace`; ctx.fillStyle=C.text;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(g.name,cx,cy-28);

    ctx.font=`300 9px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
    let ty=cy-8;
    wrapText(g.desc,cardW-20).lines.forEach(l=>{ctx.fillText(l,cx,ty); ty+=14;});

    ctx.font=`300 10px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
    ctx.fillText(`[ ${i+1} ]`,cx,cy+46);

    hitAreas.push({x:ox,y:cy-cardH/2,w:cardW,h:cardH,action:()=>pickGambit(i)});
    ox+=cardW+gap;
  }

  ctx.font=`300 9px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
  ctx.textAlign='center';
  ctx.fillText(isMobile?'tap a card':'1 · 2 · 3  or click',W/2,H*0.8);
}

// ─── shop ─────────────────────────────────────────────────────────────────
function drawShop(){
  hitAreas=[];
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`400 22px 'DM Mono',monospace`; ctx.fillStyle=C.text;
  ctx.fillText('shop',W/2,H*0.18);
  ctx.font=`300 12px 'DM Mono',monospace`; ctx.fillStyle='#c8a020';
  ctx.fillText(`◆ ${gold}`,W/2,H*0.18+28);
  ctx.font=`300 10px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
  ctx.fillText(`back rank  ${backRankUsed()} / ${MAX_BACK_RANK}    pawns  ${roster.pawns} / ${MAX_PAWNS}`,W/2,H*0.18+46);

  if(diffProfile().rosterDeaths){
    ctx.font=`500 13px 'DM Mono',monospace`;
    if(tipW==null) tipW=ctx.measureText(TIP_MSG).width+28;
    const w=Math.min(tipW,W*0.9),h=30,x=W/2-w/2,y=H*0.18+64;
    ctx.fillStyle='rgba(160,40,40,0.12)'; ctx.fillRect(x,y,w,h);
    ctx.strokeStyle='#b03030'; ctx.lineWidth=1; ctx.strokeRect(x,y,w,h);
    ctx.fillStyle='#c83030'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(TIP_MSG,W/2,y+h/2);
  }

  const itemW=Math.min(320,W*0.85),itemH=52,gap=10;
  const totalH=SHOP_CATALOG.length*(itemH+gap)+itemH+gap*2;
  let oy=H/2-totalH/2+20;
  const ox=W/2-itemW/2;

  SHOP_CATALOG.forEach((item,i)=>{
    const cost=itemCost(item);
    const atCap=!canBuy(item.id);
    const canAfford=gold>=cost&&!atCap;
    const hovered=mouseX>=ox&&mouseX<ox+itemW&&mouseY>=oy&&mouseY<oy+itemH;
    ctx.fillStyle=hovered&&canAfford?C.line:'transparent';
    if(hovered&&canAfford) ctx.fillRect(ox,oy,itemW,itemH);
    ctx.strokeStyle=canAfford?C.line:C.sqDark; ctx.lineWidth=1;
    ctx.strokeRect(ox,oy,itemW,itemH);

    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.font=`400 12px 'DM Mono',monospace`; ctx.fillStyle=canAfford?C.text:C.muted;
    ctx.fillText(item.name+(item.id==='queen'&&roster.queen>0?`  (${roster.queen} owned)`:''),ox+14,oy+17);
    ctx.font=`300 10px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
    ctx.fillText(atCap?(item.id==='pawn'?'pawn row full':'back rank full'):item.desc,ox+14,oy+36);
    ctx.textAlign='right';
    ctx.font=`400 11px 'DM Mono',monospace`; ctx.fillStyle=canAfford?'#c8a020':C.muted;
    ctx.fillText(atCap?'—':`◆ ${cost}`,ox+itemW-14,oy+itemH/2);

    if(canAfford) hitAreas.push({x:ox,y:oy,w:itemW,h:itemH,action:()=>buyItem(item.id,cost)});
    oy+=itemH+gap;
  });

  oy+=gap;
  const hovered=mouseX>=ox&&mouseX<ox+itemW&&mouseY>=oy&&mouseY<oy+itemH;
  ctx.fillStyle=hovered?C.line:'transparent';
  if(hovered) ctx.fillRect(ox,oy,itemW,itemH);
  ctx.strokeStyle=C.line; ctx.lineWidth=1; ctx.strokeRect(ox,oy,itemW,itemH);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`400 12px 'DM Mono',monospace`; ctx.fillStyle=C.text;
  ctx.fillText('→  leave',W/2,oy+itemH/2);
  hitAreas.push({x:ox,y:oy,w:itemW,h:itemH,action:leaveShop});
}

// ─── wager screen ─────────────────────────────────────────────────────────
function drawWager(){
  hitAreas=[];
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  const enc=currentEncounter();

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`300 10px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
  ctx.fillText(gameMode==='infinite'?`depth ${encounter+1}`:`encounter ${encounter+1} / 7`,W/2,H*0.26);
  ctx.font=`400 26px 'DM Mono',monospace`; ctx.fillStyle=enc.boss?'#c89020':C.text;
  ctx.fillText(enc.name+(enc.boss?'  ★':''),W/2,H*0.34);
  ctx.font=`300 11px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
  ctx.fillText(`◆ ${gold}  gold`,W/2,H*0.34+30);
  ctx.fillText('wager?',W/2,H*0.5);

  const markMult=ownedGambits.includes('gamblers_mark')?2:1;
  const opts=[
    {label:'pass',  bet:0,           winMult:0},
    {label:'risky', bet:Math.floor(gold*0.25), winMult:2},
    {label:'bold',  bet:Math.floor(gold*0.5),  winMult:3},
    {label:'all in',bet:gold,        winMult:5},
  ];

  const cardW=Math.min(120,W/5-8),cardH=96,gap=10;
  const totalW=opts.length*(cardW+gap)-gap;
  let ox=W/2-totalW/2;

  opts.forEach((opt,i)=>{
    const cy=H*0.66;
    const profit=Math.floor(opt.bet*(opt.winMult-1)*markMult);
    const hovered=mouseX>=ox&&mouseX<ox+cardW&&mouseY>=cy-cardH/2&&mouseY<cy+cardH/2;

    ctx.fillStyle=hovered?C.line:C.sqLight;
    ctx.fillRect(ox,cy-cardH/2,cardW,cardH);
    if(hovered){ctx.strokeStyle=C.text; ctx.lineWidth=1; ctx.strokeRect(ox,cy-cardH/2,cardW,cardH);}

    const cx=ox+cardW/2;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`400 12px 'DM Mono',monospace`; ctx.fillStyle=C.text;
    ctx.fillText(opt.label,cx,cy-32);

    ctx.font=`300 9px 'DM Mono',monospace`;
    if(opt.bet>0){
      ctx.fillStyle=C.muted; ctx.fillText(`bet  ${opt.bet}g`,cx,cy-14);
      ctx.fillStyle='#5a9e40'; ctx.fillText(`win  +${profit}g`,cx,cy+2);
      ctx.fillStyle='#b04040'; ctx.fillText(`lose  −${opt.bet}g`,cx,cy+18);
      if(markMult>1){ctx.fillStyle='#c89020'; ctx.fillText('★ doubled',cx,cy+34);}
    } else {
      ctx.fillStyle=C.muted; ctx.fillText('no risk',cx,cy);
    }

    hitAreas.push({x:ox,y:cy-cardH/2,w:cardW,h:cardH,action:()=>{
      wager=opt.bet;
      wagerMult=opt.winMult*markMult;
      gold=Math.max(0,gold-opt.bet);
      phase='battle';
      setupBattle();
    }});
    ox+=cardW+gap;
  });

  ctx.font=`300 9px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
  ctx.textAlign='center';
  ctx.fillText(isMobile?'tap to choose':'click to choose',W/2,H*0.82);
  if(ownedGambits.includes('gamblers_mark')){
    ctx.fillStyle='#c89020';
    ctx.fillText("gambler's mark  ★  win rewards doubled",W/2,H*0.82+18);
  }
}

// Memoized wrap of HELP_SECTIONS keyed by column width — the lines never change,
// only the column width does (and only on resize).
const helpWrapCache=new Map();
function wrappedHelp(width,mobile,bodyPx){
  const key=`${width|0}-${mobile?'m':'d'}-${bodyPx}`;
  let cached=helpWrapCache.get(key);
  if(cached) return cached;
  ctx.font=`300 ${bodyPx}px 'DM Mono',monospace`;
  cached=HELP_SECTIONS.map(sec=>{
    const lines=mobile&&sec.mobile?sec.mobile:sec.lines;
    return {h:sec.h,wrapped:lines.flatMap(ln=>wrapText(ln,width).lines)};
  });
  helpWrapCache.set(key,cached);
  return cached;
}

function drawHelpOverlay(){
  const isDark=document.body.classList.contains('dark');
  ctx.fillStyle=isDark?'rgba(10,10,8,0.96)':'rgba(248,247,243,0.96)';
  ctx.fillRect(0,0,W,H);

  const titlePx=isMobile?18:22, headerPx=isMobile?11:12, bodyPx=isMobile?10:11;
  const titleGap=isMobile?26:32, headerGap=isMobile?16:18, lineGap=isMobile?13:15, sectGap=isMobile?8:10;
  const padX=Math.min(60,W*0.08);
  const colW=Math.min(W-padX*2,720);
  const colX=W/2-colW/2;
  const topY=Math.max(isMobile?24:40,H*(isMobile?0.04:0.08));

  ctx.save();
  ctx.translate(0,-helpScroll);
  let y=topY;

  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.font=`500 ${titlePx}px 'DM Mono',monospace`; ctx.fillStyle=C.text;
  ctx.fillText('how to play',colX,y); y+=titleGap;
  ctx.font=`300 ${bodyPx}px 'DM Mono',monospace`; ctx.fillStyle=C.muted;
  ctx.fillText(isMobile?'chess · roguelite · wager — tap to close':'chess · roguelite · wager — click anywhere or press ? / Esc to close',colX,y); y+=isMobile?20:24;

  const renderCol=(sections,x,cy)=>{
    sections.forEach(sec=>{
      ctx.font=`500 ${headerPx}px 'DM Mono',monospace`; ctx.fillStyle='#c8a020';
      ctx.fillText(sec.h,x,cy); cy+=headerGap;
      ctx.font=`300 ${bodyPx}px 'DM Mono',monospace`; ctx.fillStyle=C.text;
      sec.wrapped.forEach(l=>{ctx.fillText(l,x,cy); cy+=lineGap;});
      cy+=sectGap;
    });
    return cy;
  };

  let bottomY;
  if(W<720){
    bottomY=renderCol(wrappedHelp(colW-8,isMobile,bodyPx),colX,y);
  } else {
    const colInnerW=colW/2-12;
    const wrapped=wrappedHelp(colInnerW,isMobile,bodyPx);
    const half=Math.ceil(wrapped.length/2);
    const lY=renderCol(wrapped.slice(0,half),colX,y);
    const rY=renderCol(wrapped.slice(half),colX+colW/2+12,y);
    bottomY=Math.max(lY,rY);
  }
  ctx.restore();

  helpMaxScroll=Math.max(0,bottomY-H+30);
  helpScroll=Math.max(0,Math.min(helpScroll,helpMaxScroll));

  if(helpMaxScroll>0){
    const thumbH=Math.max(40,(H/(bottomY+30))*H);
    const thumbY=(helpScroll/helpMaxScroll)*(H-thumbH);
    ctx.fillStyle=C.line; ctx.fillRect(W-5,thumbY,3,thumbH);
  }
}

// ─── main draw ────────────────────────────────────────────────────────────
let mouseX=0,mouseY=0;
let helpTouchStartY=null,helpTouchLastY=null,helpTouchMoved=false;
canvas.addEventListener('mousemove',e=>{mouseX=e.clientX; mouseY=e.clientY;});
canvas.addEventListener('wheel',e=>{
  if(showHelp){
    helpScroll=Math.max(0,Math.min(helpMaxScroll,helpScroll+e.deltaY));
    e.preventDefault();
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  if(!e.touches.length) return;
  const t=e.touches[0]; mouseX=t.clientX; mouseY=t.clientY;
  if(showHelp&&helpTouchStartY!==null){
    helpScroll=Math.max(0,Math.min(helpMaxScroll,helpScroll+(helpTouchLastY-t.clientY)));
    helpTouchLastY=t.clientY;
    if(Math.abs(t.clientY-helpTouchStartY)>8) helpTouchMoved=true;
  }
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchstart',e=>{
  if(!e.touches.length) return;
  const t=e.touches[0]; mouseX=t.clientX; mouseY=t.clientY;
  if(showHelp){
    helpTouchStartY=t.clientY; helpTouchLastY=t.clientY; helpTouchMoved=false;
    e.preventDefault(); return;
  }
  canvas.dispatchEvent(new MouseEvent('click',{clientX:t.clientX,clientY:t.clientY}));
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(showHelp&&helpTouchStartY!==null){
    if(!helpTouchMoved) showHelp=false;
    helpTouchStartY=null;
    e.preventDefault();
  }
},{passive:false});

function draw(){
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  if(phase==='battle') drawBoard();
  else if(phase==='round_end') drawRoundEnd();
  else if(phase==='gambit_pick') drawGambitPick();
  else if(phase==='shop') drawShop();
  else if(phase==='wager') drawWager();
  else drawOverlay();
  if(showHelp) drawHelpOverlay();
}

// ─── loop ────────────────────────────────────────────────────────────────
function loop(t){
  const dt=Math.min((t-lastT)/1000,0.05); lastT=t;
  if(phase==='battle'){
    battleTime+=dt;
    if(aiThinking){aiTimer-=dt; if(aiTimer<=0) doAIMove();}
    if(eventFlash>0) eventFlash-=dt;
    if(modFlash>0) modFlash-=dt;
  } else if(phase==='round_end'){
    roundEnd.t+=dt;
  }
  draw();
  requestAnimationFrame(loop);
}

// ─── input ────────────────────────────────────────────────────────────────
canvas.addEventListener('click',e=>{
  const mx=e.clientX,my=e.clientY;

  if(showHelp){showHelp=false; return;}

  if(phase==='title'){
    for(const ha of hitAreas) if(mx>=ha.x&&mx<ha.x+ha.w&&my>=ha.y&&my<ha.y+ha.h){ha.action(); return;}
    return;
  }
  if(phase==='gameover'||phase==='victory'){
    for(const ha of hitAreas) if(mx>=ha.x&&mx<ha.x+ha.w&&my>=ha.y&&my<ha.y+ha.h){ha.action(); return;}
    return;
  }

  if(phase==='wager'||phase==='gambit_pick'||phase==='shop'||phase==='round_end'){
    for(const ha of hitAreas) if(mx>=ha.x&&mx<ha.x+ha.w&&my>=ha.y&&my<ha.y+ha.h){ha.action(); return;}
    return;
  }

  if(phase==='battle'){
    // HUD hit areas (hex toggle, skip-bonus) take priority
    for(const ha of hitAreas) if(mx>=ha.x&&mx<ha.x+ha.w&&my>=ha.y&&my<ha.y+ha.h){ha.action(); return;}
    if(turnColor!=='white'||aiThinking) return;
    const cell=screenToCell(mx,my);

    // Hex mode: click enemy to remove
    if(hexMode){
      if(cell){
        const [r,c]=cell;
        const p=board[r][c];
        if(p&&p.color==='black'&&p.type!=='king'){
          board[r][c]=null; hexUsed=true; hexMode=false;
          showEvent('Hex!','An enemy piece is cursed away.');
        }
      } else {hexMode=false;}
      return;
    }

    if(bloodlustBonus){
      // Click-outside no longer ends the bonus — only Escape or the "skip" HUD button.
      if(!cell){selected=null; validMoves=[]; return;}
      const [r,c]=cell;
      if(selected){
        const [sr,sc]=selected;
        if(validMoves.some(([vr,vc])=>vr===r&&vc===c)){
          doPlayerMove(sr,sc,r,c,true); return;
        }
      }
      if(board[r][c]?.color==='white'){
        selected=[r,c]; validMoves=legalMoves(board,r,c);
      } else {
        selected=null; validMoves=[];
      }
      return;
    }

    if(!cell){selected=null; validMoves=[]; return;}
    const [r,c]=cell;
    if(selected){
      const [sr,sc]=selected;
      if(r===sr&&c===sc){selected=null; validMoves=[]; return;}
      if(validMoves.some(([vr,vc])=>vr===r&&vc===c)){doPlayerMove(sr,sc,r,c); return;}
    }
    if(board[r][c]?.color==='white'){selected=[r,c]; validMoves=legalMoves(board,r,c);}
    else{selected=null; validMoves=[];}
  }
});

document.addEventListener('keydown',e=>{
  if(submitOverlay&&submitOverlay.style.display==='flex') return;
  if(e.key==='?'||e.key==='/'){toggleHelp(); return;}
  if(showHelp){if(e.key==='Escape'||e.key==='Enter'||e.key===' ') showHelp=false; return;}

  if(phase==='title'){
    const diffs=Object.keys(DIFF_PROFILES);
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
      const idx=diffs.indexOf(difficulty);
      const next=diffs[(idx+(e.key==='ArrowRight'?1:diffs.length-1))%diffs.length];
      difficulty=next; localStorage.setItem('gambit_diff',next); return;
    }
    if(e.key==='Enter'||e.key===' '){startRun(); return;}
    return;
  }
  if(phase==='gameover'||phase==='victory'){
    if(e.key==='Enter'||e.key===' ') startRun();
    return;
  }

  if(phase==='round_end'){
    if(roundEnd.t<4.4) roundEnd.t=4.5;
    else advanceFromRoundEnd();
    return;
  }

  if(phase==='gambit_pick'){
    const n=parseInt(e.key);
    if(n>=1&&n<=gambitOptions.length) pickGambit(n-1);
    return;
  }

  if(phase==='battle'){
    if(e.key==='Escape'){
      if(hexMode){hexMode=false; return;}
      if(bloodlustBonus){
        bloodlustBonus=false; selected=null; validMoves=[];
        turnColor='black'; aiThinking=true; aiTimer=0.55; return;
      }
      selected=null; validMoves=[];
    }
    if((e.key==='h'||e.key==='H')&&ownedGambits.includes('hex')&&!hexUsed&&!aiThinking&&turnColor==='white'){
      hexMode=!hexMode;
      if(hexMode) selected=null,validMoves=[];
    }
  }
});

// ─── submit overlay ───────────────────────────────────────────────────────
let submitSnap=null;
const submitOverlay=document.getElementById('submit-overlay');
const nameInput=document.getElementById('name-input');
const subScore=document.getElementById('sub-score');
const subMeta=document.getElementById('sub-meta');
const subError=document.getElementById('sub-error');
const subStatus=document.getElementById('sub-status');
const subSubmit=document.getElementById('sub-submit');

subSubmit.addEventListener('click',()=>doSubmitScore());
document.getElementById('sub-cancel').addEventListener('click',()=>doSubmitScore('anon'));
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); doSubmitScore();}});

function openSubmitOverlay(won){
  submitSnap={score:runScore,difficulty,mode:gameMode,depth:encounter+1,gold,gambits:[...ownedGambits],won};
  subScore.textContent=submitSnap.score+' pts';
  subMeta.textContent=`${submitSnap.difficulty}  ·  ${submitSnap.mode}  ·  depth ${submitSnap.depth}  ·  ◆ ${submitSnap.gold}`;
  subError.textContent='';
  subStatus.textContent='';
  nameInput.value=localStorage.getItem('gambit_last_name')||'';
  submitOverlay.style.display='flex';
  setTimeout(()=>nameInput.focus(),50);
}

async function doSubmitScore(overrideName){
  const name=overrideName||nameInput.value.trim();
  if(!name){subError.textContent='enter a name'; return;}
  subError.textContent='';
  subStatus.textContent='submitting…';
  subSubmit.disabled=true;
  try{
    const s=submitSnap;
    const r=await fetch('/api/gambit/score',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({name,score:s.score,difficulty:s.difficulty,mode:s.mode,
        depth:s.depth,gold:s.gold,gambits:s.gambits,won:s.won?1:0})
    });
    const data=await r.json();
    if(!r.ok){subError.textContent=data.error||'submit failed'; subStatus.textContent=''; subSubmit.disabled=false; return;}
    if(!overrideName) localStorage.setItem('gambit_last_name',name);
    submitOverlay.style.display='none';
    startRun();
  }catch(e){
    console.error('submit failed:',e);
    subError.textContent='network error';
    subStatus.textContent='';
    subSubmit.disabled=false;
  }
}

// ─── start ────────────────────────────────────────────────────────────────
requestAnimationFrame(loop);
</script>
