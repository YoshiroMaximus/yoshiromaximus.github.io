<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="run">
  <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <title>run</title>
  <link rel="icon" type="image/x-icon" href="/favistuff/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favistuff/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favistuff/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/favistuff/apple-touch-icon.png">
  <link rel="manifest" href="/favistuff/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #f5f4f0; --text: #1a1a1a; --muted: #888; --line: #d8d6d0; }
    body.dark { --bg: #111110; --text: #e8e6e2; --muted: #666; --line: #2a2926; }
    body { background: var(--bg); overflow: hidden; height: 100vh; overscroll-behavior: none; }
    canvas { display: block; cursor: none; touch-action: none; }
    body.show-cursor canvas { cursor: default; }
    #back {
      position: fixed; top: max(1.5rem, env(safe-area-inset-top)); left: max(1.5rem, env(safe-area-inset-left));
      font-family: 'DM Mono', monospace; font-size: 0.7rem;
      color: var(--line); text-decoration: none;
      letter-spacing: 0.06em; z-index: 100; padding: 8px; margin: -8px;
    }
    #back:hover { color: var(--muted); }
    #theme {
      position: fixed; top: max(1.5rem, env(safe-area-inset-top)); right: max(1.5rem, env(safe-area-inset-right));
      background: none; border: none;
      font-family: 'DM Mono', monospace; font-size: 1.1rem; line-height: 1;
      color: var(--muted); cursor: pointer; padding: 8px; z-index: 100;
    }
    #audio-ctrl { position: fixed; top: max(1.5rem, env(safe-area-inset-top)); right: calc(max(1.5rem, env(safe-area-inset-right)) + 2rem); z-index: 100; }
    @media (hover:none) { #music-hint { display: none; } }
    #mute {
      background: none; border: none;
      font-family: 'DM Mono', monospace; font-size: 1.1rem; line-height: 1;
      color: var(--muted); cursor: pointer; padding: 8px;
    }
    #mute:hover { color: var(--text); }
    #vol-panel {
      position: absolute; top: 100%; right: 0;
      padding: 10px 10px 8px; background: var(--bg);
      border: 1px solid var(--line); border-radius: 4px;
      display: flex; flex-direction: column; gap: 6px;
      opacity: 0; pointer-events: none; transition: opacity 0.12s;
      min-width: 170px;
    }
    #vol-row { display: flex; align-items: center; gap: 8px; }
    #track-select {
      appearance: none; -webkit-appearance: none;
      background: var(--bg); border: 1px solid var(--line); color: var(--text);
      font-family: 'DM Mono', monospace; font-size: 0.7rem;
      padding: 3px 6px; border-radius: 3px; cursor: pointer; width: 100%;
    }
    #track-select:hover { border-color: var(--text); }
    #music-hint {
      position: absolute; top: 100%; right: 0; margin-top: 4px;
      padding: 5px 9px; background: var(--bg);
      border: 1px solid var(--line); border-radius: 3px;
      font-family: 'DM Mono', monospace; font-size: 0.65rem;
      color: var(--muted); white-space: nowrap; pointer-events: none;
      animation: hintPulse 1.8s ease-in-out infinite;
    }
    #audio-ctrl:hover #music-hint { display: none; }
    @keyframes hintPulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    #audio-ctrl:hover #vol-panel, #audio-ctrl:focus-within #vol-panel { opacity: 1; pointer-events: auto; }
    #vol { appearance: none; -webkit-appearance: none; width: 90px; height: 3px; background: var(--line); outline: none; border-radius: 2px; }
    #vol::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: var(--text); cursor: pointer; border: none; }
    #vol::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--text); cursor: pointer; border: none; }
    #vol-label { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted); min-width: 24px; text-align: right; }
  </style>
</head>
<body>
  <a href="../break.html" id="back">← break</a>
  <button id="theme" onclick="toggleTheme()">+</button>
  <div id="audio-ctrl">
    <button id="mute" onclick="toggleMute()" title="click: mute · hover: volume">♪</button>
    <div id="music-hint">click ♪ for music</div>
    <div id="vol-panel">
      <select id="track-select"></select>
      <div id="vol-row">
        <input id="vol" type="range" min="0" max="100" value="30">
        <span id="vol-label">30</span>
      </div>
    </div>
  </div>
  <audio id="bgm" src="https://r2.sn4k.org/audio/zeldatwilightprincess.mp3" loop preload="auto"></audio>
  <canvas id="c"></canvas>
  <div id="submit-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;align-items:center;justify-content:center;">
    <div id="submit-box" style="background:var(--bg);border:1px solid var(--text);padding:28px 32px;width:min(320px,90vw);font-family:'DM Mono',monospace;text-align:center;">
      <div style="font-size:13px;color:var(--text);margin-bottom:6px;">submit score</div>
      <div id="sub-score" style="font-size:18px;color:#c8a020;margin-bottom:4px;font-weight:500;"></div>
      <div id="sub-meta" style="font-size:10px;color:var(--muted);margin-bottom:20px;"></div>
      <input id="name-input" type="text" maxlength="30" placeholder="your name"
        style="width:100%;box-sizing:border-box;background:transparent;border:none;border-bottom:1px solid var(--text);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;padding:6px 2px;text-align:center;outline:none;margin-bottom:16px;">
      <div id="sub-error" style="font-size:9px;color:#b04040;min-height:14px;margin-bottom:10px;"></div>
      <div style="display:flex;gap:10px;justify-content:center;">
        <button id="sub-submit" style="flex:1;padding:9px;background:transparent;border:1px solid var(--text);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;">submit</button>
        <button id="sub-cancel" style="flex:1;padding:9px;background:transparent;border:1px solid var(--line);color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;">post anon</button>
      </div>
      <div id="sub-status" style="font-size:10px;color:var(--muted);min-height:18px;margin-top:10px;"></div>
    </div>
  </div>
  <script>
  const TRACKS = [
    { id: 'twilight',  name: 'Zelda · Twilight Princess', src: 'https://r2.sn4k.org/audio/zeldatwilightprincess.mp3' },
    { id: 'pikmin',    name: "Pikmin · Today's Results",  src: 'https://r2.sn4k.org/audio/pikmintodaysresults.mp3' },
    { id: 'balatro',   name: 'Balatro · Main',             src: 'https://r2.sn4k.org/audio/balatro-main.mp3' },
    { id: 'balayoshi', name: 'Bala-Yoshi',                 src: 'https://r2.sn4k.org/audio/balayoshi.mp3' },
    { id: 'pinkpony',  name: 'Pink Pony Club',             src: 'https://r2.sn4k.org/audio/pinkponyclub.mp3' },
    { id: 'unarmed',   name: 'Unarmed and Harmless',       src: 'https://r2.sn4k.org/audio/unarmedandharmless.mp3' },
    { id: 'walter',    name: 'Walter',                      src: 'https://r2.sn4k.org/audio/walter.mp3' },
  ];
  const bgm = document.getElementById('bgm');
  const volSlider = document.getElementById('vol');
  const volLabel  = document.getElementById('vol-label');
  const trackSelect = document.getElementById('track-select');
  TRACKS.forEach(t => { const o = document.createElement('option'); o.value = t.id; o.textContent = t.name; trackSelect.appendChild(o); });
  trackSelect.addEventListener('change', e => { setTrack(e.target.value); dismissHint(); });
  let muted = localStorage.getItem('run_muted') !== '0';
  let hintSeen = localStorage.getItem('run_music_hint') === '1';
  let volume = Math.max(0, Math.min(1, parseFloat(localStorage.getItem('run_vol'))));
  if (!isFinite(volume)) volume = 0.3;
  let currentTrack = localStorage.getItem('run_track') || TRACKS[0].id;

  function applyVolume() { bgm.volume = volume; volSlider.value = Math.round(volume * 100); volLabel.textContent = Math.round(volume * 100); }
  function dismissHint() {
    if (hintSeen) return;
    hintSeen = true; localStorage.setItem('run_music_hint', '1');
    const h = document.getElementById('music-hint'); if (h) h.remove();
  }
  if (hintSeen) dismissHint();
  function updateMuteBtn() { document.getElementById('mute').textContent = muted ? '♪̸' : '♪'; }
  function setTrack(id) {
    const t = TRACKS.find(x => x.id === id) || TRACKS[0];
    currentTrack = t.id; localStorage.setItem('run_track', t.id);
    trackSelect.value = t.id;
    if (bgm.src.endsWith(t.src.replace(/^\//, ''))) return;
    const wasPlaying = !bgm.paused;
    bgm.src = t.src;
    if (wasPlaying && !muted) bgm.play().catch(() => {});
  }
  function toggleMute() {
    muted = !muted;
    localStorage.setItem('run_muted', muted ? '1' : '0');
    updateMuteBtn();
    dismissHint();
    if (muted) bgm.pause(); else bgm.play().catch(() => {});
  }
  function startBgm() { if (!muted) bgm.play().catch(() => {}); }
  volSlider.addEventListener('input', e => {
    volume = (+e.target.value) / 100;
    localStorage.setItem('run_vol', volume);
    applyVolume();
    dismissHint();
    if (muted && volume > 0) { muted = false; localStorage.setItem('run_muted', '0'); updateMuteBtn(); bgm.play().catch(() => {}); }
  });
  document.addEventListener('pointerdown', startBgm, { once: true });
  document.addEventListener('keydown', startBgm, { once: true });
  setTrack(currentTrack);
  applyVolume();
  updateMuteBtn();

  function getTheme() { return localStorage.getItem('theme') || 'light'; }
  function applyTheme(t) {
    document.body.classList.toggle('dark', t === 'dark');
    const btn = document.getElementById('theme');
    if (btn) btn.textContent = t === 'dark' ? '−' : '+';
  }
  function toggleTheme() {
    const t = getTheme() === 'dark' ? 'light' : 'dark';
    localStorage.setItem('theme', t);
    applyTheme(t);
    cacheColors();
  }
  applyTheme(getTheme());

  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  let W, H, GY, isMobile = false;

  let C = {};
  function cacheColors() {
    const s = getComputedStyle(document.body);
    C.bg    = s.getPropertyValue('--bg').trim();
    C.text  = s.getPropertyValue('--text').trim();
    C.muted = s.getPropertyValue('--muted').trim();
    C.line  = s.getPropertyValue('--line').trim();
  }

  function hit(a, x, y) { return x >= a.x && x <= a.x + a.w && y >= a.y && y <= a.y + a.h; }
  function cycleDiff(dir) {
    const i = DIFF_NAMES.indexOf(difficulty);
    difficulty = DIFF_NAMES[(i + dir + DIFF_NAMES.length) % DIFF_NAMES.length];
    saveAll();
  }

  // ── Persistent data ────────────────────────────────────────────────────
  let coins      = +localStorage.getItem('run_coins') || 0;
  let difficulty = localStorage.getItem('run_diff') || 'normal';
  let upgrades   = JSON.parse(localStorage.getItem('run_upgrades') || '{}');
  let mode       = localStorage.getItem('run_mode') || 'normal';
  let hiDaily    = JSON.parse(localStorage.getItem('run_hi_daily') || '{}');
  let rngState   = 0;

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function setRunSeed(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    rngState = h || 1;
  }
  function rand() {
    if (mode !== 'daily') return Math.random();
    rngState = (Math.imul(rngState, 1664525) + 1013904223) | 0;
    return ((rngState >>> 0) / 4294967296);
  }
  function todayDailyHi() { return hiDaily[todayStr()] || 0; }

  const DIFF_NAMES = ['easy', 'normal', 'hard'];
  const DIFF = {
    easy:   { vramp: 11,  clusterBonus: -1, gapMin: 200, gapA: 520, gapB: 320, v0: 380, coinMult: 1.0  },
    normal: { vramp: 20,  clusterBonus:  0, gapMin: 150, gapA: 400, gapB: 240, v0: 450, coinMult: 1.4  },
    hard:   { vramp: 26,  clusterBonus:  1, gapMin: 130, gapA: 320, gapB: 180, v0: 510, coinMult: 1.9  },
  };

  const UPGRADE_DEFS = [
    { id: 'triple_jump', name: 'triple jump',  desc: '3rd jump per run',       cost: 500, max: 1 },
    { id: 'boost_dur',   name: 'boost  +2s',   desc: 'longer boost window',    cost: 250, max: 5 },
    { id: 'boost_cd',    name: 'cd  −2s',      desc: 'faster boost cooldown',  cost: 300, max: 4 },
    { id: 'shield',      name: 'shield',        desc: '1 free hit per run',     cost: 800, max: 3 },
    { id: 'score_mult',  name: 'score  ×1.25', desc: 'score multiplier',       cost: 600, max: 4 },
    { id: 'magnet',      name: 'magnet',        desc: 'coins drift toward you', cost: 500, max: 3 },
    { id: 'coin_value',  name: 'coin  +1',      desc: 'pickups worth more',     cost: 400, max: 3 },
    { id: 'slim',        name: 'slim',          desc: 'smaller hitbox',         cost: 700, max: 2 },
    { id: 'head_start',  name: 'head start',    desc: 'begin run with boost',   cost: 250, max: 3 },
  ];

  function upLvl(id) { return upgrades[id] || 0; }
  function saveAll() {
    localStorage.setItem('run_coins', coins);
    localStorage.setItem('run_diff', difficulty);
    localStorage.setItem('run_upgrades', JSON.stringify(upgrades));
  }

  const SKINS = [
    { id: 'default', name: 'default', cost: 0,    color: null },
    { id: 'crimson', name: 'crimson', cost: 300,  color: '#c84040' },
    { id: 'gold',    name: 'gold',    cost: 500,  color: '#c8a020' },
    { id: 'cyan',    name: 'cyan',    cost: 300,  color: '#40a8a8' },
    { id: 'forest',  name: 'forest',  cost: 300,  color: '#5a9a60' },
    { id: 'violet',  name: 'violet',  cost: 500,  color: '#8a40a8' },
    { id: 'void',    name: 'void',    cost: 800,  color: 'inverted' },
    { id: 'prism',   name: 'prism',   cost: 1500, color: 'rainbow' },
  ];

  let skins = JSON.parse(localStorage.getItem('run_skins') || '{"owned":["default"],"equipped":"default"}');
  function saveSkins() { localStorage.setItem('run_skins', JSON.stringify(skins)); }
  function skinDef(id) { return SKINS.find(s => s.id === id) || SKINS[0]; }
  function currentSkin() { return skinDef(skins.equipped); }
  function buySkin(id) {
    const s = skinDef(id);
    if (skins.owned.includes(id)) return;
    if (coins < s.cost) return;
    coins -= s.cost;
    skins.owned.push(id);
    saveAll(); saveSkins();
  }
  function equipSkin(id) {
    if (!skins.owned.includes(id)) return;
    skins.equipped = id;
    saveSkins();
  }

  function skinFill(skin, text) {
    if (!skin.color) return text;
    if (skin.color === 'inverted') return null;
    if (skin.color === 'rainbow') return 'hsl(' + ((nowMs / 8) % 360) + ',60%,55%)';
    return skin.color;
  }
  function drawPlayerBody(skin, text, bg, muted, shieldOn, size) {
    const ps = size || PS;
    const fill = skinFill(skin, text);
    if (skin.color === 'inverted') {
      ctx.fillStyle = bg;
      ctx.fillRect(-ps/2, -ps/2, ps, ps);
      ctx.strokeStyle = text; ctx.lineWidth = 1;
      ctx.strokeRect(-ps/2 + 0.5, -ps/2 + 0.5, ps - 1, ps - 1);
    } else {
      ctx.fillStyle = fill;
      ctx.fillRect(-ps/2, -ps/2, ps, ps);
    }
    if (shieldOn) {
      ctx.fillStyle = muted;
      ctx.globalAlpha = 0.35;
      ctx.fillRect(-ps/2, -ps/2, ps, ps);
      ctx.globalAlpha = 1;
    }
    const inset = ps * 0.26;
    ctx.fillStyle = bg;
    ctx.fillRect(-ps/2 + inset, -ps/2 + inset, ps - inset*2, ps - inset*2);
    if (skin.color === 'inverted') {
      ctx.fillStyle = text;
    } else if (skin.color === 'rainbow') {
      ctx.fillStyle = bg;
    } else {
      ctx.fillStyle = fill || text;
    }
    const dot = Math.max(2, Math.round(ps * 0.13));
    ctx.fillRect(-dot/2, -dot/2, dot, dot);
  }

  // ── Background layer data ──────────────────────────────────────────────
  const FAR_W = 2200, MID_W = 1100;
  let farShapes = [], midShapes = [];
  let farOff = 0, midOff = 0;

  function generateBg() {
    farShapes = [];
    for (let x = 0; x < FAR_W; x += 70 + Math.random() * 160) {
      const h = 40 + Math.random() * GY * 0.52;
      farShapes.push({ x, w: 8 + Math.random() * 24, h, y: GY - h });
    }
    midShapes = [];
    for (let x = 0; x < MID_W; x += 22 + Math.random() * 70) {
      midShapes.push({ x, y: 20 + Math.random() * (GY - 90), h: 8 + Math.random() * 32 });
    }
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    GY = Math.round(H * 0.78);
    isMobile = W < 640;
    cacheColors();
    generateBg();
  }
  let resizeRaf = 0;
  window.addEventListener('resize', () => {
    if (resizeRaf) return;
    resizeRaf = requestAnimationFrame(() => { resizeRaf = 0; resize(); });
  });

  // ── Constants ─────────────────────────────────────────────────────────
  const PS           = 24;
  const GRAV         = 2500;
  const J1           = -780;
  const J2           = -610;
  const VMAX         = 1400;
  const TICK_GAP     = 80;
  const TRAIL_MAX    = 7;
  const STREAK_SPAWN = 0.45;
  const ROT_SPEED    = 7.5;
  const BOOST_DUR_BASE = 5;
  const BOOST_CD_BASE  = 10;

  // [w, h, type]  type: 'block' | 'spike' | 'spike2' | 'spike3'
  const OBS = [
    [18, 32, 'block'], [20, 48, 'block'], [22, 62, 'block'],
    [18, 28, 'block'], [20, 54, 'block'], [22, 72, 'block'],
    [24, 42, 'block'], [18, 80, 'block'], [20, 96, 'block'],
    [22, 22, 'spike'], [22, 22, 'spike'], [26, 26, 'spike'],
    [44, 22, 'spike2'], [44, 22, 'spike2'],
    [66, 22, 'spike3'],
  ];

  function effBOOST_DUR()  { return BOOST_DUR_BASE + upLvl('boost_dur') * 2; }
  function effBOOST_CD()   { return Math.max(2, BOOST_CD_BASE - upLvl('boost_cd') * 2); }
  function effMaxJumps()   { return upLvl('triple_jump') ? 3 : 2; }
  function effScoreMult()  { return Math.pow(1.25, upLvl('score_mult')); }
  function effMagnetR()    { return upLvl('magnet') * 50; }
  function effCoinBonus()  { return upLvl('coin_value'); }
  function effSlimInset()  { return upLvl('slim') * 2; }
  function effHeadStart()  { return upLvl('head_start') * 1.5; }

  // ── State ─────────────────────────────────────────────────────────────
  let state, score, spd, tickOff;
  let spawnTimer, spawnMode, clusterLeft;
  let pickupTimer;
  let player, obstacles, particles, streaks, trail, pickups;
  let shakeX, shakeY, lastT;
  let boostActive, boostTimer, boostCooldown;
  let shieldsLeft;
  let hiScore    = +localStorage.getItem('run_hi') || 0;
  let coinsEarned = 0;
  let coinsCollected = 0;
  let pickupPulse = 0;
  let shopSel    = 0;
  let mouseX = 0, mouseY = 0;
  let hitAreas   = [];

  function init() {
    state = 'idle'; score = 0; coinsEarned = 0; coinsCollected = 0;
    if (mode === 'daily') { difficulty = 'normal'; setRunSeed(todayStr()); }
    const diff = DIFF[difficulty];
    spd = diff.v0; tickOff = 0;
    spawnTimer = 1.0; spawnMode = 'gap'; clusterLeft = 0;
    pickupTimer = 1.4;
    player = { x: W * 0.14, y: GY - PS, vy: 0, jumps: effMaxJumps(), angle: 0 };
    obstacles = []; particles = []; streaks = []; trail = []; pickups = [];
    shakeX = shakeY = 0;
    boostActive = false; boostTimer = 0; boostCooldown = 0;
    shieldsLeft = upLvl('shield');
  }

  // ── Input ─────────────────────────────────────────────────────────────
  function beginRun() {
    state = 'run';
    const hs = effHeadStart();
    if (hs > 0) { boostActive = true; boostTimer = hs; boostCooldown = 0; }
    doJump();
  }
  function onAction() {
    if (state === 'idle') { beginRun(); return; }
    if (state === 'dead') { init(); return; }
    if (state === 'shop') return;
    if (state === 'skins') return;
    if (state === 'paused') { state = 'run'; return; }
    doJump();
  }

  function togglePause() {
    if (state === 'run') state = 'paused';
    else if (state === 'paused') state = 'run';
  }

  function doJump() {
    if (player.jumps <= 0) return;
    player.vy = player.jumps === effMaxJumps() ? J1 : J2;
    player.jumps--;
    spawnDust(player.x + PS / 2, player.y + PS, 6);
  }

  function doBoost() {
    if (state !== 'run') return;
    if (boostActive || boostCooldown > 0) return;
    boostActive = true;
    boostTimer = effBOOST_DUR();
  }

  function openShop() {
    state = 'shop';
    shopSel = 0;
  }

  function closeShop() {
    init();
  }

  function openSkins() {
    state = 'skins';
  }

  function closeSkins() {
    init();
  }

  function buyUpgrade(idx) {
    const def = UPGRADE_DEFS[idx];
    const lvl = upLvl(def.id);
    if (lvl >= def.max) return;
    if (coins < def.cost) return;
    coins -= def.cost;
    upgrades[def.id] = lvl + 1;
    saveAll();
  }

  canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

  window.addEventListener('keydown', e => {
    if (submitOverlay && submitOverlay.style.display === 'flex') return;
    if (state === 'shop') {
      if (e.code === 'ArrowUp')                              { e.preventDefault(); shopSel = (shopSel - 1 + UPGRADE_DEFS.length) % UPGRADE_DEFS.length; }
      if (e.code === 'ArrowDown')                            { e.preventDefault(); shopSel = (shopSel + 1) % UPGRADE_DEFS.length; }
      if (e.code === 'Enter')                                { e.preventDefault(); buyUpgrade(shopSel); }
      if (e.code === 'Escape' || e.code === 'Backspace')    { e.preventDefault(); closeShop(); }
      return;
    }
    if (state === 'skins') {
      if (e.code === 'Escape' || e.code === 'Backspace') { e.preventDefault(); closeSkins(); }
      return;
    }
    if (e.code === 'ArrowLeft' && state === 'idle' && mode !== 'daily')  { e.preventDefault(); cycleDiff(-1); return; }
    if (e.code === 'ArrowRight' && state === 'idle' && mode !== 'daily') { e.preventDefault(); cycleDiff( 1); return; }
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); onAction(); }
    if (e.code === 'KeyG') doBoost();
    if (e.code === 'KeyU' && state !== 'run' && state !== 'paused') openShop();
    if (e.code === 'KeyP') { e.preventDefault(); togglePause(); }
  });

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    const cx = e.clientX, cy = e.clientY;
    for (const a of hitAreas) { if (hit(a, cx, cy)) { a.action(); return; } }
    onAction();
  });

  // ── Particles ─────────────────────────────────────────────────────────
  function spawnDust(x, y, n) {
    for (let i = 0; i < n; i++)
      particles.push({ x, y, vx: (Math.random()-0.5)*110, vy: -Math.random()*90-20, life: 1, r: 1.5+Math.random()*2.5 });
  }
  function spawnBurst(x, y) {
    for (let i = 0; i < 28; i++) {
      const a = (i/28)*Math.PI*2, s = 110+Math.random()*320;
      particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, r: 1.5+Math.random()*4 });
    }
  }

  // ── Update ────────────────────────────────────────────────────────────
  function update(dt) {
    if (state === 'paused') return;
    const fsRunning = state === 'run';
    const bgSpd = boostActive ? spd * 2 : spd;
    farOff = (farOff + (fsRunning ? bgSpd*0.08 : 22) * dt) % FAR_W;
    midOff = (midOff + (fsRunning ? bgSpd*0.24 : 60) * dt) % MID_W;

    if (state !== 'run') return;

    // Boost timers
    if (boostActive) {
      boostTimer -= dt;
      if (boostTimer <= 0) { boostActive = false; boostCooldown = effBOOST_CD(); }
    } else if (boostCooldown > 0) {
      boostCooldown = Math.max(0, boostCooldown - dt);
    }

    const eff  = boostActive ? spd * 2 : spd;
    const diff = DIFF[difficulty];
    score += dt * eff * 0.05 * (boostActive ? 5 : 1) * effScoreMult();
    spd = Math.min(diff.v0 + (score / 1000) * diff.vramp, VMAX);
    tickOff = (tickOff + eff * dt) % TICK_GAP;

    // Player physics
    player.vy += GRAV * dt;
    player.y  += player.vy * dt;

    if (player.y >= GY - PS) {
      const hard = player.vy > 300;
      player.y = GY - PS;
      if (hard) spawnDust(player.x + PS/2, GY, 11);
      player.vy = 0; player.jumps = effMaxJumps();
      player.angle = Math.round(player.angle / (Math.PI / 2)) * (Math.PI / 2);
    } else {
      player.angle += ROT_SPEED * dt;
    }

    // Trail
    trail.unshift({ x: player.x, y: player.y, angle: player.angle });
    if (trail.length > TRAIL_MAX) trail.pop();

    // Speed streaks
    const sf = Math.max(0, (eff - 600) / (VMAX - 600));
    if (sf > 0 && Math.random() < sf * STREAK_SPAWN) {
      streaks.push({ x: W + 20, y: Math.random() * GY * 0.95, len: 50 + Math.random() * 140, life: 1 });
    }
    for (let i = streaks.length-1; i >= 0; i--) {
      streaks[i].x -= eff * dt * 1.4;
      streaks[i].life -= 4 * dt;
      if (streaks[i].life <= 0 || streaks[i].x + streaks[i].len < 0) streaks.splice(i, 1);
    }

    // Cluster spawn system
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      if (spawnMode === 'gap') {
        const maxSize = Math.max(1, 2 + Math.min(4, Math.floor(score / 600)) + diff.clusterBonus);
        clusterLeft = Math.max(1, 2 + Math.floor(rand() * (maxSize - 1)));
        spawnMode = 'cluster';
      }
      const [w, h, type] = OBS[Math.floor(rand() * OBS.length)];
      obstacles.push({ x: W + 10, y: GY - h, w, h, type: type || 'block' });
      clusterLeft--;
      if (clusterLeft <= 0) {
        spawnMode = 'gap';
        spawnTimer = (diff.gapA + rand() * diff.gapB) / spd;
      } else {
        const gap = Math.max(diff.gapMin, 230 - score / 120);
        spawnTimer = gap / spd;
      }
    }
    for (let i = obstacles.length-1; i >= 0; i--) {
      obstacles[i].x -= eff * dt;
      if (obstacles[i].x + obstacles[i].w < -10) obstacles.splice(i, 1);
    }

    pickupTimer -= dt;
    if (pickupTimer <= 0) {
      const py = GY - (40 + rand() * 110);
      pickups.push({ x: W + 14, y: py, r: 8, vy: 0, phase: Math.random() * Math.PI * 2 });
      pickupTimer = 1.6 + rand() * 1.4;
    }
    pickupPulse += dt * 4;
    const magnetR = effMagnetR();
    const coinBonus = effCoinBonus();
    for (let i = pickups.length - 1; i >= 0; i--) {
      const pk = pickups[i];
      pk.x -= eff * dt;
      if (pk.x + pk.r < -10) { pickups.splice(i, 1); continue; }
      if (magnetR > 0) {
        const pcx = player.x + PS/2, pcy = player.y + PS/2;
        const mdx = pcx - pk.x, mdy = pcy - pk.y;
        const dist = Math.sqrt(mdx*mdx + mdy*mdy);
        if (dist < magnetR && dist > 0) {
          const force = (1 - dist/magnetR) * 600 * dt;
          pk.x += (mdx/dist) * force;
          pk.y += (mdy/dist) * force;
        }
      }
      const closestX = Math.max(player.x, Math.min(pk.x, player.x + PS));
      const closestY = Math.max(player.y, Math.min(pk.y, player.y + PS));
      const dx = pk.x - closestX, dy = pk.y - closestY;
      if (dx*dx + dy*dy <= pk.r*pk.r + 4) {
        const earned = (boostActive ? 2 : 1) + coinBonus;
        coinsCollected += earned;
        spawnDust(pk.x, pk.y, 8);
        pickups.splice(i, 1);
      }
    }

    // Particles
    for (let i = particles.length-1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 500*dt; p.life -= 2.5*dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    shakeX *= 0.74; shakeY *= 0.74;

    // Collision (inset hitbox)
    const slimI = effSlimInset();
    const hx = player.x+4+slimI, hy = player.y+4+slimI, hw = PS-8-slimI*2, hh = PS-5-slimI*2;
    for (let i = 0; i < obstacles.length; i++) {
      const o = obstacles[i];
      if (hx < o.x+o.w && hx+hw > o.x && hy < o.y+o.h && hy+hh > o.y) {
        if (shieldsLeft > 0) {
          shieldsLeft--;
          obstacles.splice(i, 1);
          spawnDust(player.x + PS/2, player.y + PS/2, 16);
          shakeX = 6; shakeY = 5;
        } else {
          state = 'dead';
          if (mode === 'daily') {
            const today = todayStr();
            if ((hiDaily[today] || 0) < Math.floor(score)) {
              hiDaily[today] = Math.floor(score);
              localStorage.setItem('run_hi_daily', JSON.stringify(hiDaily));
            }
          } else {
            hiScore = Math.max(hiScore, Math.floor(score));
            localStorage.setItem('run_hi', hiScore);
          }
          const scoreCoins = Math.floor(Math.floor(score) / 40 * DIFF[difficulty].coinMult);
          coinsEarned = scoreCoins + coinsCollected;
          coins += coinsEarned;
          saveAll();
          spawnBurst(player.x + PS/2, player.y + PS/2);
          shakeX = 10; shakeY = 8;
        }
        break;
      }
    }
  }

  function tileRect(x0, lw, y, w, h) {
    const nx = ((x0 % lw) + lw) % lw;
    if (nx < W + w) ctx.fillRect(nx, y, w, h);
    const nx2 = nx - lw;
    if (nx2 + w > 0) ctx.fillRect(nx2, y, w, h);
  }

  // ── Shop draw ─────────────────────────────────────────────────────────
  function drawShop() {
    hitAreas = [];
    const { bg, text, muted, line } = C;
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const cx  = W / 2;
    const ty  = H * 0.16;
    const rowH = 44;
    const listY = ty + 60;
    const colW  = Math.min(340, W * 0.8);

    // Title
    ctx.textAlign = 'center';
    ctx.font = '400 26px "DM Mono", monospace';
    ctx.fillStyle = text;
    ctx.fillText('upgrades', cx, ty);

    // Coin count
    ctx.font = '300 11px "DM Mono", monospace';
    ctx.fillStyle = muted;
    ctx.fillText(coins + '  coins', cx, ty + 22);

    // Separator
    ctx.strokeStyle = line;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - colW/2, ty + 38);
    ctx.lineTo(cx + colW/2, ty + 38);
    ctx.stroke();

    for (let i = 0; i < UPGRADE_DEFS.length; i++) {
      const def    = UPGRADE_DEFS[i];
      const lvl    = upLvl(def.id);
      const maxed  = lvl >= def.max;
      const canBuy = !maxed && coins >= def.cost;
      const sel    = shopSel === i;
      const rowY   = listY + i * rowH;

      const rowArea = { x: cx - colW/2, y: rowY - 14, w: colW, h: rowH - 4 };
      const hovered = hit(rowArea, mouseX, mouseY);
      hitAreas.push({ ...rowArea, action: () => { shopSel = i; buyUpgrade(i); } });

      // Row highlight
      if (sel || hovered) {
        ctx.fillStyle = line;
        ctx.globalAlpha = 0.4;
        ctx.fillRect(cx - colW/2, rowY - 14, colW, rowH - 6);
        ctx.globalAlpha = 1;
      }

      // Arrow
      ctx.textAlign = 'left';
      ctx.font = '400 12px "DM Mono", monospace';
      ctx.fillStyle = (sel || hovered) ? text : 'transparent';
      ctx.fillText('→', cx - colW/2 + 4, rowY + 2);

      const nameColor = canBuy ? text : muted;
      ctx.fillStyle = nameColor;
      ctx.font = '400 13px "DM Mono", monospace';
      ctx.fillText(def.name, cx - colW/2 + 22, rowY + 2);

      ctx.textAlign = 'center';
      ctx.font = '300 11px "DM Mono", monospace';
      ctx.fillStyle = muted;
      let dots = '';
      for (let d = 0; d < def.max; d++) dots += d < lvl ? '●' : '○';
      ctx.fillText(dots, cx, rowY + 2);

      ctx.textAlign = 'right';
      ctx.font = '400 13px "DM Mono", monospace';
      ctx.fillStyle = nameColor;
      ctx.fillText(maxed ? 'maxed' : def.cost + ' c', cx + colW/2 - 4, rowY + 2);

      ctx.textAlign = 'left';
      ctx.font = '300 10px "DM Mono", monospace';
      ctx.fillStyle = muted;
      ctx.fillText(def.desc, cx - colW/2 + 22, rowY + 17);
    }

    // Footer (tappable to close)
    ctx.textAlign = 'center';
    ctx.font = '300 10px "DM Mono", monospace';
    ctx.fillStyle = muted;
    ctx.fillText(isMobile ? 'tap a row to buy  ·  tap here to close' : '↑↓ navigate  ·  enter buy  ·  esc / tap to close', cx, H - 26);
    hitAreas.push({ x: cx - 180, y: H - 44, w: 360, h: 32, action: closeShop });

    // Close button — top-right
    ctx.textAlign = 'right';
    ctx.font = '400 16px "DM Mono", monospace';
    ctx.fillStyle = text;
    ctx.fillText('✕', cx + colW/2, ty);
    hitAreas.push({ x: cx + colW/2 - 24, y: ty - 22, w: 32, h: 32, action: closeShop });
  }

  function drawSkins() {
    hitAreas = [];
    const { bg, text, muted, line } = C;
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2;
    const ty = H * 0.14;
    const colW = Math.min(440, W * 0.86);

    ctx.textAlign = 'center';
    ctx.font = '400 26px "DM Mono", monospace';
    ctx.fillStyle = text;
    ctx.fillText('skins', cx, ty);

    ctx.font = '300 11px "DM Mono", monospace';
    ctx.fillStyle = muted;
    ctx.fillText(coins + '  coins', cx, ty + 22);

    ctx.strokeStyle = line; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - colW/2, ty + 38);
    ctx.lineTo(cx + colW/2, ty + 38);
    ctx.stroke();

    const cols = isMobile ? 2 : 3;
    const cardW = Math.floor((colW - (cols - 1) * 12) / cols);
    const cardH = 104;
    const gridY = ty + 58;

    for (let i = 0; i < SKINS.length; i++) {
      const sk = SKINS[i];
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = cx - colW/2 + col * (cardW + 12);
      const y = gridY + row * (cardH + 12);

      const owned    = skins.owned.includes(sk.id);
      const equipped = skins.equipped === sk.id;
      const canBuy   = !owned && coins >= sk.cost;
      const area     = { x, y, w: cardW, h: cardH };
      const hov      = hit(area, mouseX, mouseY);

      ctx.fillStyle = equipped ? line : (hov ? line : 'transparent');
      if (equipped || hov) { ctx.globalAlpha = equipped ? 0.6 : 0.3; ctx.fillRect(x, y, cardW, cardH); ctx.globalAlpha = 1; }
      ctx.strokeStyle = equipped ? text : line;
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, cardW - 1, cardH - 1);

      ctx.save();
      ctx.translate(x + cardW/2, y + 36);
      drawPlayerBody(sk, text, bg, muted, false, 28);
      ctx.restore();

      ctx.font = '400 12px "DM Mono", monospace';
      ctx.fillStyle = (owned || canBuy) ? text : muted;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(sk.name, x + cardW/2, y + 70);

      ctx.font = '300 10px "DM Mono", monospace';
      let status, statusColor;
      if (equipped)      { status = 'equipped';     statusColor = '#c8a020'; }
      else if (owned)    { status = 'tap to equip'; statusColor = muted; }
      else if (canBuy)   { status = sk.cost + ' c'; statusColor = text; }
      else               { status = sk.cost + ' c'; statusColor = muted; }
      ctx.fillStyle = statusColor;
      ctx.fillText(status, x + cardW/2, y + 88);

      hitAreas.push({ ...area, action: () => {
        if (equipped) return;
        if (owned) equipSkin(sk.id);
        else buySkin(sk.id);
      }});
    }

    ctx.textAlign = 'center';
    ctx.font = '300 10px "DM Mono", monospace';
    ctx.fillStyle = muted;
    ctx.fillText(isMobile ? 'tap a skin to buy or equip  ·  tap here to close' : 'click a skin  ·  esc / tap to close', cx, H - 26);
    hitAreas.push({ x: cx - 200, y: H - 44, w: 400, h: 32, action: closeSkins });

    ctx.textAlign = 'right';
    ctx.font = '400 16px "DM Mono", monospace';
    ctx.fillStyle = text;
    ctx.fillText('✕', cx + colW/2, ty);
    hitAreas.push({ x: cx + colW/2 - 24, y: ty - 22, w: 32, h: 32, action: closeSkins });
  }

  let lastCursorState = null;
  let nowMs = 0;
  function draw() {
    if (state !== lastCursorState) {
      document.body.classList.toggle('show-cursor', state !== 'run');
      lastCursorState = state;
    }
    if (state === 'shop')  { drawShop();  return; }
    if (state === 'skins') { drawSkins(); return; }

    hitAreas = [];
    const { bg, text, muted, line } = C;
    let ox = 0, oy = 0;
    if (shakeX || shakeY) {
      ox = shakeX * (Math.random()*2-1);
      oy = shakeY * (Math.random()*2-1);
    }

    ctx.save();
    ctx.translate(ox, oy);

    ctx.fillStyle = bg;
    ctx.fillRect(-20, -20, W+40, H+40);
    if (boostActive) {
      ctx.fillStyle = text;
      ctx.globalAlpha = 0.03 + 0.025 * Math.sin(nowMs / 80);
      ctx.fillRect(-20, -20, W+40, H+40);
      ctx.globalAlpha = 1;
    }

    // Far layer
    ctx.fillStyle = line;
    ctx.globalAlpha = 0.38;
    for (const s of farShapes) tileRect(s.x - farOff, FAR_W, s.y, s.w, s.h);

    // Mid layer
    ctx.fillStyle = muted;
    ctx.globalAlpha = 0.11;
    for (const s of midShapes) tileRect(s.x - midOff, MID_W, s.y, 1.5, s.h);

    ctx.globalAlpha = 1;

    // Speed streaks
    ctx.strokeStyle = line;
    ctx.lineWidth = 0.8;
    for (const s of streaks) {
      ctx.globalAlpha = s.life * 0.22;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + s.len, s.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Player trail
    const speedF = Math.max(0, (spd - 520) / (VMAX - 520));
    if (speedF > 0 && trail.length > 1) {
      ctx.fillStyle = text;
      for (let i = 1; i < trail.length; i++) {
        ctx.globalAlpha = speedF * (1 - i / trail.length) * 0.22;
        ctx.save();
        ctx.translate(trail[i].x + PS/2, trail[i].y + PS/2);
        ctx.rotate(trail[i].angle);
        ctx.fillRect(-PS/2, -PS/2, PS, PS);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    const SPIKE_COUNT = { spike: 1, spike2: 2, spike3: 3 };
    ctx.fillStyle = text;
    for (const o of obstacles) {
      const n = SPIKE_COUNT[o.type];
      if (!n) { ctx.fillRect(o.x, o.y, o.w, o.h); continue; }
      const sw = o.w / n;
      for (let k = 0; k < n; k++) {
        ctx.beginPath();
        ctx.moveTo(o.x + k*sw,        o.y + o.h);
        ctx.lineTo(o.x + k*sw + sw/2, o.y);
        ctx.lineTo(o.x + k*sw + sw,   o.y + o.h);
        ctx.closePath();
        ctx.fill();
      }
    }

    for (const pk of pickups) {
      const pulse = 1 + Math.sin(pickupPulse + pk.phase) * 0.12;
      const r = pk.r * pulse;
      ctx.save();
      ctx.translate(pk.x, pk.y);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = '#c8a020';
      ctx.fillRect(-r, -r, r*2, r*2);
      ctx.fillStyle = bg;
      ctx.fillRect(-r*0.45, -r*0.45, r*0.9, r*0.9);
      ctx.restore();
    }

    if (state !== 'dead') {
      const pcx = player.x + PS / 2;
      const pcy = player.y + PS / 2;
      ctx.save();
      ctx.translate(pcx, pcy);
      ctx.rotate(player.angle);
      drawPlayerBody(currentSkin(), text, bg, muted, shieldsLeft > 0);
      ctx.restore();
    }

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life) * 0.72;
      ctx.fillStyle = muted;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Ground ticks
    ctx.fillStyle = line;
    for (let x = (TICK_GAP - tickOff % TICK_GAP) % TICK_GAP; x < W + TICK_GAP; x += TICK_GAP) {
      ctx.fillRect(Math.round(x) - 2, GY + 5, 4, 4);
    }

    // Ground line
    ctx.strokeStyle = line;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, GY); ctx.lineTo(W, GY);
    ctx.stroke();

    // ── HUD ───────────────────────────────────────────────────────────
    const hudVisible = state === 'run' || state === 'paused';
    const hudR = W - 22;
    const hudT = 70;
    if (hudVisible) {
      ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
      ctx.font = '400 13px "DM Mono", monospace';
      ctx.fillStyle = text;
      ctx.fillText((boostActive ? '×10  ' : '') + String(Math.floor(score)).padStart(6, '0'), hudR, hudT);
      ctx.font = '300 10px "DM Mono", monospace';
      ctx.fillStyle = muted;
      ctx.fillText('hi  ' + String(hiScore).padStart(6, '0'), hudR, hudT + 18);
      ctx.fillText('◆  ' + coins + (coinsCollected > 0 && state === 'run' ? '  +' + coinsCollected : ''), hudR, hudT + 34);
    }

    // Boost indicator — bottom-left button (tappable while running)
    if (state === 'run') {
      const bbW = 96, bbH = 32;
      const bbX = 22, bbY = H - 32 - bbH;
      const bbReady = !boostActive && boostCooldown <= 0;
      const bbHov = hit({ x: bbX, y: bbY, w: bbW, h: bbH }, mouseX, mouseY);
      ctx.fillStyle = boostActive ? text : (bbHov && bbReady ? line : 'transparent');
      if (boostActive) ctx.fillRect(bbX, bbY, bbW, bbH);
      else if (bbHov && bbReady) { ctx.globalAlpha = 0.4; ctx.fillRect(bbX, bbY, bbW, bbH); ctx.globalAlpha = 1; }
      ctx.strokeStyle = boostActive ? text : (bbReady ? text : line);
      ctx.lineWidth = 1;
      ctx.strokeRect(bbX + 0.5, bbY + 0.5, bbW - 1, bbH - 1);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '400 11px "DM Mono", monospace';
      ctx.fillStyle = boostActive ? bg : (bbReady ? text : muted);
      const boostLabel = boostActive
        ? '×10  ' + boostTimer.toFixed(1) + 's'
        : boostCooldown > 0
          ? boostCooldown.toFixed(1) + 's'
          : (isMobile ? 'boost' : '[G]  boost');
      ctx.fillText(boostLabel, bbX + bbW/2, bbY + bbH/2);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      hitAreas.push({ x: bbX - 6, y: bbY - 6, w: bbW + 12, h: bbH + 12, action: doBoost });
    }

    // Pause button — top-right, below coins
    if (state === 'run' || state === 'paused') {
      const pSize = 36;
      const pX = W - 22 - pSize;
      const pY = hudT + 50;
      ctx.strokeStyle = line; ctx.lineWidth = 1;
      ctx.strokeRect(pX + 0.5, pY + 0.5, pSize, pSize);
      ctx.fillStyle = text;
      if (state === 'paused') {
        ctx.beginPath();
        ctx.moveTo(pX + 13, pY + 10);
        ctx.lineTo(pX + 13, pY + 26);
        ctx.lineTo(pX + 27, pY + 18);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(pX + 11, pY + 10, 4, 16);
        ctx.fillRect(pX + 21, pY + 10, 4, 16);
      }
      hitAreas.push({ x: pX - 6, y: pY - 6, w: pSize + 12, h: pSize + 12, action: togglePause });
    }

    // Shield indicator
    const maxShields = upLvl('shield');
    if (maxShields > 0 && state === 'run') {
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.font = '300 11px "DM Mono", monospace';
      ctx.fillStyle = muted;
      let sdots = '';
      for (let i = 0; i < maxShields; i++) sdots += i < shieldsLeft ? '●' : '○';
      ctx.fillText('shield  ' + sdots, 132, H - 50);
    }

    // ── Overlays ──────────────────────────────────────────────────────
    const midY = GY / 2;
    ctx.textAlign = 'center';

    if (state === 'idle') {
      ctx.font = '400 56px "DM Mono", monospace';
      ctx.fillStyle = text;
      ctx.fillText('run', W/2, midY - 90);

      ctx.font = '300 11px "DM Mono", monospace';
      ctx.fillStyle = muted;
      ctx.fillText('endless  ·  double jump  ·  upgrades', W/2, midY - 64);

      const dailyHi = todayDailyHi();
      if (mode === 'daily') {
        ctx.font = '300 10px "DM Mono", monospace';
        ctx.fillStyle = '#c8a020';
        const lbl = dailyHi > 0 ? "today's best  " + String(dailyHi).padStart(6, '0') : "today's best  —";
        ctx.fillText(lbl, W/2, midY - 44);
      } else if (hiScore > 0) {
        ctx.font = '300 10px "DM Mono", monospace';
        ctx.fillStyle = '#c8a020';
        ctx.fillText('best  ' + String(hiScore).padStart(6, '0'), W/2, midY - 44);
      }

      ctx.font = '300 10px "DM Mono", monospace';
      ctx.fillStyle = muted;
      ctx.fillText('mode', W/2, midY - 18);
      const MODES = ['normal', 'daily'];
      const mBtnW = Math.min(100, (W - 60) / 2 - 8), mBtnH = 26, mGap = 8;
      const mTotal = MODES.length * mBtnW + (MODES.length - 1) * mGap;
      let mx = W/2 - mTotal/2;
      const my = midY - 8;
      MODES.forEach(m => {
        const sel = m === mode;
        const area = { x: mx, y: my, w: mBtnW, h: mBtnH };
        const hov = hit(area, mouseX, mouseY);
        ctx.fillStyle = sel ? line : (hov ? line : 'transparent');
        if (sel || hov) { ctx.globalAlpha = sel ? 0.7 : 0.35; ctx.fillRect(mx, my, mBtnW, mBtnH); ctx.globalAlpha = 1; }
        ctx.strokeStyle = sel ? text : line; ctx.lineWidth = 1;
        ctx.strokeRect(mx + 0.5, my + 0.5, mBtnW - 1, mBtnH - 1);
        ctx.font = '400 11px "DM Mono", monospace';
        ctx.fillStyle = sel ? text : muted;
        ctx.textBaseline = 'middle';
        ctx.fillText(m, mx + mBtnW/2, my + mBtnH/2);
        ctx.textBaseline = 'alphabetic';
        hitAreas.push({ ...area, action: () => {
          mode = m;
          localStorage.setItem('run_mode', mode);
          if (mode === 'daily') { difficulty = 'normal'; saveAll(); }
        } });
        mx += mBtnW + mGap;
      });

      let sbY;
      if (mode === 'daily') {
        ctx.font = '300 10px "DM Mono", monospace';
        ctx.fillStyle = muted;
        ctx.fillText('today  ·  ' + todayStr(), W/2, midY + 36);
        sbY = midY + 56;
      } else {
        ctx.font = '300 10px "DM Mono", monospace';
        ctx.fillStyle = muted;
        ctx.fillText('difficulty', W/2, midY + 40);
        const dBtnW = Math.min(90, (W - 60) / 3 - 8), dBtnH = 26, dGap = 8;
        const dTotal = DIFF_NAMES.length * dBtnW + (DIFF_NAMES.length - 1) * dGap;
        let dx = W/2 - dTotal/2;
        const dy = midY + 50;
        DIFF_NAMES.forEach(d => {
          const sel = d === difficulty;
          const area = { x: dx, y: dy, w: dBtnW, h: dBtnH };
          const hov = hit(area, mouseX, mouseY);
          ctx.fillStyle = sel ? line : (hov ? line : 'transparent');
          if (sel || hov) { ctx.globalAlpha = sel ? 0.7 : 0.35; ctx.fillRect(dx, dy, dBtnW, dBtnH); ctx.globalAlpha = 1; }
          ctx.strokeStyle = sel ? text : line; ctx.lineWidth = 1;
          ctx.strokeRect(dx + 0.5, dy + 0.5, dBtnW - 1, dBtnH - 1);
          ctx.font = '400 11px "DM Mono", monospace';
          ctx.fillStyle = sel ? text : muted;
          ctx.textBaseline = 'middle';
          ctx.fillText(d, dx + dBtnW/2, dy + dBtnH/2);
          ctx.textBaseline = 'alphabetic';
          hitAreas.push({ ...area, action: () => { difficulty = d; saveAll(); } });
          dx += dBtnW + dGap;
        });
        sbY = midY + 94;
      }

      const sbW = 180, sbH = 36;
      const sbX = W/2 - sbW/2;
      const sbHov = hit({ x: sbX, y: sbY, w: sbW, h: sbH }, mouseX, mouseY);
      ctx.fillStyle = sbHov ? text : 'transparent';
      ctx.fillRect(sbX, sbY, sbW, sbH);
      ctx.strokeStyle = text; ctx.lineWidth = 1;
      ctx.strokeRect(sbX + 0.5, sbY + 0.5, sbW - 1, sbH - 1);
      ctx.font = '500 13px "DM Mono", monospace';
      ctx.fillStyle = sbHov ? bg : text;
      ctx.textBaseline = 'middle';
      ctx.fillText('begin run', W/2, sbY + sbH/2);
      ctx.textBaseline = 'alphabetic';
      hitAreas.push({ x: sbX, y: sbY, w: sbW, h: sbH, action: onAction });

      ctx.font = '300 10px "DM Mono", monospace';
      ctx.fillStyle = muted;
      ctx.fillText(isMobile ? 'tap to jump  ·  double-tap for double jump' : 'space · click · tap to jump', W/2, sbY + sbH + 22);

      const uH = 28;
      const uGap = 10;
      const totalW = Math.min(300, W - 60);
      const uW = (totalW - uGap) / 2;
      const uY = sbY + sbH + 48;
      const uX1 = W/2 - totalW/2;
      const uX2 = uX1 + uW + uGap;

      const u1Hov = hit({ x: uX1, y: uY, w: uW, h: uH }, mouseX, mouseY);
      ctx.fillStyle = u1Hov ? line : 'transparent';
      if (u1Hov) { ctx.globalAlpha = 0.4; ctx.fillRect(uX1, uY, uW, uH); ctx.globalAlpha = 1; }
      ctx.strokeStyle = line; ctx.lineWidth = 1;
      ctx.strokeRect(uX1 + 0.5, uY + 0.5, uW - 1, uH - 1);
      ctx.font = '400 11px "DM Mono", monospace';
      ctx.fillStyle = muted;
      ctx.textBaseline = 'middle';
      ctx.fillText('upgrades  ◆ ' + coins, uX1 + uW/2, uY + uH/2);
      ctx.textBaseline = 'alphabetic';
      hitAreas.push({ x: uX1, y: uY, w: uW, h: uH, action: openShop });

      const u2Hov = hit({ x: uX2, y: uY, w: uW, h: uH }, mouseX, mouseY);
      ctx.fillStyle = u2Hov ? line : 'transparent';
      if (u2Hov) { ctx.globalAlpha = 0.4; ctx.fillRect(uX2, uY, uW, uH); ctx.globalAlpha = 1; }
      ctx.strokeStyle = line; ctx.lineWidth = 1;
      ctx.strokeRect(uX2 + 0.5, uY + 0.5, uW - 1, uH - 1);
      ctx.font = '400 11px "DM Mono", monospace';
      ctx.fillStyle = muted;
      ctx.textBaseline = 'middle';
      ctx.fillText('skins', uX2 + uW/2, uY + uH/2);
      ctx.textBaseline = 'alphabetic';
      hitAreas.push({ x: uX2, y: uY, w: uW, h: uH, action: openSkins });

      const lbW = 160, lbH = 26;
      const lbX = W/2 - lbW/2, lbY = uY + uH + 14;
      const lbHov = hit({ x: lbX, y: lbY, w: lbW, h: lbH }, mouseX, mouseY);
      ctx.font = '300 10px "DM Mono", monospace';
      ctx.fillStyle = lbHov ? text : muted;
      ctx.textBaseline = 'middle';
      ctx.fillText('leaderboard →', W/2, lbY + lbH/2);
      ctx.textBaseline = 'alphabetic';
      hitAreas.push({ x: lbX, y: lbY, w: lbW, h: lbH, action: () => window.location.href = '/break-times/run-leaderboard.html' });

    } else if (state === 'paused') {
      ctx.fillStyle = bg;
      ctx.globalAlpha = 0.72;
      ctx.fillRect(-20, -20, W + 40, H + 40);
      ctx.globalAlpha = 1;
      ctx.font = '400 32px "DM Mono", monospace';
      ctx.fillStyle = text;
      ctx.fillText('paused', W/2, midY - 8);
      ctx.font = '300 11px "DM Mono", monospace';
      ctx.fillStyle = muted;
      ctx.fillText(isMobile ? 'tap to resume' : 'P  ·  click  ·  tap to resume', W/2, midY + 20);
      hitAreas.push({ x: 0, y: 0, w: W, h: H, action: togglePause });

    } else if (state === 'dead') {
      const sf = Math.floor(score);
      const bestRef = mode === 'daily' ? todayDailyHi() : hiScore;
      const isNew = sf === bestRef && bestRef > 0;

      ctx.font = '400 48px "DM Mono", monospace';
      ctx.fillStyle = text;
      ctx.fillText('—', W/2, midY - 56);

      ctx.font = '400 22px "DM Mono", monospace';
      ctx.fillStyle = isNew ? '#c8a020' : text;
      ctx.fillText(String(sf).padStart(6, '0') + (isNew ? '  ★' : ''), W/2, midY - 22);

      ctx.font = '300 10px "DM Mono", monospace';
      ctx.fillStyle = muted;
      const bestLbl = mode === 'daily' ? "today's best  " : 'best  ';
      ctx.fillText(isNew ? 'new best  ·  ' + bestLbl + String(bestRef).padStart(6, '0') : bestLbl + String(bestRef).padStart(6, '0'), W/2, midY - 2);

      if (coinsEarned > 0) {
        ctx.font = '400 12px "DM Mono", monospace';
        ctx.fillStyle = '#c8a020';
        ctx.fillText('+' + coinsEarned + '  ◆   ·   total  ' + coins, W/2, midY + 22);
        if (coinsCollected > 0) {
          ctx.font = '300 9px "DM Mono", monospace';
          ctx.fillStyle = muted;
          ctx.fillText((coinsEarned - coinsCollected) + ' from score  ·  ' + coinsCollected + ' picked up', W/2, midY + 38);
        }
      }

      const rbW = 180, rbH = 36;
      const rbX = W/2 - rbW/2, rbY = midY + 56;
      const rbHov = hit({ x: rbX, y: rbY, w: rbW, h: rbH }, mouseX, mouseY);
      ctx.fillStyle = rbHov ? text : 'transparent';
      ctx.fillRect(rbX, rbY, rbW, rbH);
      ctx.strokeStyle = text; ctx.lineWidth = 1;
      ctx.strokeRect(rbX + 0.5, rbY + 0.5, rbW - 1, rbH - 1);
      ctx.font = '500 13px "DM Mono", monospace';
      ctx.fillStyle = rbHov ? bg : text;
      ctx.textBaseline = 'middle';
      ctx.fillText('retry', W/2, rbY + rbH/2);
      ctx.textBaseline = 'alphabetic';
      hitAreas.push({ x: rbX, y: rbY, w: rbW, h: rbH, action: () => { init(); beginRun(); } });

      const ssW = 180, ssH = 32;
      const ssX = W/2 - ssW/2, ssY = midY + 56 + 40;
      const ssHov = hit({ x: ssX, y: ssY, w: ssW, h: ssH }, mouseX, mouseY);
      ctx.fillStyle = ssHov ? line : 'transparent';
      if (ssHov) { ctx.globalAlpha = 0.4; ctx.fillRect(ssX, ssY, ssW, ssH); ctx.globalAlpha = 1; }
      ctx.strokeStyle = text; ctx.lineWidth = 1;
      ctx.strokeRect(ssX + 0.5, ssY + 0.5, ssW - 1, ssH - 1);
      ctx.font = '400 12px "DM Mono", monospace';
      ctx.fillStyle = text;
      ctx.textBaseline = 'middle';
      ctx.fillText('submit score', W/2, ssY + ssH/2);
      ctx.textBaseline = 'alphabetic';
      hitAreas.push({ x: ssX, y: ssY, w: ssW, h: ssH, action: () => openSubmitOverlay() });

      const uW = 140, uH = 28;
      const uX = W/2 - uW/2, uY = midY + 56 + 80;
      const uHov = hit({ x: uX, y: uY, w: uW, h: uH }, mouseX, mouseY);
      ctx.fillStyle = uHov ? line : 'transparent';
      if (uHov) { ctx.globalAlpha = 0.4; ctx.fillRect(uX, uY, uW, uH); ctx.globalAlpha = 1; }
      ctx.strokeStyle = line; ctx.lineWidth = 1;
      ctx.strokeRect(uX + 0.5, uY + 0.5, uW - 1, uH - 1);
      ctx.font = '400 11px "DM Mono", monospace';
      ctx.fillStyle = muted;
      ctx.textBaseline = 'middle';
      ctx.fillText('upgrades  ◆ ' + coins, W/2, uY + uH/2);
      ctx.textBaseline = 'alphabetic';
      hitAreas.push({ x: uX, y: uY, w: uW, h: uH, action: openShop });
    }

    ctx.restore();
  }

  // ── Loop ──────────────────────────────────────────────────────────────
  function loop(t) {
    const dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    nowMs = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  let submitSnap = null;
  const submitOverlay = document.getElementById('submit-overlay');
  const nameInput     = document.getElementById('name-input');
  const subScore      = document.getElementById('sub-score');
  const subMeta       = document.getElementById('sub-meta');
  const subError      = document.getElementById('sub-error');
  const subStatus     = document.getElementById('sub-status');
  const subSubmit     = document.getElementById('sub-submit');

  subSubmit.addEventListener('click', () => doSubmitScore());
  document.getElementById('sub-cancel').addEventListener('click', () => doSubmitScore('anon'));
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doSubmitScore(); } });

  function openSubmitOverlay() {
    const isDaily = mode === 'daily';
    submitSnap = {
      score: Math.floor(score),
      difficulty,
      mode,
      seed: isDaily ? todayStr() : '',
      coins: coinsEarned,
    };
    subScore.textContent = submitSnap.score.toLocaleString() + ' pts';
    subMeta.textContent = `${submitSnap.difficulty}  ·  ${submitSnap.mode}` + (isDaily ? '  ·  ' + submitSnap.seed : '') + `  ·  ◆ ${submitSnap.coins}`;
    subError.textContent = '';
    subStatus.textContent = '';
    nameInput.value = localStorage.getItem('run_last_name') || '';
    submitOverlay.style.display = 'flex';
    setTimeout(() => nameInput.focus(), 50);
  }

  async function doSubmitScore(overrideName) {
    const name = overrideName || nameInput.value.trim();
    if (!name) { subError.textContent = 'enter a name'; return; }
    subError.textContent = '';
    subStatus.textContent = 'submitting…';
    subSubmit.disabled = true;
    try {
      const s = submitSnap;
      const r = await fetch('/api/run/score', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name, score: s.score, difficulty: s.difficulty, mode: s.mode, seed: s.seed, coins: s.coins }),
      });
      const data = await r.json();
      if (!r.ok) { subError.textContent = data.error || 'submit failed'; subStatus.textContent = ''; subSubmit.disabled = false; return; }
      if (!overrideName) localStorage.setItem('run_last_name', name);
      submitOverlay.style.display = 'none';
      subSubmit.disabled = false;
    } catch (e) {
      console.error('submit failed:', e);
      subError.textContent = 'network error';
      subStatus.textContent = '';
      subSubmit.disabled = false;
    }
  }

  resize();
  init();
  lastT = performance.now();
  requestAnimationFrame(loop);
  </script>
</body>
</html>
