<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>run</title>
  <link rel="icon" type="image/x-icon" href="/favistuff/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favistuff/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favistuff/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/favistuff/apple-touch-icon.png">
  <link rel="manifest" href="/favistuff/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #f5f4f0; --text: #1a1a1a; --muted: #888; --line: #d8d6d0; }
    body.dark { --bg: #111110; --text: #e8e6e2; --muted: #666; --line: #2a2926; }
    body { background: var(--bg); overflow: hidden; height: 100vh; overscroll-behavior: none; }
    canvas { display: block; cursor: none; touch-action: none; }
    body.show-cursor canvas { cursor: default; }
    #back {
      position: fixed; top: 1.5rem; left: 1.5rem;
      font-family: 'DM Mono', monospace; font-size: 0.7rem;
      color: var(--line); text-decoration: none;
      letter-spacing: 0.06em; z-index: 100;
    }
    #back:hover { color: var(--muted); }
    #theme {
      position: fixed; top: 1.5rem; right: 1.5rem;
      background: none; border: none;
      font-family: 'DM Mono', monospace; font-size: 1.1rem;
      color: var(--muted); cursor: pointer; padding: 4px; z-index: 100;
    }
    #mute {
      position: fixed; top: 1.5rem; right: 3.5rem;
      background: none; border: none;
      font-family: 'DM Mono', monospace; font-size: 0.85rem;
      color: var(--muted); cursor: pointer; padding: 4px; z-index: 100;
    }
    #mute:hover { color: var(--text); }
  </style>
</head>
<body>
  <a href="../break.html" id="back">← break</a>
  <button id="theme" onclick="toggleTheme()">+</button>
  <button id="mute" onclick="toggleMute()" title="mute / unmute music">♪</button>
  <audio id="bgm" src="/audio/zeldatwilightprincess.mp3" loop preload="auto"></audio>
  <canvas id="c"></canvas>
  <script>
  const bgm = document.getElementById('bgm');
  bgm.volume = 0.4;
  let muted = localStorage.getItem('run_muted') === '1';
  function updateMuteBtn() { document.getElementById('mute').textContent = muted ? '♪̸' : '♪'; }
  function toggleMute() {
    muted = !muted;
    localStorage.setItem('run_muted', muted ? '1' : '0');
    updateMuteBtn();
    if (muted) bgm.pause(); else bgm.play().catch(() => {});
  }
  function startBgm() { if (!muted) bgm.play().catch(() => {}); }
  document.addEventListener('pointerdown', startBgm, { once: true });
  document.addEventListener('keydown', startBgm, { once: true });
  updateMuteBtn();

  function getTheme() { return localStorage.getItem('theme') || 'light'; }
  function applyTheme(t) {
    document.body.classList.toggle('dark', t === 'dark');
    const btn = document.getElementById('theme');
    if (btn) btn.textContent = t === 'dark' ? '−' : '+';
  }
  function toggleTheme() {
    const t = getTheme() === 'dark' ? 'light' : 'dark';
    localStorage.setItem('theme', t);
    applyTheme(t);
    cacheColors();
  }
  applyTheme(getTheme());

  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  let W, H, GY;

  let C = {};
  function cacheColors() {
    const s = getComputedStyle(document.body);
    C.bg    = s.getPropertyValue('--bg').trim();
    C.text  = s.getPropertyValue('--text').trim();
    C.muted = s.getPropertyValue('--muted').trim();
    C.line  = s.getPropertyValue('--line').trim();
  }

  function hit(a, x, y) { return x >= a.x && x <= a.x + a.w && y >= a.y && y <= a.y + a.h; }
  function cycleDiff(dir) {
    const i = DIFF_NAMES.indexOf(difficulty);
    difficulty = DIFF_NAMES[(i + dir + DIFF_NAMES.length) % DIFF_NAMES.length];
    saveAll();
  }

  // ── Persistent data ────────────────────────────────────────────────────
  let coins      = +localStorage.getItem('run_coins') || 0;
  let difficulty = localStorage.getItem('run_diff') || 'normal';
  let upgrades   = JSON.parse(localStorage.getItem('run_upgrades') || '{}');

  const DIFF_NAMES = ['easy', 'normal', 'hard'];
  const DIFF = {
    easy:   { vramp: 11,  clusterBonus: -1, gapMin: 200, gapA: 520, gapB: 320, v0: 380, coinMult: 1.0  },
    normal: { vramp: 20,  clusterBonus:  0, gapMin: 150, gapA: 400, gapB: 240, v0: 450, coinMult: 1.4  },
    hard:   { vramp: 26,  clusterBonus:  1, gapMin: 130, gapA: 320, gapB: 180, v0: 510, coinMult: 1.9  },
  };

  const UPGRADE_DEFS = [
    { id: 'triple_jump', name: 'triple jump',  desc: '3rd jump per run',      cost: 500, max: 1 },
    { id: 'boost_dur',   name: 'boost  +2s',   desc: 'longer boost window',   cost: 250, max: 5 },
    { id: 'boost_cd',    name: 'cd  −2s',      desc: 'faster boost cooldown', cost: 300, max: 4 },
    { id: 'shield',      name: 'shield',        desc: '1 free hit per run',    cost: 800, max: 3 },
    { id: 'score_mult',  name: 'score  ×1.25', desc: 'score multiplier',      cost: 600, max: 4 },
  ];

  function upLvl(id) { return upgrades[id] || 0; }
  function saveAll() {
    localStorage.setItem('run_coins', coins);
    localStorage.setItem('run_diff', difficulty);
    localStorage.setItem('run_upgrades', JSON.stringify(upgrades));
  }

  // ── Background layer data ──────────────────────────────────────────────
  const FAR_W = 2200, MID_W = 1100;
  let farShapes = [], midShapes = [];
  let farOff = 0, midOff = 0;

  function generateBg() {
    farShapes = [];
    for (let x = 0; x < FAR_W; x += 70 + Math.random() * 160) {
      const h = 40 + Math.random() * GY * 0.52;
      farShapes.push({ x, w: 8 + Math.random() * 24, h, y: GY - h });
    }
    midShapes = [];
    for (let x = 0; x < MID_W; x += 22 + Math.random() * 70) {
      midShapes.push({ x, y: 20 + Math.random() * (GY - 90), h: 8 + Math.random() * 32 });
    }
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    GY = Math.round(H * 0.78);
    cacheColors();
    generateBg();
  }
  let resizeRaf = 0;
  window.addEventListener('resize', () => {
    if (resizeRaf) return;
    resizeRaf = requestAnimationFrame(() => { resizeRaf = 0; resize(); });
  });

  // ── Constants ─────────────────────────────────────────────────────────
  const PS           = 24;
  const GRAV         = 2500;
  const J1           = -780;
  const J2           = -610;
  const VMAX         = 1400;
  const TICK_GAP     = 80;
  const TRAIL_MAX    = 7;
  const STREAK_SPAWN = 0.45;
  const ROT_SPEED    = 7.5;
  const BOOST_DUR_BASE = 5;
  const BOOST_CD_BASE  = 10;

  // [w, h, type]  type: 'block' | 'spike' | 'spike2' | 'spike3'
  const OBS = [
    [18, 32, 'block'], [20, 48, 'block'], [22, 62, 'block'],
    [18, 28, 'block'], [20, 54, 'block'], [22, 72, 'block'],
    [24, 42, 'block'], [18, 80, 'block'], [20, 96, 'block'],
    [22, 22, 'spike'], [22, 22, 'spike'], [26, 26, 'spike'],
    [44, 22, 'spike2'], [44, 22, 'spike2'],
    [66, 22, 'spike3'],
  ];

  function effBOOST_DUR()  { return BOOST_DUR_BASE + upLvl('boost_dur') * 2; }
  function effBOOST_CD()   { return Math.max(2, BOOST_CD_BASE - upLvl('boost_cd') * 2); }
  function effMaxJumps()   { return upLvl('triple_jump') ? 3 : 2; }
  function effScoreMult()  { return Math.pow(1.25, upLvl('score_mult')); }

  // ── State ─────────────────────────────────────────────────────────────
  let state, score, spd, tickOff;
  let spawnTimer, spawnMode, clusterLeft;
  let pickupTimer;
  let player, obstacles, particles, streaks, trail, pickups;
  let shakeX, shakeY, lastT;
  let boostActive, boostTimer, boostCooldown;
  let shieldsLeft;
  let hiScore    = +localStorage.getItem('run_hi') || 0;
  let coinsEarned = 0;
  let coinsCollected = 0;
  let pickupPulse = 0;
  let shopSel    = 0;
  let mouseX = 0, mouseY = 0;
  let hitAreas   = [];

  function init() {
    state = 'idle'; score = 0; coinsEarned = 0; coinsCollected = 0;
    const diff = DIFF[difficulty];
    spd = diff.v0; tickOff = 0;
    spawnTimer = 1.0; spawnMode = 'gap'; clusterLeft = 0;
    pickupTimer = 1.4;
    player = { x: W * 0.14, y: GY - PS, vy: 0, jumps: effMaxJumps(), angle: 0 };
    obstacles = []; particles = []; streaks = []; trail = []; pickups = [];
    shakeX = shakeY = 0;
    boostActive = false; boostTimer = 0; boostCooldown = 0;
    shieldsLeft = upLvl('shield');
  }

  // ── Input ─────────────────────────────────────────────────────────────
  function onAction() {
    if (state === 'idle') { state = 'run'; doJump(); return; }
    if (state === 'dead') { init(); return; }
    if (state === 'shop') return;
    if (state === 'paused') { state = 'run'; return; }
    doJump();
  }

  function togglePause() {
    if (state === 'run') state = 'paused';
    else if (state === 'paused') state = 'run';
  }

  function doJump() {
    if (player.jumps <= 0) return;
    player.vy = player.jumps === effMaxJumps() ? J1 : J2;
    player.jumps--;
    spawnDust(player.x + PS / 2, player.y + PS, 6);
  }

  function doBoost() {
    if (state !== 'run') return;
    if (boostActive || boostCooldown > 0) return;
    boostActive = true;
    boostTimer = effBOOST_DUR();
  }

  function openShop() {
    state = 'shop';
    shopSel = 0;
  }

  function closeShop() {
    init();
  }

  function buyUpgrade(idx) {
    const def = UPGRADE_DEFS[idx];
    const lvl = upLvl(def.id);
    if (lvl >= def.max) return;
    if (coins < def.cost) return;
    coins -= def.cost;
    upgrades[def.id] = lvl + 1;
    saveAll();
  }

  canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

  window.addEventListener('keydown', e => {
    if (state === 'shop') {
      if (e.code === 'ArrowUp')                              { e.preventDefault(); shopSel = (shopSel - 1 + UPGRADE_DEFS.length) % UPGRADE_DEFS.length; }
      if (e.code === 'ArrowDown')                            { e.preventDefault(); shopSel = (shopSel + 1) % UPGRADE_DEFS.length; }
      if (e.code === 'Enter')                                { e.preventDefault(); buyUpgrade(shopSel); }
      if (e.code === 'Escape' || e.code === 'Backspace')    { e.preventDefault(); closeShop(); }
      return;
    }
    if (e.code === 'ArrowLeft' && state === 'idle')  { e.preventDefault(); cycleDiff(-1); return; }
    if (e.code === 'ArrowRight' && state === 'idle') { e.preventDefault(); cycleDiff( 1); return; }
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); onAction(); }
    if (e.code === 'KeyG') doBoost();
    if (e.code === 'KeyU' && state !== 'run' && state !== 'paused') openShop();
    if (e.code === 'KeyP') { e.preventDefault(); togglePause(); }
  });

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    const cx = e.clientX, cy = e.clientY;
    for (const a of hitAreas) { if (hit(a, cx, cy)) { a.action(); return; } }
    onAction();
  });

  // ── Particles ─────────────────────────────────────────────────────────
  function spawnDust(x, y, n) {
    for (let i = 0; i < n; i++)
      particles.push({ x, y, vx: (Math.random()-0.5)*110, vy: -Math.random()*90-20, life: 1, r: 1.5+Math.random()*2.5 });
  }
  function spawnBurst(x, y) {
    for (let i = 0; i < 28; i++) {
      const a = (i/28)*Math.PI*2, s = 110+Math.random()*320;
      particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, r: 1.5+Math.random()*4 });
    }
  }

  // ── Update ────────────────────────────────────────────────────────────
  function update(dt) {
    if (state === 'paused') return;
    const fsRunning = state === 'run';
    const bgSpd = boostActive ? spd * 2 : spd;
    farOff = (farOff + (fsRunning ? bgSpd*0.08 : 22) * dt) % FAR_W;
    midOff = (midOff + (fsRunning ? bgSpd*0.24 : 60) * dt) % MID_W;

    if (state !== 'run') return;

    // Boost timers
    if (boostActive) {
      boostTimer -= dt;
      if (boostTimer <= 0) { boostActive = false; boostCooldown = effBOOST_CD(); }
    } else if (boostCooldown > 0) {
      boostCooldown = Math.max(0, boostCooldown - dt);
    }

    const eff  = boostActive ? spd * 2 : spd;
    const diff = DIFF[difficulty];
    score += dt * eff * 0.05 * (boostActive ? 5 : 1) * effScoreMult();
    spd = Math.min(diff.v0 + (score / 1000) * diff.vramp, VMAX);
    tickOff = (tickOff + eff * dt) % TICK_GAP;

    // Player physics
    player.vy += GRAV * dt;
    player.y  += player.vy * dt;

    if (player.y >= GY - PS) {
      const hard = player.vy > 300;
      player.y = GY - PS;
      if (hard) spawnDust(player.x + PS/2, GY, 11);
      player.vy = 0; player.jumps = effMaxJumps();
      player.angle = Math.round(player.angle / (Math.PI / 2)) * (Math.PI / 2);
    } else {
      player.angle += ROT_SPEED * dt;
    }

    // Trail
    trail.unshift({ x: player.x, y: player.y, angle: player.angle });
    if (trail.length > TRAIL_MAX) trail.pop();

    // Speed streaks
    const sf = Math.max(0, (eff - 600) / (VMAX - 600));
    if (sf > 0 && Math.random() < sf * STREAK_SPAWN) {
      streaks.push({ x: W + 20, y: Math.random() * GY * 0.95, len: 50 + Math.random() * 140, life: 1 });
    }
    for (let i = streaks.length-1; i >= 0; i--) {
      streaks[i].x -= eff * dt * 1.4;
      streaks[i].life -= 4 * dt;
      if (streaks[i].life <= 0 || streaks[i].x + streaks[i].len < 0) streaks.splice(i, 1);
    }

    // Cluster spawn system
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      if (spawnMode === 'gap') {
        const maxSize = Math.max(1, 2 + Math.min(4, Math.floor(score / 600)) + diff.clusterBonus);
        clusterLeft = Math.max(1, 2 + Math.floor(Math.random() * (maxSize - 1)));
        spawnMode = 'cluster';
      }
      const [w, h, type] = OBS[Math.floor(Math.random() * OBS.length)];
      obstacles.push({ x: W + 10, y: GY - h, w, h, type: type || 'block' });
      clusterLeft--;
      if (clusterLeft <= 0) {
        spawnMode = 'gap';
        spawnTimer = (diff.gapA + Math.random() * diff.gapB) / spd;
      } else {
        const gap = Math.max(diff.gapMin, 230 - score / 120);
        spawnTimer = gap / spd;
      }
    }
    for (let i = obstacles.length-1; i >= 0; i--) {
      obstacles[i].x -= eff * dt;
      if (obstacles[i].x + obstacles[i].w < -10) obstacles.splice(i, 1);
    }

    pickupTimer -= dt;
    if (pickupTimer <= 0) {
      const py = GY - (40 + Math.random() * 110);
      pickups.push({ x: W + 14, y: py, r: 8, vy: 0, phase: Math.random() * Math.PI * 2 });
      pickupTimer = 1.6 + Math.random() * 1.4;
    }
    pickupPulse += dt * 4;
    for (let i = pickups.length - 1; i >= 0; i--) {
      const pk = pickups[i];
      pk.x -= eff * dt;
      if (pk.x + pk.r < -10) { pickups.splice(i, 1); continue; }
      const closestX = Math.max(player.x, Math.min(pk.x, player.x + PS));
      const closestY = Math.max(player.y, Math.min(pk.y, player.y + PS));
      const dx = pk.x - closestX, dy = pk.y - closestY;
      if (dx*dx + dy*dy <= pk.r*pk.r + 4) {
        const earned = boostActive ? 2 : 1;
        coinsCollected += earned;
        spawnDust(pk.x, pk.y, 8);
        pickups.splice(i, 1);
      }
    }

    // Particles
    for (let i = particles.length-1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 500*dt; p.life -= 2.5*dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    shakeX *= 0.74; shakeY *= 0.74;

    // Collision (inset hitbox)
    const hx = player.x+4, hy = player.y+4, hw = PS-8, hh = PS-5;
    for (let i = 0; i < obstacles.length; i++) {
      const o = obstacles[i];
      if (hx < o.x+o.w && hx+hw > o.x && hy < o.y+o.h && hy+hh > o.y) {
        if (shieldsLeft > 0) {
          shieldsLeft--;
          obstacles.splice(i, 1);
          spawnDust(player.x + PS/2, player.y + PS/2, 16);
          shakeX = 6; shakeY = 5;
        } else {
          state = 'dead';
          hiScore = Math.max(hiScore, Math.floor(score));
          localStorage.setItem('run_hi', hiScore);
          const scoreCoins = Math.floor(Math.floor(score) / 40 * DIFF[difficulty].coinMult);
          coinsEarned = scoreCoins + coinsCollected;
          coins += coinsEarned;
          saveAll();
          spawnBurst(player.x + PS/2, player.y + PS/2);
          shakeX = 10; shakeY = 8;
        }
        break;
      }
    }
  }

  function tileRect(x0, lw, y, w, h) {
    const nx = ((x0 % lw) + lw) % lw;
    if (nx < W + w) ctx.fillRect(nx, y, w, h);
    const nx2 = nx - lw;
    if (nx2 + w > 0) ctx.fillRect(nx2, y, w, h);
  }

  // ── Shop draw ─────────────────────────────────────────────────────────
  function drawShop() {
    hitAreas = [];
    const { bg, text, muted, line } = C;
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const cx  = W / 2;
    const ty  = H * 0.16;
    const rowH = 54;
    const listY = ty + 68;
    const colW  = Math.min(340, W * 0.8);

    // Title
    ctx.textAlign = 'center';
    ctx.font = '400 26px "DM Mono", monospace';
    ctx.fillStyle = text;
    ctx.fillText('upgrades', cx, ty);

    // Coin count
    ctx.font = '300 11px "DM Mono", monospace';
    ctx.fillStyle = muted;
    ctx.fillText(coins + '  coins', cx, ty + 22);

    // Separator
    ctx.strokeStyle = line;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - colW/2, ty + 38);
    ctx.lineTo(cx + colW/2, ty + 38);
    ctx.stroke();

    for (let i = 0; i < UPGRADE_DEFS.length; i++) {
      const def    = UPGRADE_DEFS[i];
      const lvl    = upLvl(def.id);
      const maxed  = lvl >= def.max;
      const canBuy = !maxed && coins >= def.cost;
      const sel    = shopSel === i;
      const rowY   = listY + i * rowH;

      const rowArea = { x: cx - colW/2, y: rowY - 14, w: colW, h: rowH - 4 };
      const hovered = hit(rowArea, mouseX, mouseY);
      hitAreas.push({ ...rowArea, action: () => { shopSel = i; buyUpgrade(i); } });

      // Row highlight
      if (sel || hovered) {
        ctx.fillStyle = line;
        ctx.globalAlpha = 0.4;
        ctx.fillRect(cx - colW/2, rowY - 14, colW, rowH - 6);
        ctx.globalAlpha = 1;
      }

      // Arrow
      ctx.textAlign = 'left';
      ctx.font = '400 12px "DM Mono", monospace';
      ctx.fillStyle = (sel || hovered) ? text : 'transparent';
      ctx.fillText('→', cx - colW/2 + 4, rowY + 2);

      const nameColor = canBuy ? text : muted;
      ctx.fillStyle = nameColor;
      ctx.font = '400 13px "DM Mono", monospace';
      ctx.fillText(def.name, cx - colW/2 + 22, rowY + 2);

      ctx.textAlign = 'center';
      ctx.font = '300 11px "DM Mono", monospace';
      ctx.fillStyle = muted;
      let dots = '';
      for (let d = 0; d < def.max; d++) dots += d < lvl ? '●' : '○';
      ctx.fillText(dots, cx, rowY + 2);

      ctx.textAlign = 'right';
      ctx.font = '400 13px "DM Mono", monospace';
      ctx.fillStyle = nameColor;
      ctx.fillText(maxed ? 'maxed' : def.cost + ' c', cx + colW/2 - 4, rowY + 2);

      ctx.textAlign = 'left';
      ctx.font = '300 10px "DM Mono", monospace';
      ctx.fillStyle = muted;
      ctx.fillText(def.desc, cx - colW/2 + 22, rowY + 17);
    }

    // Footer (tappable to close)
    ctx.textAlign = 'center';
    ctx.font = '300 10px "DM Mono", monospace';
    ctx.fillStyle = muted;
    ctx.fillText('↑↓ navigate  ·  enter buy  ·  esc / tap to close', cx, H - 26);
    hitAreas.push({ x: cx - 180, y: H - 44, w: 360, h: 32, action: closeShop });

    // Close button — top-right
    ctx.textAlign = 'right';
    ctx.font = '400 16px "DM Mono", monospace';
    ctx.fillStyle = text;
    ctx.fillText('✕', cx + colW/2, ty);
    hitAreas.push({ x: cx + colW/2 - 24, y: ty - 22, w: 32, h: 32, action: closeShop });
  }

  let lastCursorState = null;
  let nowMs = 0;
  function draw() {
    if (state !== lastCursorState) {
      document.body.classList.toggle('show-cursor', state !== 'run');
      lastCursorState = state;
    }
    if (state === 'shop') { drawShop(); return; }

    hitAreas = [];
    const { bg, text, muted, line } = C;
    let ox = 0, oy = 0;
    if (shakeX || shakeY) {
      ox = shakeX * (Math.random()*2-1);
      oy = shakeY * (Math.random()*2-1);
    }

    ctx.save();
    ctx.translate(ox, oy);

    ctx.fillStyle = bg;
    ctx.fillRect(-20, -20, W+40, H+40);
    if (boostActive) {
      ctx.fillStyle = text;
      ctx.globalAlpha = 0.03 + 0.025 * Math.sin(nowMs / 80);
      ctx.fillRect(-20, -20, W+40, H+40);
      ctx.globalAlpha = 1;
    }

    // Far layer
    ctx.fillStyle = line;
    ctx.globalAlpha = 0.38;
    for (const s of farShapes) tileRect(s.x - farOff, FAR_W, s.y, s.w, s.h);

    // Mid layer
    ctx.fillStyle = muted;
    ctx.globalAlpha = 0.11;
    for (const s of midShapes) tileRect(s.x - midOff, MID_W, s.y, 1.5, s.h);

    ctx.globalAlpha = 1;

    // Speed streaks
    ctx.strokeStyle = line;
    ctx.lineWidth = 0.8;
    for (const s of streaks) {
      ctx.globalAlpha = s.life * 0.22;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + s.len, s.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Player trail
    const speedF = Math.max(0, (spd - 520) / (VMAX - 520));
    if (speedF > 0 && trail.length > 1) {
      ctx.fillStyle = text;
      for (let i = 1; i < trail.length; i++) {
        ctx.globalAlpha = speedF * (1 - i / trail.length) * 0.22;
        ctx.save();
        ctx.translate(trail[i].x + PS/2, trail[i].y + PS/2);
        ctx.rotate(trail[i].angle);
        ctx.fillRect(-PS/2, -PS/2, PS, PS);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    const SPIKE_COUNT = { spike: 1, spike2: 2, spike3: 3 };
    ctx.fillStyle = text;
    for (const o of obstacles) {
      const n = SPIKE_COUNT[o.type];
      if (!n) { ctx.fillRect(o.x, o.y, o.w, o.h); continue; }
      const sw = o.w / n;
      for (let k = 0; k < n; k++) {
        ctx.beginPath();
        ctx.moveTo(o.x + k*sw,        o.y + o.h);
        ctx.lineTo(o.x + k*sw + sw/2, o.y);
        ctx.lineTo(o.x + k*sw + sw,   o.y + o.h);
        ctx.closePath();
        ctx.fill();
      }
    }

    for (const pk of pickups) {
      const pulse = 1 + Math.sin(pickupPulse + pk.phase) * 0.12;
      const r = pk.r * pulse;
      ctx.save();
      ctx.translate(pk.x, pk.y);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = '#c8a020';
      ctx.fillRect(-r, -r, r*2, r*2);
      ctx.fillStyle = bg;
      ctx.fillRect(-r*0.45, -r*0.45, r*0.9, r*0.9);
      ctx.restore();
    }

    if (state !== 'dead') {
      const pcx = player.x + PS / 2;
      const pcy = player.y + PS / 2;
      ctx.save();
      ctx.translate(pcx, pcy);
      ctx.rotate(player.angle);
      ctx.fillStyle = text;
      ctx.fillRect(-PS/2, -PS/2, PS, PS);
      if (shieldsLeft > 0) {
        ctx.fillStyle = muted;
        ctx.globalAlpha = 0.35;
        ctx.fillRect(-PS/2, -PS/2, PS, PS);
        ctx.globalAlpha = 1;
      }
      const inset = PS * 0.26;
      ctx.fillStyle = bg;
      ctx.fillRect(-PS/2 + inset, -PS/2 + inset, PS - inset*2, PS - inset*2);
      ctx.fillStyle = text;
      ctx.fillRect(-3, -3, 6, 6);
      ctx.restore();
    }

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life) * 0.72;
      ctx.fillStyle = muted;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Ground ticks
    ctx.fillStyle = line;
    for (let x = (TICK_GAP - tickOff % TICK_GAP) % TICK_GAP; x < W + TICK_GAP; x += TICK_GAP) {
      ctx.fillRect(Math.round(x) - 2, GY + 5, 4, 4);
    }

    // Ground line
    ctx.strokeStyle = line;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, GY); ctx.lineTo(W, GY);
    ctx.stroke();

    // ── HUD ───────────────────────────────────────────────────────────
    ctx.textAlign = 'right';
    ctx.font = '400 13px "DM Mono", monospace';
    ctx.fillStyle = text;
    ctx.fillText((boostActive ? '×10  ' : '') + String(Math.floor(score)).padStart(6, '0'), W - 22, 38);
    ctx.font = '300 10px "DM Mono", monospace';
    ctx.fillStyle = muted;
    ctx.fillText('hi  ' + String(hiScore).padStart(6, '0'), W - 22, 56);

    // Coins (top right, below hi score)
    ctx.fillText('◆  ' + coins + (coinsCollected > 0 && state === 'run' ? '  +' + coinsCollected : ''), W - 22, 72);

    // Boost indicator — bottom-left (tappable while running)
    ctx.textAlign = 'left';
    ctx.font = '400 11px "DM Mono", monospace';
    if (boostActive) {
      ctx.fillStyle = text;
      ctx.fillText('[ G ]  ×10  ' + boostTimer.toFixed(1) + 's', 22, H - 38);
    } else if (boostCooldown > 0) {
      ctx.fillStyle = muted;
      ctx.fillText('[ G ]  ' + boostCooldown.toFixed(1) + 's', 22, H - 38);
    } else {
      ctx.fillStyle = text;
      ctx.fillText('[ G ]  ready', 22, H - 38);
    }
    if (state === 'run') {
      hitAreas.push({ x: 12, y: H - 60, w: 180, h: 48, action: doBoost });
    }

    // Pause button — top-right, below coins
    if (state === 'run' || state === 'paused') {
      const pSize = 36;
      const pX = W - 22 - pSize;
      const pY = 92;
      ctx.strokeStyle = line; ctx.lineWidth = 1;
      ctx.strokeRect(pX + 0.5, pY + 0.5, pSize, pSize);
      ctx.fillStyle = text;
      if (state === 'paused') {
        ctx.beginPath();
        ctx.moveTo(pX + 13, pY + 10);
        ctx.lineTo(pX + 13, pY + 26);
        ctx.lineTo(pX + 27, pY + 18);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(pX + 11, pY + 10, 4, 16);
        ctx.fillRect(pX + 21, pY + 10, 4, 16);
      }
      hitAreas.push({ x: pX - 6, y: pY - 6, w: pSize + 12, h: pSize + 12, action: togglePause });
    }

    // Shield indicator
    const maxShields = upLvl('shield');
    if (maxShields > 0) {
      ctx.font = '300 11px "DM Mono", monospace';
      ctx.fillStyle = muted;
      let sdots = '';
      for (let i = 0; i < maxShields; i++) sdots += i < shieldsLeft ? '●' : '○';
      ctx.fillText('shield  ' + sdots, 22, H - 22);
    }

    // ── Overlays ──────────────────────────────────────────────────────
    const midY = GY / 2;
    ctx.textAlign = 'center';

    if (state === 'idle') {
      ctx.font = '400 32px "DM Mono", monospace';
      ctx.fillStyle = text;
      ctx.fillText('run', W/2, midY - 18);

      ctx.font = '300 11px "DM Mono", monospace';
      ctx.fillStyle = muted;
      ctx.fillText('space  ·  click  ·  tap', W/2, midY + 10);
      ctx.fillText('double jump available', W/2, midY + 28);

      // Difficulty selector (tap cycles)
      const diffY = midY + 54;
      ctx.font = '300 11px "DM Mono", monospace';
      ctx.fillStyle = muted;
      ctx.fillText('←  ' + difficulty + '  →', W/2, diffY);
      hitAreas.push({ x: W/2 - 80, y: diffY - 14, w: 160, h: 24, action: () => cycleDiff(1) });

      // Upgrades link
      const uY = midY + 74;
      ctx.font = '300 10px "DM Mono", monospace';
      ctx.fillStyle = muted;
      ctx.fillText('[ U ]  upgrades', W/2, uY);
      hitAreas.push({ x: W/2 - 60, y: uY - 12, w: 120, h: 18, action: openShop });

    } else if (state === 'paused') {
      ctx.fillStyle = bg;
      ctx.globalAlpha = 0.72;
      ctx.fillRect(-20, -20, W + 40, H + 40);
      ctx.globalAlpha = 1;
      ctx.font = '400 32px "DM Mono", monospace';
      ctx.fillStyle = text;
      ctx.fillText('paused', W/2, midY - 8);
      ctx.font = '300 11px "DM Mono", monospace';
      ctx.fillStyle = muted;
      ctx.fillText('P  ·  click  ·  tap  to resume', W/2, midY + 20);
      hitAreas.push({ x: 0, y: 0, w: W, h: H, action: togglePause });

    } else if (state === 'dead') {
      ctx.font = '400 32px "DM Mono", monospace';
      ctx.fillStyle = text;
      ctx.fillText('—', W/2, midY - 18);

      ctx.font = '300 11px "DM Mono", monospace';
      ctx.fillStyle = muted;
      const isNew = Math.floor(score) === hiScore && hiScore > 0;
      ctx.fillText(String(Math.floor(score)) + (isNew ? '  ← best' : ''), W/2, midY + 10);
      ctx.fillText('space  ·  click  ·  tap  to retry', W/2, midY + 28);

      // Coins earned
      if (coinsEarned > 0) {
        ctx.fillStyle = text;
        const breakdown = coinsCollected > 0
          ? '+' + coinsEarned + '  coins  (' + (coinsEarned - coinsCollected) + ' score · ' + coinsCollected + ' picked up)'
          : '+' + coinsEarned + '  coins';
        ctx.fillText(breakdown, W/2, midY + 46);
        ctx.fillStyle = muted;
        ctx.fillText('total  ' + coins, W/2, midY + 62);
      }

      // Upgrades link
      const uY = midY + 64 + (coinsEarned > 0 ? 30 : 0);
      ctx.font = '300 10px "DM Mono", monospace';
      ctx.fillStyle = muted;
      ctx.fillText('[ U ]  upgrades', W/2, uY);
      hitAreas.push({ x: W/2 - 60, y: uY - 12, w: 120, h: 18, action: openShop });
    }

    ctx.restore();
  }

  // ── Loop ──────────────────────────────────────────────────────────────
  function loop(t) {
    const dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    nowMs = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  resize();
  init();
  lastT = performance.now();
  requestAnimationFrame(loop);
  </script>
</body>
</html>
