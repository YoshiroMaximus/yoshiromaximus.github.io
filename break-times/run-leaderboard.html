<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="leaderboard">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<title>run — leaderboard</title>
<link rel="icon" type="image/x-icon" href="/favistuff/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/favistuff/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favistuff/favicon-32x32.png">
<link rel="apple-touch-icon" href="/favistuff/apple-touch-icon.png">
<link rel="manifest" href="/favistuff/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f5f4f0;--text:#1a1a1a;--muted:#888;--line:#d8d6d0;--bg2:#ede9e4;}
body.dark{--bg:#111110;--text:#e8e6e2;--muted:#555;--line:#2a2926;--bg2:#1a1917;}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;scrollbar-gutter:stable;}
#back{position:fixed;top:max(1.5rem,env(safe-area-inset-top));left:max(1.5rem,env(safe-area-inset-left));font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--line);text-decoration:none;letter-spacing:0.06em;z-index:100;padding:8px;margin:-8px;}
#back:hover{color:var(--muted);}
#theme{position:fixed;top:max(1.5rem,env(safe-area-inset-top));right:max(1.5rem,env(safe-area-inset-right));background:none;border:none;font-family:'DM Mono',monospace;font-size:1.1rem;line-height:1;color:var(--muted);cursor:pointer;padding:8px;z-index:100;}
#theme:hover{color:var(--text);}
.wrap{max-width:860px;margin:0 auto;padding:max(80px,calc(env(safe-area-inset-top) + 64px)) max(24px,env(safe-area-inset-right)) max(60px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
.fade1{animation:fadeUp 0.45s ease both;}
.fade2{animation:fadeUp 0.45s 0.08s ease both;}
.fade3{animation:fadeUp 0.45s 0.16s ease both;}
.fade4{animation:fadeUp 0.45s 0.24s ease both;}
h1{font-family:'DM Mono',monospace;font-weight:400;font-size:2.2rem;color:var(--text);margin-bottom:6px;}
.sub{font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--muted);margin-bottom:36px;letter-spacing:0.04em;}
.filters{display:flex;flex-direction:column;gap:14px;margin-bottom:32px;}
.filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.filter-label{font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--muted);min-width:56px;letter-spacing:0.04em;}
.filter-btn{font-family:'DM Mono',monospace;font-size:0.7rem;padding:5px 13px;background:transparent;border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:border-color 0.12s,color 0.12s;}
.filter-btn:hover{border-color:var(--muted);color:var(--text);}
.filter-btn.active{border-color:var(--text);color:var(--text);background:var(--bg2);}
.daily-note{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--muted);margin-top:-4px;letter-spacing:0.04em;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-family:'DM Mono',monospace;font-size:0.72rem;}
thead th{color:var(--muted);font-weight:300;text-align:left;padding:0 7px 10px;border-bottom:1px solid var(--line);letter-spacing:0.04em;white-space:nowrap;}
thead th.right{text-align:right;}
tbody tr{border-bottom:1px solid var(--line);transition:background 0.1s;}
tbody tr:hover{background:var(--bg2);}
tbody td{padding:11px 7px;color:var(--text);vertical-align:middle;white-space:nowrap;}
tbody td.right{text-align:right;}
tbody td.muted{color:var(--muted);}
.rank{font-size:0.8rem;min-width:28px;display:inline-block;text-align:right;}
.rank-1{color:#c8a020;}
.rank-2{color:#9ba0a8;}
.rank-3{color:#9a6a38;}
.score-val{color:#c8a020;font-weight:500;}
.diff-pill{display:inline-block;font-size:0.6rem;padding:1px 6px;border:1px solid var(--line);color:var(--muted);letter-spacing:0.04em;}
.state{text-align:center;padding:48px 0;font-family:'DM Mono',monospace;font-size:0.78rem;color:var(--muted);}
.state.error{color:#b04040;}
.refresh{font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--muted);background:none;border:1px solid var(--line);padding:5px 12px;cursor:pointer;margin-left:auto;display:block;}
.refresh:hover{color:var(--text);border-color:var(--muted);}
.header-row{display:flex;align-items:baseline;gap:16px;margin-bottom:28px;}
.count{font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--muted);}
.section-divider{margin:64px 0 28px;border:none;border-top:1px solid var(--line);}
.feed-heading{font-family:'DM Mono',monospace;font-weight:400;font-size:1rem;color:var(--text);}
.feed{font-family:'DM Mono',monospace;font-size:0.7rem;display:flex;flex-direction:column;gap:0;}
.feed-row{display:flex;align-items:baseline;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.feed-row:last-child{border-bottom:none;}
.feed-time{color:var(--muted);min-width:64px;font-size:0.62rem;letter-spacing:0.04em;}
.feed-name{color:var(--text);font-weight:500;min-width:60px;}
.feed-name.anon{color:var(--muted);font-weight:300;font-style:italic;}
.feed-score{color:#c8a020;font-weight:500;}
.feed-meta{color:var(--muted);font-size:0.65rem;flex:1;text-align:right;}
</style>
</head>
<body>
<a href="run.html" id="back">← run</a>
<button id="theme" onclick="toggleTheme()">+</button>
<div class="wrap">
  <div class="fade1">
    <h1>leaderboard</h1>
    <p class="sub">run  ·  endless runner  ·  all-time high scores</p>
  </div>
  <div class="fade2">
    <div class="filters">
      <div class="filter-row">
        <span class="filter-label">mode</span>
        <button class="filter-btn active" data-group="mode" data-val="all">all</button>
        <button class="filter-btn" data-group="mode" data-val="normal">normal</button>
        <button class="filter-btn" data-group="mode" data-val="daily">daily</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">difficulty</span>
        <button class="filter-btn active" data-group="diff" data-val="all">all</button>
        <button class="filter-btn" data-group="diff" data-val="easy">easy</button>
        <button class="filter-btn" data-group="diff" data-val="normal">normal</button>
        <button class="filter-btn" data-group="diff" data-val="hard">hard</button>
      </div>
      <div class="daily-note" id="daily-note" style="display:none;"></div>
    </div>
  </div>
  <div class="fade3">
    <div class="header-row">
      <span class="count" id="count"></span>
      <button class="refresh" onclick="load()">↻ refresh</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:36px">#</th>
            <th>name</th>
            <th class="right">score</th>
            <th>mode</th>
            <th>diff</th>
            <th class="right">coins</th>
            <th class="right" style="min-width:80px">when</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="state" class="state">loading…</div>
  </div>
  <div class="fade4">
    <hr class="section-divider">
    <div class="header-row">
      <h2 class="feed-heading">recent activity</h2>
      <span class="count" id="feed-count"></span>
      <button class="refresh" onclick="loadFeed()">↻ refresh</button>
    </div>
    <div id="feed" class="feed"></div>
    <div id="feed-state" class="state" style="padding:24px 0;">loading…</div>
  </div>
</div>
<script>
function getTheme(){return localStorage.getItem('theme')||'dark';}
function applyTheme(t){
  document.body.classList.toggle('dark',t==='dark');
  document.getElementById('theme').textContent=t==='dark'?'−':'+';
}
function toggleTheme(){const t=getTheme()==='dark'?'light':'dark'; localStorage.setItem('theme',t); applyTheme(t);}
applyTheme(getTheme());

let activeMode='all', activeDiff='all';

function todaySeed(){ return new Date().toISOString().slice(0,10); }

function updateDailyNote(){
  const el=document.getElementById('daily-note');
  if(activeMode==='daily'){
    el.textContent=`showing today's daily — ${todaySeed()}`;
    el.style.display='';
  } else {
    el.style.display='none';
    el.textContent='';
  }
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    if(btn.classList.contains('active')) return;
    const g=btn.dataset.group, v=btn.dataset.val;
    document.querySelectorAll(`.filter-btn[data-group="${g}"]`).forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if(g==='mode') activeMode=v;
    else activeDiff=v;
    updateDailyNote();
    load();
  });
});

function relativeDate(str){
  if(!str) return '';
  const d=new Date(str.endsWith('Z')?str:str+'Z');
  if(isNaN(d)) return str.slice(0,10);
  const diff=Date.now()-d.getTime();
  const min=Math.floor(diff/60000);
  if(min<1) return 'just now';
  if(min<60) return `${min}m ago`;
  const hr=Math.floor(min/60);
  if(hr<24) return `${hr}h ago`;
  const days=Math.floor(hr/24);
  if(days<7) return `${days}d ago`;
  if(days<31) return `${Math.floor(days/7)}w ago`;
  if(days<365) return `${Math.floor(days/30)}mo ago`;
  return `${Math.floor(days/365)}y ago`;
}

function compactNum(n){
  if(n<10000) return n.toLocaleString();
  if(n<1e6) return (n/1000).toFixed(n<1e5?1:0).replace(/\.0$/,'')+'k';
  if(n<1e9) return (n/1e6).toFixed(n<1e7?2:1).replace(/\.?0+$/,'')+'M';
  return (n/1e9).toFixed(2).replace(/\.?0+$/,'')+'B';
}

function rankLabel(i){
  if(i===0) return '<span class="rank rank-1">1</span>';
  if(i===1) return '<span class="rank rank-2">2</span>';
  if(i===2) return '<span class="rank rank-3">3</span>';
  return `<span class="rank">${i+1}</span>`;
}

function render(scores){
  const tbody=document.getElementById('tbody');
  const state=document.getElementById('state');
  if(!scores.length){
    tbody.innerHTML='';
    state.textContent='no scores yet';
    state.className='state';
    document.getElementById('count').textContent='';
    return;
  }
  state.textContent='';
  state.className='state';
  document.getElementById('count').textContent=`${scores.length} entr${scores.length===1?'y':'ies'}`;
  tbody.innerHTML=scores.map((s,i)=>`
    <tr>
      <td>${rankLabel(i)}</td>
      <td><strong>${esc(s.name)}</strong></td>
      <td class="right"><span class="score-val" title="${s.score.toLocaleString()}">${compactNum(s.score)}</span></td>
      <td class="muted">${esc(s.mode)}</td>
      <td><span class="diff-pill">${esc(s.difficulty)}</span></td>
      <td class="right muted" title="${s.coins.toLocaleString()}">◆ ${compactNum(s.coins)}</td>
      <td class="right muted">${relativeDate(s.created_at)}</td>
    </tr>
  `).join('');
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function load(){
  document.getElementById('state').textContent='loading…';
  document.getElementById('state').className='state';
  document.getElementById('tbody').innerHTML='';
  document.getElementById('count').textContent='';
  const params=new URLSearchParams();
  if(activeMode!=='all') params.set('mode',activeMode);
  if(activeDiff!=='all') params.set('diff',activeDiff);
  if(activeMode==='daily') params.set('seed',todaySeed());
  params.set('limit','100');
  try{
    const r=await fetch('/api/run/leaderboard?'+params);
    if(!r.ok){ const d=await r.json().catch(()=>({error:'server error'})); throw new Error(d.error||'server error'); }
    const d=await r.json();
    render(d.scores||[]);
  }catch(e){
    document.getElementById('state').textContent=e.message||'failed to load';
    document.getElementById('state').className='state error';
  }
}

load();

const feedEl=document.getElementById('feed');
const feedStateEl=document.getElementById('feed-state');
const feedCountEl=document.getElementById('feed-count');

function renderFeed(scores){
  if(!scores.length){
    feedEl.innerHTML='';
    feedStateEl.textContent='no activity yet';
    feedStateEl.className='state';
    feedCountEl.textContent='';
    return;
  }
  feedStateEl.textContent='';
  feedCountEl.textContent=`${scores.length} round${scores.length===1?'':'s'}`;
  feedEl.innerHTML=scores.map(s=>{
    const isAnon=s.name==='anon'||s.name==='anonymous';
    return `<div class="feed-row">
      <span class="feed-time">${relativeDate(s.created_at)}</span>
      <span class="feed-name${isAnon?' anon':''}">${esc(s.name)}</span>
      <span class="feed-score">${s.score.toLocaleString()} pts</span>
      <span class="feed-meta">${esc(s.difficulty)} · ${esc(s.mode)}</span>
    </div>`;
  }).join('');
}

async function loadFeed(){
  feedStateEl.textContent='loading…';
  feedStateEl.className='state';
  feedEl.innerHTML='';
  feedCountEl.textContent='';
  try{
    const r=await fetch('/api/run/leaderboard?sort=recent&limit=30');
    if(!r.ok){ const d=await r.json().catch(()=>({error:'server error'})); throw new Error(d.error||'server error'); }
    const d=await r.json();
    renderFeed(d.scores||[]);
  }catch(e){
    feedStateEl.textContent=e.message||'failed to load';
    feedStateEl.className='state error';
  }
}

loadFeed();
</script>
</body>
</html>
