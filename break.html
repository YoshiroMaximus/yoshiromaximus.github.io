<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>take a break</title>
  <link rel="icon" type="image/x-icon" href="/favistuff/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favistuff/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favistuff/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/favistuff/apple-touch-icon.png">
  <link rel="manifest" href="/favistuff/site.webmanifest">
  <meta name="description" content="Take a break - browser-playable things">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f5f4f0;
      --text: #1a1a1a;
      --muted: #888;
      --line: #d8d6d0;
      --tag-bg: #e8e6e2;
    }

    body.dark {
      --bg: #111110;
      --text: #e8e6e2;
      --muted: #666;
      --line: #2a2926;
      --tag-bg: #1e1d1b;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* ── Back link ── */
    .back-link {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--line);
      text-decoration: none;
      letter-spacing: 0.06em;
      transition: color 0.2s ease;
      z-index: 100;
    }

    .back-link:hover { color: var(--muted); }

    /* ── Theme toggle ── */
    .theme-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.1rem;
      z-index: 100;
    }

    .theme-btn {
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      color: var(--line);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.15rem 0.3rem;
      line-height: 1;
      transition: color 0.2s ease;
      user-select: none;
    }

    .theme-btn:hover { color: var(--muted); }
    .theme-btn.active { color: var(--text); }

    /* ── Container ── */
    .container {
      display: flex;
      flex-direction: column;
      max-width: 480px;
      width: 100%;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.1s forwards;
    }

    /* ── Header ── */
    .page-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 3rem;
      color: var(--text);
    }

    /* ── Game links ── */
    .games {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--line);
    }

    .game-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: var(--text);
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      width: 100%;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: padding-left 0.2s ease;
    }

    .game-link:hover { padding-left: 0.5rem; }

    .game-name {
      font-size: 1rem;
      font-weight: 400;
    }

    .game-arrow {
      font-size: 0.9rem;
      color: var(--muted);
      transition: transform 0.2s ease;
    }

    .game-link:hover .game-arrow { transform: translateX(4px); }

    .star {
      font-size: 0.75rem;
      color: var(--accent2, #7a9490);
      margin-left: 0.5rem;
      vertical-align: 0.1em;
    }

    /* ── Disclaimer ── */
    .disclaimer {
      margin-top: 2.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--line);
      letter-spacing: 0.06em;
      line-height: 1.6;
      max-width: 360px;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <a class="back-link" href="/index.html">← index</a>

  <div class="theme-toggle">
    <button class="theme-btn" id="btn-light" onclick="setTheme('light')" title="Light">+</button>
    <button class="theme-btn" id="btn-dark" onclick="setTheme('dark')" title="Dark">−</button>
  </div>

  <div class="container">
    <p class="page-label">take a break</p>
    <h1>play</h1>

    <div class="games">
      <a class="game-link" href="https://r2.sn4k.org/1.12-wasm.html" target="_blank" rel="noopener">
        <span class="game-name">minecraft</span>
        <span class="game-arrow">→</span>
      </a>
      <a class="game-link" href="https://r2.sn4k.org/amog.html" target="_blank" rel="noopener">
        <span class="game-name">among us</span>
        <span class="game-arrow">→</span>
      </a>
      <a class="game-link" href="/break-times/run.html" target="_blank" rel="noopener">
        <span class="game-name">run<span class="star">★</span></span>
        <span class="game-arrow">→</span>
      </a>
      <a class="game-link" href="/break-times/gambit.html" target="_blank" rel="noopener">
        <span class="game-name">gambit rogue<span class="star">★</span></span>
        <span class="game-arrow">→</span>
      </a>
      <a class="game-link" href="https://r2.sn4k.org/drift/index.html" target="_blank" rel="noopener">
        <span class="game-name">drift</span>
        <span class="game-arrow">→</span>
      </a>
      <a class="game-link" href="https://r2.sn4k.org/karlson/index.html" target="_blank" rel="noopener">
        <span class="game-name">karlson</span>
        <span class="game-arrow">→</span>
      </a>
      <a class="game-link" href="https://r2.sn4k.org/ultrakill/index.html" target="_blank" rel="noopener">
        <span class="game-name">ultrakill</span>
        <span class="game-arrow">→</span>
      </a>
      <a class="game-link" href="https://r2.sn4k.org/webfishing/index.html" target="_blank" rel="noopener">
        <span class="game-name">webfishing</span>
        <span class="game-arrow">→</span>
      </a>
      <a class="game-link" href="https://r2.sn4k.org/balatro%20(gba)/index.html" target="_blank" rel="noopener">
        <span class="game-name">balatro<span class="star">★</span></span>
        <span class="game-arrow">→</span>
      </a>
    </div>

    <p class="disclaimer">
      some of these were made by me —<br>
      others are here as curated browser breaks.
    </p>
  </div>

  <script>
    function setTheme(theme) {
      document.body.classList.toggle('dark', theme === 'dark');
      document.getElementById('btn-light').classList.toggle('active', theme === 'light');
      document.getElementById('btn-dark').classList.toggle('active', theme === 'dark');
      localStorage.setItem('theme', theme);
    }

    const saved = localStorage.getItem('theme') || 'light';
    setTheme(saved);

  </script>
</body>
</html>
