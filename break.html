<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>take a break</title>
  <link rel="icon" type="image/x-icon" href="/favistuff/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favistuff/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favistuff/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/favistuff/apple-touch-icon.png">
  <link rel="manifest" href="/favistuff/site.webmanifest">
  <meta name="description" content="Take a break - browser-playable things">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f5f4f0;
      --text: #1a1a1a;
      --muted: #888;
      --line: #d8d6d0;
      --tag-bg: #e8e6e2;
    }

    body.dark {
      --bg: #111110;
      --text: #e8e6e2;
      --muted: #666;
      --line: #2a2926;
      --tag-bg: #1e1d1b;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* ── Back link ── */
    .back-link {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--line);
      text-decoration: none;
      letter-spacing: 0.06em;
      transition: color 0.2s ease;
      z-index: 100;
    }

    .back-link:hover { color: var(--muted); }

    /* ── Theme toggle ── */
    .theme-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.1rem;
      z-index: 100;
    }

    .theme-btn {
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      color: var(--line);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.15rem 0.3rem;
      line-height: 1;
      transition: color 0.2s ease;
      user-select: none;
    }

    .theme-btn:hover { color: var(--muted); }
    .theme-btn.active { color: var(--text); }

    /* ── Container ── */
    .container {
      display: flex;
      flex-direction: column;
      max-width: 480px;
      width: 100%;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.1s forwards;
    }

    /* ── Header ── */
    .page-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 3rem;
      color: var(--text);
    }

    /* ── Game links ── */
    .games {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--line);
    }

    .game-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: var(--text);
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      width: 100%;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: padding-left 0.2s ease;
    }

    .game-link:hover { padding-left: 0.5rem; }

    .game-name {
      font-size: 1rem;
      font-weight: 400;
    }

    .game-arrow {
      font-size: 0.9rem;
      color: var(--muted);
      transition: transform 0.2s ease;
    }

    .game-link:hover .game-arrow { transform: translateX(4px); }

    /* ── Version modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: transparent;
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 1.5rem;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      font-family: 'DM Mono', monospace;
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .modal-overlay.open .modal {
      opacity: 1;
      transform: translateY(0);
    }

    .modal-label {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.6rem 1rem 0.5rem;
      background: var(--bg);
    }

    .modal-option {
      display: block;
      padding: 0.7rem 1rem;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      color: var(--text);
      text-decoration: none;
      background: var(--bg);
      transition: background 0.15s ease;
      white-space: nowrap;
    }

    .modal-option:hover { background: var(--line); }

    .modal-cancel {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.5rem 1rem 0.6rem;
      background: var(--bg);
      cursor: pointer;
      border: none;
      font-family: 'DM Mono', monospace;
      text-align: right;
      width: 100%;
      transition: color 0.15s ease;
    }

    .modal-cancel:hover { color: var(--text); }

    /* ── Disclaimer ── */
    .disclaimer {
      margin-top: 2.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--line);
      letter-spacing: 0.06em;
      line-height: 1.6;
      max-width: 360px;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <a class="back-link" href="/index.html">← index</a>

  <div class="theme-toggle">
    <button class="theme-btn" id="btn-light" onclick="setTheme('light')" title="Light">+</button>
    <button class="theme-btn" id="btn-dark" onclick="setTheme('dark')" title="Dark">−</button>
  </div>

  <div class="container">
    <p class="page-label">take a break</p>
    <h1>play</h1>

    <div class="games">
      <button class="game-link" onclick="openModal()">
        <span class="game-name">minecraft</span>
        <span class="game-arrow">→</span>
      </button>
      <a class="game-link" href="/break-times/10mins.html" target="_blank" rel="noopener">
        <span class="game-name">10 minutes till dawn</span>
        <span class="game-arrow">→</span>
      </a>
      <a class="game-link" href="/break-times/amog.html" target="_blank" rel="noopener">
        <span class="game-name">among us</span>
        <span class="game-arrow">→</span>
      </a>
      <a class="game-link" href="/break-times/run.html" target="_blank" rel="noopener">
        <span class="game-name">run</span>
        <span class="game-arrow">→</span>
      </a>
      <a class="game-link" href="/break-times-large/karlson/index.html" target="_blank" rel="noopener">
        <span class="game-name">karlson</span>
        <span class="game-arrow">→</span>
      </a>
      <a class="game-link" href="/break-times-large/repo/index.html" target="_blank" rel="noopener">
        <span class="game-name">r.e.p.o</span>
        <span class="game-arrow">→</span>
      </a>
      <a class="game-link" href="/break-times-large/ultrakill/index.html" target="_blank" rel="noopener">
        <span class="game-name">ultrakill</span>
        <span class="game-arrow">→</span>
      </a>
    </div>

    <!-- Version selector modal -->
    <div class="modal-overlay" id="mc-modal" onclick="handleOverlayClick(event)">
      <div class="modal">
        <span class="modal-label">pick a version</span>
        <a class="modal-option" href="/break-times/1.8-wasm.html" target="_blank" rel="noopener">1.8 &nbsp;→</a>
        <a class="modal-option" href="/break-times/1.12-wasm.html" target="_blank" rel="noopener">1.12 →</a>
        <button class="modal-cancel" onclick="closeModal()">cancel</button>
      </div>
    </div>

    <p class="disclaimer">
      none of these were made by me —<br>
      i'm just the curator. all credit goes to their original creators.
    </p>
  </div>

  <script>
    function setTheme(theme) {
      document.body.classList.toggle('dark', theme === 'dark');
      document.getElementById('btn-light').classList.toggle('active', theme === 'light');
      document.getElementById('btn-dark').classList.toggle('active', theme === 'dark');
      localStorage.setItem('theme', theme);
    }

    const saved = localStorage.getItem('theme') || 'light';
    setTheme(saved);

    function openModal() {
      const modal = document.getElementById('mc-modal');
      modal.style.display = 'flex';
      requestAnimationFrame(() => modal.classList.add('open'));
    }

    function closeModal() {
      const modal = document.getElementById('mc-modal');
      modal.classList.remove('open');
      setTimeout(() => modal.style.display = 'none', 150);
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('mc-modal')) closeModal();
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
